        if (vt && mem::hp(vt)) {
            uintptr_t fnAddr = mem::rd<uintptr_t>(vt + 51 * 8);
            // Проверяем, что функция валидна и принадлежит движку
            if (fnAddr && mem::isCodePtr(fnAddr, "engine2.dll")) {
                typedef void(__fastcall* ExecCmdFn)(void*, int, const char*, bool, double, uint64_t);
                ExecCmdFn fn = (ExecCmdFn)fnAddr;
                __try {
                    fn(s_engineClient, 0, cmd, true, std::numeric_limits<double>::quiet_NaN(), 0);
                    return true;
                }

                __except (EXCEPTION_EXECUTE_HANDLER) {
                    CrashLog("[EXEC-ERR] SEH inside ExecuteClientCmd!\n");
