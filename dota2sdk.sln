static int lua_CustomPrint(lua_State* L) {
    int n = lua_gettop(L);
    for (int i = 1; i <= n; i++) {
        const char* s = lua_tostring(L, i);
        if (s) {
            CrashLog("[LUA_PRINT] %s\n", s);
        }

        else {
            CrashLog("[LUA_PRINT] <nil>\n");
        }
    }

    return 0;
}

static int SafeMissingMethod_Call(lua_State* L) {
    const char* k = lua_tostring(L, lua_upvalueindex(1));
    if (!k) { lua_pushnil(L); return 1; }
    if (strncmp(k, "Is", 2) == 0) { lua_pushboolean(L, false); return 1; }
    if (strncmp(k, "Has", 3) == 0) { lua_pushboolean(L, false); return 1; }
    if (strncmp(k, "Can", 3) == 0) { lua_pushboolean(L, false); return 1; }
    if (strncmp(k, "Get", 3) == 0) { lua_pushinteger(L, 0); return 1; }
    lua_pushnil(L);
    return 1;
}

static int SafeMissingMethod(lua_State* L) {
    const char* key = lua_tostring(L, 2);
    if (!key) { lua_pushnil(L); return 1; }
    static char g_loggedKeys[256][40] = { 0 };
    static volatile LONG g_loggedCount = 0;
    bool found = false;
    int lim = (int)InterlockedCompareExchange(&g_loggedCount, 0, 0);
    if (lim > 256) lim = 256;
    for (int i = 0; i < lim; ++i) {
        if (strncmp(g_loggedKeys[i], key, 39) == 0) { found = true; break; }
    }

    if (!found) {
        LONG idx = InterlockedIncrement(&g_loggedCount) - 1;
        if (idx < 256) {
            strncpy_s(g_loggedKeys[idx], key, 39);
            const char* selfName = "?";
            lua_getglobal(L, "__MISSING_MOD_NAME");
            if (lua_isstring(L, -1)) selfName = lua_tostring(L, -1);
            lua_pop(L, 1);
            CrashLog("[MISSING-METHOD] %s.%s\n", selfName, key);
        }
    }

    lua_pushstring(L, key);
    lua_pushcclosure(L, SafeMissingMethod_Call, 1);
    return 1;
}

static void AttachFallback(lua_State* L, const char* globalName) {
    lua_getglobal(L, globalName);
    if (!lua_istable(L, -1)) { lua_pop(L, 1); return; }
    if (lua_getmetatable(L, -1)) {
        // Existing metatable: check if __index is already set.
        lua_getfield(L, -1, "__index");
        int hasIndex = !lua_isnil(L, -1);
        lua_pop(L, 1);
        if (hasIndex) {
            lua_pop(L, 2); // pop metatable + table
            return; // do not overwrite
        }

        // __index is nil — set our fallback on the existing metatable.
        lua_pushcfunction(L, SafeMissingMethod);
        lua_setfield(L, -2, "__index");
        lua_pop(L, 1); // pop metatable
    }

    else {
        lua_newtable(L);
        lua_pushcfunction(L, SafeMissingMethod);
        lua_setfield(L, -2, "__index");
        lua_setmetatable(L, -2);
    }

    lua_pop(L, 1); // pop table
}

int Lua_HTTP_Request(lua_State* L) {
    for (int i = 1; i <= lua_gettop(L); ++i) {
        if (lua_isfunction(L, i)) {
            lua_pushvalue(L, i);
            lua_newtable(L);
            lua_pushinteger(L, 200); lua_setfield(L, -2, "code");
            lua_pushinteger(L, 200); lua_setfield(L, -2, "status");
            lua_pushlstring(L, "[{\"hero_id\":0}]", 15); lua_setfield(L, -2, "body");
            lua_pushlstring(L, "[{\"hero_id\":0}]", 15); lua_setfield(L, -2, "response");
            if (lua_pcall(L, 1, 0, 0) != 0) lua_pop(L, 1);
            break;
        }
    }

    lua_pushnil(L);
    return 1;
}

