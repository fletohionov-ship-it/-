namespace mem {
    inline uintptr_t base(const char* m) { return (uintptr_t)GetModuleHandleA(m); }
    inline bool hp(uintptr_t p) {
        // (p >> 32) != (p & 0xFFFFFFFFULL) отсекает 32-битные числа типа 0x3D088889, 
        // но позволяет читать нечетные смещения (например, m_iTeamNum = 0x3E7).
        return p > 0x100000000ULL && p < 0x00007FFFFCCCCCCCULL && (p >> 32) != (p & 0xFFFFFFFFULL);
    }

    template<typename T>
    inline T rd(uintptr_t a) {
        if (!hp(a)) return T{};
        __try {
            return *(T*)a;
        }

        __except (EXCEPTION_EXECUTE_HANDLER) {
            return T{};
        }
    }

    inline bool isCodePtr(uintptr_t p, const char* module) {
        HMODULE h = GetModuleHandleA(module);
        if (!h) return false;
        MODULEINFO mi{};
        GetModuleInformation(GetCurrentProcess(), h, &mi, sizeof(mi));
        uintptr_t base = (uintptr_t)mi.lpBaseOfDll;
        return p >= base && p < base + mi.SizeOfImage;
    }

    // Проверяет, что указатель лежит в куче (НЕ внутри секций client.dll), а его vtable указывает в client.dll
    inline bool isHeapObj(uintptr_t p) {
        if (!hp(p) || isCodePtr(p, "client.dll")) return false;
        uintptr_t vt = rd<uintptr_t>(p);
        return vt != 0 && isCodePtr(vt, "client.dll");
    }
}

inline float GetEntityYawDeg(uintptr_t ent) {
    if (!ent || !mem::hp(ent)) return 0.0f;
    uintptr_t scene = mem::rd<uintptr_t>(ent + (0x330));
    if (!scene || !mem::hp(scene)) return 0.0f;
    return mem::rd<float>(scene + 0xE8);
}

extern uintptr_t g_client;
static bool GetRTTIName(uintptr_t ent, char* out, size_t outSize) {
    if (!out || outSize < 2) return false;
    out[0] = '\0';
    if (!ent || !mem::hp(ent)) return false;
    uintptr_t vt = mem::rd<uintptr_t>(ent);
    if (!vt || !mem::hp(vt)) return false;
    uintptr_t col = mem::rd<uintptr_t>(vt - 8);
    if (!col || !mem::hp(col)) return false;
    uint32_t nameRva = mem::rd<uint32_t>(col + 0x0C);
    if (nameRva == 0 || nameRva > 0x8000000) return false;
    const char* name = (const char*)(g_client + nameRva + 0x10);
    if (!name) return false;
    __try {
        size_t n = strnlen(name, outSize - 1);
        if (n == 0) return false;
        memcpy(out, name, n);
        out[n] = '\0';
        return true;
    }

    __except (EXCEPTION_EXECUTE_HANDLER) {
        out[0] = '\0';
        return false;
    }
}

