static float ReadNativeCurTime(uintptr_t rules) {
    if (g_client) {
        const uintptr_t slot = g_client + dwGlobalVars;
        const uintptr_t globals = mem::rd<uintptr_t>(slot);
        if ((globals & 7) == 0 && mem::hp(globals)) {
            const float time = mem::rd<float>(globals + GV_CURTIME);
            if (VulftEngine::IsValidNativeClock(time)) return time;
        }

        const float inlineTime = mem::rd<float>(slot + GV_CURTIME);
        if (VulftEngine::IsValidNativeClock(inlineTime)) return inlineTime;
    }

    return rules && g_off.m_fGameTime ? mem::rd<float>(rules + g_off.m_fGameTime) : 0.0f;
}

struct BotClockReading {
    double gameTime = 0.0;
    double dotaTime = 0.0;
};

static BotClockReading ReadBotClock() {
    static std::mutex clockMutex;
    const std::lock_guard<std::mutex> lock(clockMutex);
    const uint64_t now = GetTickCount64();
    static const uint64_t s_botEpochTick = now;
    static VulftEngine::MonotonicBotClock clock(s_botEpochTick);
    static BotClockReading reading;
    static uint64_t lastSampleTick = 0;
    static int phase = 0;
    static double phaseStarted = 0.0;
    static double phaseOffset = 0.0;
    if (lastSampleTick && lastSampleTick == now) return reading;
    lastSampleTick = now;

    const uintptr_t rules = GetGameRulesInstance();
    const int gameState = ReadGameRulesStateSafe(rules);
    const float nativeTime = ReadNativeCurTime(rules);
    reading.gameTime = clock.Advance(now, nativeTime);

    // Keep the last known phase while the proxy is temporarily unavailable.
    if (gameState && gameState != phase) {
        const uintptr_t startOffset = g_off.m_flGameStartTime ? g_off.m_flGameStartTime : 0x594;
        const float nativeStart = mem::rd<float>(rules + startOffset);
        const bool hasNativeStart = VulftEngine::IsValidNativeClock(nativeTime)
            && VulftEngine::IsValidNativeClock(nativeStart);
        const double nativeMatchTime = hasNativeStart ? nativeTime - nativeStart : 0.0;
        phaseStarted = reading.gameTime;
        phaseOffset = 0.0;
        if (gameState == 4) {
            phaseOffset = nativeMatchTime < 0.0 && nativeMatchTime >= -180.0 ? nativeMatchTime : -30.0;
        } else if (gameState == 5 && phase != 4 && nativeMatchTime > 0.0 && nativeMatchTime < 10000.0) {
            phaseOffset = nativeMatchTime;
        }
        phase = gameState;
    }

    if (phase == 4 || phase == 5) {
        reading.dotaTime = phaseOffset + (reading.gameTime - phaseStarted);
        if (phase == 4 && reading.dotaTime > -1.0) {
            // If the estimated countdown expires, keep moving toward zero until the horn.
            reading.dotaTime = -1.0 / (2.0 + reading.dotaTime);
        }
    } else {
        reading.dotaTime = reading.gameTime;
    }
    return reading;
}

// Timer deadlines and Dota's match clock share a source but keep separate epochs.
float GameRules_GetGameTime() { return (float)ReadBotClock().gameTime; }
