    static float GetNativeAttackRange(uintptr_t p) {
        if (!p || !mem::hp(p)) return 150.0f;
        if (g_off.m_iAttackRange > 0) {
            int baseRange = mem::rd<int>(p + g_off.m_iAttackRange);
