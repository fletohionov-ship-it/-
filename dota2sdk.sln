    static bool PushAbilityKVRecord(lua_State* L, uintptr_t a) {
        if (!a || !mem::hp(a)) return false;
        char name[128] = { 0 };
        if (!GetEntityDesignerName(a, name, sizeof(name)) || !name[0]) return false;
        const char* kvTable = (strncmp(name, "item_", 5) == 0) ? "items" : "npc_abilities";
        auto it = g_kvRefs.find(kvTable);
        if (it == g_kvRefs.end() || it->second == LUA_NOREF) return false;
        lua_rawgeti(L, LUA_REGISTRYINDEX, it->second);
        if (!lua_istable(L, -1)) { lua_pop(L, 1); return false; }
        lua_getfield(L, -1, name);
        if (lua_istable(L, -1)) {
            lua_remove(L, -2);
            return true;
        }

        lua_pop(L, 1);
        for (const char* rootKey : { "DOTAAbilities", "DOTAItems" }) {
            lua_getfield(L, -1, rootKey);
            if (lua_istable(L, -1)) {
                lua_getfield(L, -1, name);
                if (lua_istable(L, -1)) {
                    lua_remove(L, -2);
                    lua_remove(L, -2);
                    return true;
                }

                lua_pop(L, 1);
            }

            lua_pop(L, 1);
        }

        lua_pop(L, 1);
        return false;
    }

    static int ParseBehaviorMaskFromKV(lua_State* L, uintptr_t a) {
        if (!PushAbilityKVRecord(L, a)) return 0;
        lua_getfield(L, -1, "AbilityBehavior");
        const char* s = lua_tostring(L, -1);
        int mask = 0;
        if (s) {
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_HIDDEN")) mask |= (1 << 1);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_PASSIVE")) mask |= (1 << 2);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_NO_TARGET")) mask |= (1 << 3);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_UNIT_TARGET")) mask |= (1 << 4);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_POINT")) mask |= (1 << 5);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_AOE")) mask |= (1 << 6);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_NOT_LEARNABLE")) mask |= (1 << 7);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_CHANNELLED")) mask |= (1 << 8);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_ITEM")) mask |= (1 << 9);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_TOGGLE")) mask |= (1 << 10);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_DIRECTIONAL")) mask |= (1 << 11);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_IMMEDIATE")) mask |= (1 << 12);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_AUTOCAST")) mask |= (1 << 13);
            if (strstr(s, "DOTA_ABILITY_BEHAVIOR_VECTOR_TARGETING")) mask |= (1 << 30);
        }

        lua_pop(L, 2);
        return mask;
    }

    static float ParseLevelNumberFromStr(const char* s, int level) {
        if (!s || !*s) return 0.0f;
        if (level < 1) level = 1;
        float val = 0.0f;
        const char* p = s;
        for (int i = 1; i <= level; ++i) {
            while (*p == ' ' || *p == '\t') ++p;
            if (!*p) break;
            char* endp = nullptr;
            float v = strtof(p, &endp);
            if (endp == p) break;
            val = v;
            p = endp;
        }

        return val;
    }

    int AB_CanBeUpgraded(lua_State* L) {
        uintptr_t a = checkEnt(L, 1);
        if (!a || !mem::hp(a)) { lua_pushboolean(L, false); return 1; }
        char abilityName[256] = { 0 };
        if (!GetEntityDesignerName(a, abilityName, sizeof(abilityName)) || !abilityName[0]) {
            lua_pushboolean(L, false);
            return 1;
        }

        if (strstr(abilityName, "generic_hidden") != nullptr ||
            strstr(abilityName, "ability_capture") != nullptr ||
            strstr(abilityName, "default_attack") != nullptr ||
            strstr(abilityName, "attribute_bonus") != nullptr) {
            lua_pushboolean(L, false);
            return 1;
        }

        int beh = ParseBehaviorMaskFromKV(L, a);
        if ((beh & (1 << 1)) || (beh & (1 << 7))) {
            lua_pushboolean(L, false);
            return 1;
        }

        int currentLevel = ReadAbilityLevelSafe(a);
        uintptr_t caster = g_Pawn;
        if (!caster || !mem::hp(caster)) {
            lua_pushboolean(L, currentLevel < 4);
            return 1;
        }

        int heroLevel = mem::rd<int>(caster + g_off.m_iCurrentLevel);
        if (heroLevel < 1) heroLevel = 1;
        if (heroLevel - ::g_totalTrainedPoints <= 0) {
            lua_pushboolean(L, false);
            return 1;
        }

        if (strncmp(abilityName, "special_bonus_", 14) == 0) {
            lua_pushboolean(L, heroLevel >= 10 && currentLevel < 1);
            return 1;
        }

        bool isUlt = (GetUnitAbilityBySlot(caster, 5) == a);
        if (!isUlt && PushAbilityKVRecord(L, a)) {
            lua_getfield(L, -1, "AbilityType");
            const char* at = lua_tostring(L, -1);
            if (at && strstr(at, "ULTIMATE")) isUlt = true;
            lua_pop(L, 2);
        }

        if (isUlt) {
            int maxUlt = (heroLevel >= 18) ? 3 : (heroLevel >= 12) ? 2 : (heroLevel >= 6) ? 1 : 0;
            lua_pushboolean(L, currentLevel < maxUlt);
            return 1;
        }

        int maxAllowed = (heroLevel + 1) / 2;
        if (maxAllowed > 4) maxAllowed = 4;
        lua_pushboolean(L, currentLevel < maxAllowed);
        return 1;
    }

