    lua_rawget(L, 1);
    return 1;
}

static void InstallMenuOverrides(lua_State* L) {
    lua_getglobal(L, "Menu");
    if (lua_istable(L, -1)) {
        lua_newtable(L);
        lua_pushcfunction(L, MenuIndexHandler);
        lua_setfield(L, -2, "__index");
        lua_setmetatable(L, -2);
        CrashLog("[API] Menu metatable override installed\n");
    }

    lua_pop(L, 1);
    lua_getglobal(L, "menu");
    if (lua_istable(L, -1)) {
        lua_newtable(L);
        lua_pushcfunction(L, MenuIndexHandler);
        lua_setfield(L, -2, "__index");
        lua_setmetatable(L, -2);
        CrashLog("[API] menu metatable override installed\n");
    }

    lua_pop(L, 1);
}

typedef void(__fastcall* CreateMoveFn)(void*, void*);
static CreateMoveFn oCreateMove = nullptr;
struct NetChanContext {
    int playerIndex; // +0x00
    int padding;     // +0x04
    char flags[8];   // +0x08 (флаг 5)
};
static bool NativeLockHero(int heroId, bool lockIn) {
    if (!g_client) return false;
    typedef void* (__fastcall* fn_GetGC)();
    fn_GetGC GetGC = (fn_GetGC)(g_client + 0x3358610);
    void* pGC = nullptr;
    __try { pGC = GetGC(); }
    __except (EXCEPTION_EXECUTE_HANDLER) { return false; }
    if (!pGC || !mem::hp((uintptr_t)pGC)) return false;
    alignas(16) char header[0x80] = { 0 };
    typedef void(__fastcall* fn_CreateMsg)(void* header, int msgId);
    fn_CreateMsg CreateMsg = (fn_CreateMsg)(g_client + 0x370A2D0);
    __try { CreateMsg(header, 0x1B7E); }
    __except (EXCEPTION_EXECUTE_HANDLER) { return false; }
    *(uintptr_t*)header = g_client + 0x3A128F0; // Correct VTable
    void* payload = *(void**)(header + 0x10);
    if (!payload) return false;
    __try {
        *(uint32_t*)((uintptr_t)payload + 0x10) = 3;
        *(int*)((uintptr_t)payload + 0x18) = lockIn ? 1 : 0;
        *(int*)((uintptr_t)payload + 0x20) = heroId;
    }

    __except (EXCEPTION_EXECUTE_HANDLER) { return false; }
    typedef void(__fastcall* fn_SendMessage)(void* pGC, void* header);
    fn_SendMessage SendMessage = (fn_SendMessage)(g_client + 0x3355C70);
    __try {
        SendMessage(pGC, header);
        CrashLog("[AUTO-PICK] NativeLockHero SUCCESS for ID: %d\n", heroId);
    }

    __except (EXCEPTION_EXECUTE_HANDLER) { return false; }
    return true;
}

typedef int(__fastcall* GC_SendNetMsgFn)(void*, bool*, void*);
static GC_SendNetMsgFn oGC_SendNetMsg = nullptr;
int __fastcall hkGC_SendNetMsg(void* pThis, bool* pbReliable, void* pMsg) {
    if (pbReliable && pMsg && mem::hp((uintptr_t)pMsg)) {
        __try {
            // Дампим только те пакеты, которые могут быть выбором героя (первые 16 байт)
            // Или фильтруем по VTable, если знаем его.
            uint8_t* bytes = (uint8_t*)pMsg;
            // Чтобы не спамить, логируем раз в 100мс
            static uint64_t s_lastLog = 0;
            if (GetTickCount64() - s_lastLog > 100) {
                s_lastLog = GetTickCount64();
                CrashLog("[GC-DUMP] pMsg: 0x%llX | %02X %02X %02X %02X %02X %02X %02X %02X | %02X %02X %02X %02X %02X %02X %02X %02X\n",
                    (unsigned long long)pMsg,
                    bytes[0], bytes[1], bytes[2], bytes[3], bytes[4], bytes[5], bytes[6], bytes[7],
                    bytes[8], bytes[9], bytes[10], bytes[11], bytes[12], bytes[13], bytes[14], bytes[15]);
            }
        }

        __except (EXCEPTION_EXECUTE_HANDLER) {}
    }

    if (oGC_SendNetMsg) return oGC_SendNetMsg(pThis, pbReliable, pMsg);
    return 0;
}

void __fastcall hkCreateMove(void* thisptr, void* cmd_context) {
    if (g_Pawn && mem::hp(g_Pawn)) {
        static uint64_t s_lastSmartLhTick = 0;
        uint64_t nowMs = GetTickCount64();
        if (!s_lastSmartLhTick || nowMs - s_lastSmartLhTick >= kBotTickIntervalMs) {
            s_lastSmartLhTick = nowMs;
            SmartCore::RunSmartAutoLastHit(60.0f, true, true);
            SmartCore::OnGameThreadFlush();
        }
    }
    if (oCreateMove) oCreateMove(thisptr, cmd_context);
    int gs = GameRules_GetGameState(); // 0 = Menu, 2 = Draft, 5 = Game
    uintptr_t pMatchMgr = mem::rd<uintptr_t>(g_client + 0x6402898);
    uintptr_t pHud = mem::rd<uintptr_t>(g_client + 0x6407660);
    static uint64_t s_lastDraftState = 0;
    // 1. АВТОПОИСК (выполняется через консоль)
    if (g_flagFindMatch && gs == 0 && pMatchMgr && mem::hp(pMatchMgr)) {
        g_flagFindMatch = false;
        // Команда уже вызвана в TriggerStartSearch, здесь можно добавить лог
        CrashLog("[SEARCH] Matchmaking triggered natively.\n");
    }

    // 2. АВТОПРИНЯТИЕ (выполняется через консоль)
    if (g_flagAcceptMatch && gs == 0) {
        g_flagAcceptMatch = false;
        ExecuteEngineConsoleCmd("dota_match_accept");
        CrashLog("[ACCEPT] Console 'dota_match_accept' executed.\n");
    }

    // 3. ПИК ГЕРОЯ
    if (g_flagPickHero && (gs == 2 || gs == 3)) {
        if (s_lastDraftState == 0) s_lastDraftState = GetTickCount64();
        if (GetTickCount64() - s_lastDraftState > 2000) {
            g_flagPickHero = false;
            // NativeLockHero(g_targetPickHeroId, true); // ОТКЛЮЧЕНО
            CrashLog("[AUTO-PICK] AutoPick executed via ExecuteClientCmd.\n");
        }
    }

    else if (gs == 0 || gs == 5) {
        s_lastDraftState = 0;
    }

    // 4. РЕКОННЕКТ (выполняется через консоль)
    if (g_flagRetry) {
        g_flagRetry = false;
        // Команда уже вызвана в TriggerAutoReconnect
        CrashLog("[RECONNECT] Reconnect triggered natively.\n");
    }

    // 5. КАМЕРА
    if (g_flagCameraHandle != 0xFFFFFFFF) {
        typedef void(__fastcall* SetCamFn)(void*, uint32_t);
        SetCamFn SetCam = (SetCamFn)(g_client + 0x1FFA070);
        __try { SetCam(nullptr, g_flagCameraHandle); }
        __except (EXCEPTION_EXECUTE_HANDLER) {}
        g_flagCameraHandle = 0xFFFFFFFF;
    }
}

static void InstallCreateMoveHook() {
    if (!g_client) return;
    uintptr_t target = g_client + 0x1966630;
    if (MH_CreateHook((LPVOID)target, &hkCreateMove, (LPVOID*)&oCreateMove) == MH_OK) {
        MH_EnableHook((LPVOID)target);
        CrashLog("[HOOK] CreateMove hooked successfully!\n");
    }
}

void InitBot() {
    strncpy_s(g_sdkPhase, sizeof(g_sdkPhase), "InitBot", sizeof(g_sdkPhase) - 1);
    g_sdkPhase[sizeof(g_sdkPhase) - 1] = '\0';
    std::cout << CYN << "[BOT] v64.0 entered\n" << RST;
    CrashLog("[BOT] v64.0 entered\n");
    g_GridNav.Init();
    g_L = luaL_newstate();
    if (!g_L) { printf("[!] luaL_newstate failed\n"); return; }
    luaL_openlibs(g_L);
    LoadAllKV(g_L);
    LoadItemsFullJson();
    SetGCSteamID(g_L);
    SetupLuaAPI(g_L);
    CrashLog("[EIH] L_EntityIndexHandler ptr=0x%llX\n",
        (unsigned long long)(uintptr_t) & L_EntityIndexHandler);
    {
        lua_getglobal(g_L, "NPC");
        if (lua_istable(g_L, -1)) {
            if (lua_getmetatable(g_L, -1)) {
                lua_getfield(g_L, -1, "__index");
                int t = lua_type(g_L, -1);
                const void* p = (t == LUA_TFUNCTION) ? (const void*)lua_tocfunction(g_L, -1) : nullptr;
                CrashLog("[NPC-MT] getmetatable(NPC).__index type=%s ptr=0x%llX\n",
                    lua_typename(g_L, t), (unsigned long long)(uintptr_t)p);
                lua_pop(g_L, 1);
                lua_pop(g_L, 1); // metatable
            }

            else {
                CrashLog("[NPC-MT] NPC has no metatable\n");
            }
        }

        else {
            CrashLog("[NPC-MT] NPC is not a table after SetupLuaAPI!\n");
        }

        lua_pop(g_L, 1);
    }

    {
        lua_getglobal(g_L, "XHelpers");
        if (lua_istable(g_L, -1)) {
            if (lua_getmetatable(g_L, -1)) {
                lua_getfield(g_L, -1, "__index");
                int t = lua_type(g_L, -1);
                const void* p = (t == LUA_TFUNCTION) ? (const void*)lua_tocfunction(g_L, -1) : nullptr;
                CrashLog("[XH-MT] XHelpers.__index type=%s ptr=0x%llX\n",
                    lua_typename(g_L, t), (unsigned long long)(uintptr_t)p);
                lua_pop(g_L, 1);
                lua_pop(g_L, 1);
            }

            else {
                CrashLog("[XH-MT] XHelpers has no metatable\n");
            }
        }

        else {
            CrashLog("[XH-MT] XHelpers is not a table!\n");
        }

        lua_pop(g_L, 1);
    }

    EnsureConfigDir();
    std::wstring luaDir = GetDllDirW();
    std::wstring luaScript = luaDir + L"scripts\\self_play\\main.lua";
    if (GetFileAttributesW(luaScript.c_str()) == INVALID_FILE_ATTRIBUTES) { CrashLog("[!] main.lua not found\n"); return; }
    {
        std::string a;
        int len = WideCharToMultiByte(CP_UTF8, 0, luaDir.c_str(), -1, nullptr, 0, nullptr, nullptr);
        if (len > 1) { a.resize(len - 1); WideCharToMultiByte(CP_UTF8, 0, luaDir.c_str(), -1, &a[0], len, nullptr, nullptr); }
        for (auto& ch : a) if (ch == '\\') ch = '/';
        std::string pkg = a + "scripts/?.lua;" + a + "scripts/?/init.lua";
        lua_getglobal(g_L, "package"); lua_pushstring(g_L, pkg.c_str()); lua_setfield(g_L, -2, "path"); lua_pop(g_L, 1);
    }

    {
        std::wstring wd = luaScript;
        size_t p = wd.find_last_of(L"\\/");
        if (p != std::wstring::npos) { wd = wd.substr(0, p); SetCurrentDirectoryW(wd.c_str()); }
    }

    if (!RunLuaBuffer(g_L, g_configLua, strlen(g_configLua), "@config")) CrashLog("[!] config failed\n");
    else CrashLog("[+] Config installed\n");
    if (!RunLuaBuffer(g_L, g_gcLua, strlen(g_gcLua), "@gc")) CrashLog("[!] gc failed\n");
    else CrashLog("[+] GC installed\n");
    std::string menuFull;
    menuFull.reserve(strlen(g_menuLua_p1) + strlen(g_menuLua_p2) + strlen(g_menuLua_p3));
    menuFull += g_menuLua_p1; menuFull += g_menuLua_p2; menuFull += g_menuLua_p3;
    if (!RunLuaBuffer(g_L, menuFull.c_str(), menuFull.size(), "@menu")) CrashLog("[!] menu failed\n");
    else {
        CrashLog("[+] Menu installed\n");
        InstallMenuOverrides(g_L);
    }

    std::string extraFull;
    extraFull.reserve(strlen(g_extraLua_p1) + strlen(g_extraLua_p2) + strlen(g_extraLua_p3) + strlen(g_extraLua_p4));
    extraFull += g_extraLua_p1; extraFull += g_extraLua_p2; extraFull += g_extraLua_p3; extraFull += g_extraLua_p4;
    if (!RunLuaBuffer(g_L, extraFull.c_str(), extraFull.size(), "@extra")) CrashLog("[!] extra failed\n");
    else CrashLog("[+] Extra installed\n");
    luaL_dostring(g_L,
        "local old_require = require; "
        "local function patchJsonMod(mod) "
        "  if type(mod) == 'table' and (mod.encode or mod.decode) then "
        "    mod.encodeFromJSON = function(a, b) "
        "      local t = (type(a) == 'table' and a == mod) and b or a; "
        "      if mod.encode then return mod.encode(mod, t) else return '{}' end; "
        "    end; "
        "    mod.decodeFromJSON = function(a, b) "
        "      local s = (type(a) == 'table' and a == mod) and b or a; "
        "      if mod.decode then return mod.decode(mod, s) else return {} end; "
        "    end; "
        "  end; "
        "  return mod; "
        "end; "
        "require = function(name) "
        "  local ok, mod = pcall(old_require, name); "
        "  if ok then return patchJsonMod(mod) end; "
        "  error(mod); "
        "end; "
        "_G.json = patchJsonMod(_G.json or old_require('assets.JSON')); "
        "_G.JSON = _G.json; "
        "for k, v in pairs(package.loaded) do patchJsonMod(v) end;"
    );
    CrashLog("[BOT] calling LoadLuaScript\n");
    bool loaded = LoadLuaScriptV2(g_L, luaScript, "@main.lua");
    if (loaded) { printf("[+] Lua script loaded\n"); CrashLog("[+] Lua script loaded\n"); }
    else { printf("[-] Lua load failed\n"); CrashLog("[-] Lua load failed\n"); }
    if (g_scriptOnScriptsLoadedRef != LUA_NOREF) {
        printf("[BOT] calling OnScriptsLoaded...\n");
        CrashLog("[BOT] calling OnScriptsLoaded...\n");
        CallScriptRef(g_L, g_scriptOnScriptsLoadedRef, "OnScriptsLoaded");
    }

    const char* forceEnableBot =
        "if Menu and Menu.Find then "
        " local paths = { "
        " {'Scripts','Bot','Control','Enabled'}, "
        " {'Scripts','Self Play','Main','Bot','Control','Enabled'}, "
        " {'Scripts','Self Play','Bot','Control','Enabled'}, "
        " {'Scripts','Main','Bot','Control','Enabled'} "
        " } "
        " local ok = false "
        " for _, p in ipairs(paths) do "
        " local w = Menu.Find(table.unpack(p)) "
        " if w and w.Set then w:Set(true); print('[forceEnable] OK '..table.concat(p,'/')) ; ok = true; break end "
        " end "
        " if not ok then print('[forceEnable] all paths failed') end "
        "end";
    if (luaL_dostring(g_L, forceEnableBot) != 0) {
        const char* err = lua_tostring(g_L, -1);
        printf("[!] Force-enable bot failed: %s\n", err ? err : "?");
        CrashLog("[!] Force-enable bot failed: %s\n", err ? err : "?");
        lua_pop(g_L, 1);
    }

    else {
        printf("[+] Bot control force-enabled\n");
        CrashLog("[+] Bot control force-enabled\n");
    }

    luaL_dostring(g_L, "if Menu and Menu.SyncBotConfig then Menu.SyncBotConfig() end");
    CrashLog("[BOT] Synced initial BotConfig to Lua menu\n");
    lua_getglobal(g_L, "OnTick");
    bool hasOnTick = lua_isfunction(g_L, -1);
    lua_pop(g_L, 1);
    printf("[BOT] Global OnTick defined: %s\n", hasOnTick ? "YES" : "NO");
    CrashLog("[BOT] Global OnTick defined: %s\n", hasOnTick ? "YES" : "NO");
    {
        lua_getglobal(g_L, "_G");
        if (lua_istable(g_L, -1)) {
            const char* mustExist[] = { "table", "string", "math", "os", "io", "pairs", "ipairs", "print", "require", "pcall", "select", "tostring", "tonumber" };
            for (size_t i = 0; i < sizeof(mustExist) / sizeof(mustExist[0]); ++i) {
                lua_getfield(g_L, -1, mustExist[i]);
                if (false) CrashLog("[GLOB] %-10s = %s\n", mustExist[i], lua_typename(g_L, lua_type(g_L, -1)));
                lua_pop(g_L, 1);
            }
        }

        lua_pop(g_L, 1);
    }

    // НЕ ставим хуки по захардкоженным RVA в .text (0x3DA0D0, 0x2E56610, 0x1966630),
    // так как при микро-патчах client.dll они сдвигаются и вызывают краш RIP=0x6C0!
    // A window or swap-chain caller may already have loaded the hook address.
    // Keep its pass-through code resident after disabling the hooks.
    HMODULE pinned = nullptr;
    if (!GetModuleHandleExW(GET_MODULE_HANDLE_EX_FLAG_FROM_ADDRESS | GET_MODULE_HANDLE_EX_FLAG_PIN,
            reinterpret_cast<LPCWSTR>(&g_hMod), &pinned)) {
        CrashLog("[HOOK] Module pin failed (%lu)\n", GetLastError());
        return;
    }
    InstallWndProcHook();
    InstallPresentHook();
}

static void DumpHex(const char* label, uintptr_t addr, int len) {
    CrashLog("[DUMP HEX] %s: addr=0x%llX\n", label, (unsigned long long)addr);
    if (!addr || !mem::hp(addr)) {
        CrashLog("[DUMP HEX] %s: invalid address\n", label);
        return;
    }

    unsigned char* p = (unsigned char*)addr;
    char buf[256];
    for (int i = 0; i < len; i += 16) {
        int off = 0;
        off += sprintf_s(buf + off, sizeof(buf) - off, "%04X: ", i);
        for (int j = 0; j < 16 && i + j < len; j++) {
            off += sprintf_s(buf + off, sizeof(buf) - off, "%02X ", p[i + j]);
        }

        CrashLog("[DUMP HEX] %s\n", buf);
    }
}

static bool IsRealHeapPtr(uintptr_t p) {
    if (p < 0x10000 || p > 0x00007FFFFFFFFFFF) return false;
    MEMORY_BASIC_INFORMATION mbi{};
    if (!VirtualQuery((LPCVOID)p, &mbi, sizeof(mbi))) return false;
    if (mbi.State != MEM_COMMIT) return false;
    if (mbi.Type == MEM_IMAGE) return false;   // reject module space
    if (mbi.Protect & (PAGE_NOACCESS | PAGE_GUARD)) return false;
    return true;
}

