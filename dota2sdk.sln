std::string GetDllDir() {
    char path[MAX_PATH] = { 0 };
    GetModuleFileNameA(g_hMod, path, MAX_PATH);
    std::string s(path);
    size_t pos = s.find_last_of("\\/");
    if (pos != std::string::npos) s = s.substr(0, pos + 1);
    return s;
}

std::string GetOffsetsPath() { return GetDllDir() + kOffsetsFile; }
std::string GetHeroVtPath() { return GetDllDir() + kHeroVtFile; }
bool SaveOffsets() {
    std::string path = GetOffsetsPath(); std::string tmp = path + ".tmp";
    std::ofstream f(tmp, std::ios::binary | std::ios::trunc);
    if (!f) return false; f.write((const char*)&g_off, sizeof(g_off)); f.close();
    if (GetFileAttributesA(path.c_str()) != INVALID_FILE_ATTRIBUTES) DeleteFileA(path.c_str());
    return MoveFileExA(tmp.c_str(), path.c_str(), MOVEFILE_REPLACE_EXISTING) != 0;
}

