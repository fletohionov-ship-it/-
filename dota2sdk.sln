void CrashLog(const char* fmt, ...) {
    if (!g_crashLog) return;
    va_list args; va_start(args, fmt);
    vfprintf(g_crashLog, fmt, args); va_end(args);
}

static bool StepTraceDue(uint64_t now, uint64_t& last) {
    if (last && now - last < 2000) return false;
    last = now;
    return true;
}

static void StepTrace(const char* source, const char* kind, const char* fmt, ...) {
    if (strcmp(kind, "LUA-ERR") != 0) return;
    static std::mutex traceMutex;
    static uint64_t lastError = 0;
    std::lock_guard<std::mutex> lock(traceMutex);
    if (!StepTraceDue(GetTickCount64(), lastError)) return;
    char message[512];
    va_list args;
    va_start(args, fmt);
    vsnprintf(message, sizeof(message), fmt, args);
    va_end(args);
    CrashLog("[STEP-TRACE] [%s] %s (%s)\n", kind, message, source);
}

