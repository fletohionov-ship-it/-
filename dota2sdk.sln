    static float Mod_GetRemainingTime(uintptr_t mod, float now) {
        if (!mod || !mem::hp(mod)) return 0.0f;
        float start = mem::rd<float>(mod + mod_m_flStartTime);
        float dur = mem::rd<float>(mod + mod_m_flDuration);
        if (dur < 0.0f || dur > 3600.0f) return 0.0f;
        float rem = (start + dur) - now;
        return rem > 0.0f ? rem : 0.0f;
    }

    static float FindModifierTime(uintptr_t ent, const char* substr, float now) {
        if (!ent || !mem::hp(ent) || !substr) return 0.0f;
        uintptr_t mgr = ent + g_off.m_ModifierManager;
        int32_t count = mem::rd<int32_t>(mgr + 0x10);
        uintptr_t list = mem::rd<uintptr_t>(mgr + 0x18);
        if (count <= 0 || count > 200 || !list || !mem::hp(list)) return 0.0f;
        float best = 0.0f;
        for (int i = 0; i < count; ++i) {
            uintptr_t mod = mem::rd<uintptr_t>(list + i * 8);
            if (!mod || !mem::hp(mod)) continue;
            const char* name = Mod_GetName(mod);
            if (!name) continue;
            __try {
                if (strstr(name, substr)) {
                    float r = Mod_GetRemainingTime(mod, now);
                    if (r > best) best = r;
                }
            }

            __except (EXCEPTION_EXECUTE_HANDLER) {}
        }

        return best;
    }

    int NPC_GetStatesDuration(lua_State* L) {
        uintptr_t p = checkEnt(L, 1);
        lua_newtable(L);
        if (!p || !mem::hp(p)) return 1;
        bool useInput = lua_istable(L, 2);
        float now = GV_GetGameTime();
        float stun = FindModifierTime(p, "modifier_stunned", now);
        float silence = FindModifierTime(p, "modifier_silenced", now);
        if (silence <= 0.0f) silence = FindModifierTime(p, "modifier_silence", now);
        float hex = FindModifierTime(p, "modifier_hexxed", now);
        float disarm = FindModifierTime(p, "modifier_disarmed", now);
        float root = FindModifierTime(p, "modifier_rooted", now);
        float mute = FindModifierTime(p, "modifier_muted", now);
        float fear = FindModifierTime(p, "modifier_feared", now);
        float taunt = FindModifierTime(p, "modifier_taunted", now);
        float cyclone = FindModifierTime(p, "modifier_item_cyclone", now);
        float bash = FindModifierTime(p, "modifier_bashed", now);
        uint64_t stateBase = 0, stateOver = 0;
        if (mem::hp(p)) {
            stateBase = mem::rd<uint64_t>(p + 0x12B8);
            stateOver = mem::rd<uint64_t>(p + 0x12C0);
        }

        uint64_t stateMask = stateBase | stateOver;
        if (silence <= 0.0f && (stateMask & (1ULL << 3))) silence = 0.01f;
        if (stun <= 0.0f && (stateMask & (1ULL << 4))) stun = 0.01f;
        if (hex <= 0.0f && (stateMask & (1ULL << 5))) hex = 0.01f;
        if (disarm <= 0.0f && (stateMask & (1ULL << 6))) disarm = 0.01f;
        if (root <= 0.0f && (stateMask & (1ULL << 7))) root = 0.01f;
        if (mute <= 0.0f && (stateMask & (1ULL << 8))) mute = 0.01f;
        float control = stun;
        if (hex > control) control = hex;
        if (fear > control) control = fear;
        if (taunt > control) control = taunt;
        if (cyclone > control) control = cyclone;
        lua_pushnumber(L, (double)stun); lua_setfield(L, -2, "stun");
        lua_pushnumber(L, (double)silence); lua_setfield(L, -2, "silence");
        lua_pushnumber(L, (double)hex); lua_setfield(L, -2, "hex");
        lua_pushnumber(L, (double)disarm); lua_setfield(L, -2, "disarm");
        lua_pushnumber(L, (double)root); lua_setfield(L, -2, "root");
        lua_pushnumber(L, (double)mute); lua_setfield(L, -2, "mute");
        lua_pushnumber(L, (double)fear); lua_setfield(L, -2, "fear");
        lua_pushnumber(L, (double)taunt); lua_setfield(L, -2, "taunt");
        lua_pushnumber(L, (double)cyclone); lua_setfield(L, -2, "cyclone");
        lua_pushnumber(L, (double)bash); lua_setfield(L, -2, "bash");
        lua_pushnumber(L, (double)control); lua_setfield(L, -2, "control");
        lua_pushnumber(L, (double)stun); lua_rawseti(L, -2, 8);
        lua_pushnumber(L, (double)stun); lua_rawseti(L, -2, 16);
        lua_pushnumber(L, (double)hex); lua_rawseti(L, -2, 32);
        lua_pushnumber(L, (double)disarm); lua_rawseti(L, -2, 64);
        lua_pushnumber(L, (double)root); lua_rawseti(L, -2, 128);
        lua_pushnumber(L, (double)mute); lua_rawseti(L, -2, 256);
        lua_pushnumber(L, (double)silence); lua_rawseti(L, -2, 8);
        (void)useInput;
        return 1;
    }

    static float NPC_GetDayVisionRange(uintptr_t p) {
        float day = mem::rd<float>(p + 0xE10);
        if (day > 100.0f && day < 3000.0f) return day;
        return 1800.0f;
    }

    int FogOfWar_IsPointVisible(lua_State* L) {
        if (!lua_isuserdata(L, 1)) { lua_pushboolean(L, true); return 1; }
        LuaVector* v = (LuaVector*)lua_touserdata(L, 1);
        if (!v) { lua_pushboolean(L, true); return 1; }
        float px = v->x, py = v->y;
        if (!g_Pawn || !mem::hp(g_Pawn)) { lua_pushboolean(L, true); return 1; }
        uint8_t localTeam = mem::rd<uint8_t>(g_Pawn + g_off.m_iTeamNum);
        for (int i = 0; i < g_CacheCount; ++i) {
            uintptr_t ent = g_CacheEntries[i];
            if (!ent || !mem::hp(ent)) continue;
            uint8_t t = mem::rd<uint8_t>(ent + g_off.m_iTeamNum);
            if (t != localTeam) continue;
            uint32_t ut = mem::rd<uint32_t>(ent + g_off.m_iUnitType);
            if ((ut & 1) == 0 && (ut & 0x14) != 0x14 && (ut & 0x100) == 0) continue;
            uintptr_t scene = mem::rd<uintptr_t>(ent + g_off.m_pGameSceneNode);
            if (!scene || !mem::hp(scene)) continue;
            Vector3 pos = GetHeroPos(ent);
            float dx = px - pos.x;
            float dy = py - pos.y;
            float vision = NPC_GetDayVisionRange(ent);
            if (dx * dx + dy * dy <= vision * vision) {
                lua_pushboolean(L, true);
                return 1;
            }
        }

        lua_pushboolean(L, false);
        return 1;
    }

    int NPC_GetSecondsPerAttackReal(lua_State* L) {
        uintptr_t p = checkEnt(L, 1);
        if (!p || !mem::hp(p)) { lua_pushnumber(L, 1.7); return 1; }
        float bat = ReadBaseAttackTimeSafe(p);
        float agi = mem::rd<float>(p + 0x1AF0);
        if (agi < 0.0f) agi = 0.0f;
        float aps = (100.0f + agi) / (bat * 100.0f);
        if (aps < 0.1f) aps = 0.1f;
        lua_pushnumber(L, (double)(1.0f / aps));
        return 1;
    }

    static float GetEntityYawDeg(uintptr_t ent) {
        if (!ent || !mem::hp(ent)) return 0.0f;
        uintptr_t scene = mem::rd<uintptr_t>(ent + 0x330);
        if (!scene || !mem::hp(scene)) return 0.0f;
