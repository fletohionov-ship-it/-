static std::string GetSteamID64FromRegistry() {
    HKEY hKey = nullptr;
    if (RegOpenKeyExA(HKEY_CURRENT_USER, "Software\\Valve\\Steam\\ActiveProcess", 0, KEY_READ, &hKey) != ERROR_SUCCESS) return "";
    DWORD activeUser = 0; DWORD size = sizeof(activeUser); DWORD type = REG_DWORD;
    LONG res = RegQueryValueExA(hKey, "ActiveUser", nullptr, &type, (LPBYTE)&activeUser, &size);
    RegCloseKey(hKey);
    if (res != ERROR_SUCCESS || activeUser == 0) return "";
    uint64_t steamID64 = 76561197960265728ULL + (uint64_t)activeUser;
    return std::to_string(steamID64);
}

static void SetGCSteamID(lua_State* L) {
    std::string sid = GetSteamID64FromRegistry();
    lua_pushstring(L, sid.c_str()); if (false) CrashLog("[SETGLOBAL] %s\n", "GC_STEAMID64"); lua_setglobal(L, "GC_STEAMID64");
    CrashLog("[GC] steamid from registry: %s\n", sid.empty() ? "<empty>" : sid.c_str());
}

static int MenuIndexHandler(lua_State* L) {
    const char* key = lua_tostring(L, 2);
    if (key) {
        if (strcmp(key, "Get") == 0 || strcmp(key, "is_enabled") == 0 ||
            strcmp(key, "IsEnabled") == 0 || strcmp(key, "is_visible") == 0 ||
            strcmp(key, "visible") == 0 || strcmp(key, "IsVisible") == 0 ||
            strcmp(key, "enabled") == 0 || strcmp(key, "Enabled") == 0) {
            lua_pushboolean(L, 1);
            return 1;
        }
    }

    lua_rawget(L, 1);
    return 1;
}

static int MenuWidgetIndexHandler(lua_State* L) {
    const char* key = lua_tostring(L, 2);
    if (key) {
        if (strcmp(key, "is_enabled") == 0 || strcmp(key, "IsEnabled") == 0 ||
            strcmp(key, "is_visible") == 0 || strcmp(key, "visible") == 0 ||
