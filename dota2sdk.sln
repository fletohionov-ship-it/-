    static bool IsWorldPointBlockedExact(float wx, float wy) {
        if (std::fabs(wx) > 7850.0f || std::fabs(wy) > 7850.0f) return true;
        if (!g_GridNav.IsValid()) g_GridNav.Init();
        g_GridNav.SyncDynamicObstacles();
        int gx, gy;
        g_GridNav.WorldToGrid(wx, wy, gx, gy);
        return g_GridNav.IsBlocked(gx, gy);
    }

    static float GetExactGroundZ(float wx, float wy) {
        if (!g_GridNav.IsValid()) g_GridNav.Init();
        return g_GridNav.GetNativeGroundZ(wx, wy);
    }

    static void FindCleanWorldPos(float& wx, float& wy) {
        if (!g_GridNav.IsValid()) g_GridNav.Init();
        g_GridNav.SyncDynamicObstacles();
        int gx, gy;
        g_GridNav.WorldToGrid(wx, wy, gx, gy);
        if (g_GridNav.IsBlocked(gx, gy)) {
            if (g_GridNav.FindNearestUnblocked(gx, gy, 18)) {
                float cz;
                g_GridNav.GridToWorldCenter(gx, gy, wx, wy, cz);
            }
        }
    }

    int GN_IsTraversable(lua_State* L) {
        if (lua_gettop(L) >= 2 && lua_isuserdata(L, 1) && lua_isuserdata(L, 2)) {
            LuaVector* v1 = (LuaVector*)lua_touserdata(L, 1);
            LuaVector* v2 = (LuaVector*)lua_touserdata(L, 2);
            if (v1 && v2) {
                float hx, hy, hz;
                lua_pushboolean(L, g_GridNav.TraceRay3D(v1->x, v1->y, v2->x, v2->y, hx, hy, hz));
                return 1;
            }
        }
        float x = 0.0f, y = 0.0f;
        if (lua_isuserdata(L, 1)) {
            LuaVector* v = (LuaVector*)lua_touserdata(L, 1);
            if (!v) { lua_pushboolean(L, true); return 1; }
            x = v->x; y = v->y;
        }
        else if (lua_istable(L, 1)) {
            lua_getfield(L, 1, "x"); x = (float)lua_tonumber(L, -1); lua_pop(L, 1);
            lua_getfield(L, 1, "y"); y = (float)lua_tonumber(L, -1); lua_pop(L, 1);
        }
        else {
            lua_pushboolean(L, true);
            return 1;
        }
        lua_pushboolean(L, !IsWorldPointBlockedExact(x, y));
        return 1;
    }

    int GN_BuildPath(lua_State* L) {
        lua_newtable(L);
        int top = lua_gettop(L);
        LuaVector* vStart = nullptr;
        LuaVector* vEnd = nullptr;
        for (int i = 1; i <= top; ++i) {
            if (lua_type(L, i) == LUA_TUSERDATA && lua_objlen(L, i) >= sizeof(LuaVector)) {
                if (!vStart) vStart = (LuaVector*)lua_touserdata(L, i);
                else if (!vEnd) { vEnd = (LuaVector*)lua_touserdata(L, i); break; }
            }
        }
        if (!vStart || !vEnd) return 1;

        if (!g_GridNav.IsValid()) g_GridNav.Init();

        std::vector<std::pair<float, float>> path;
        if (g_GridNav.FindPathWorld(vStart->x, vStart->y, vEnd->x, vEnd->y, path) && path.size() >= 2) {
            for (size_t i = 0; i < path.size(); ++i) {
                float px = path[i].first;
                float py = path[i].second;
                pushVec(L, px, py, GetExactGroundZ(px, py));
                lua_rawseti(L, -2, (int)(i + 1));
            }
            return 1;
        }

        pushVec(L, vStart->x, vStart->y, GetExactGroundZ(vStart->x, vStart->y));
        lua_rawseti(L, -2, 1);
        pushVec(L, vEnd->x, vEnd->y, GetExactGroundZ(vEnd->x, vEnd->y));
        lua_rawseti(L, -2, 2);
        return 1;
    }

