std::wstring GetDllDirW() {
    wchar_t p[MAX_PATH] = { 0 };
    GetModuleFileNameW(g_hMod, p, MAX_PATH);
    std::wstring s(p);
    size_t pos = s.find_last_of(L"\\/");
    if (pos != std::wstring::npos) s = s.substr(0, pos + 1);
    return s;
}

inline const char* PathNextToDll(const char* relativePath) {
    static char s_dllDir[MAX_PATH] = "";
    if (!s_dllDir[0]) {
        HMODULE hSelf = nullptr;
        char dllPath[MAX_PATH] = {};
        if (GetModuleHandleExA(
            GET_MODULE_HANDLE_EX_FLAG_FROM_ADDRESS | GET_MODULE_HANDLE_EX_FLAG_UNCHANGED_REFCOUNT,
            reinterpret_cast<LPCSTR>(&PathNextToDll), &hSelf) &&
            hSelf && GetModuleFileNameA(hSelf, dllPath, MAX_PATH))
        {
            char* slash = strrchr(dllPath, '\\');
            if (!slash) slash = strrchr(dllPath, '/');
            if (slash) { slash[1] = '\0'; strncpy_s(s_dllDir, dllPath, MAX_PATH - 1); }
        }
    }
    static char s_bufs[4][MAX_PATH];
    static int s_slot = 0;
    char* out = s_bufs[s_slot];
    s_slot = (s_slot + 1) & 3;
    snprintf(out, MAX_PATH, "%s%s", s_dllDir, relativePath);
    return out;
}

bool RunLuaBuffer(lua_State* L, const char* code, size_t len, const char* chunk) {
    int r = SEH_luaL_loadbuffer(L, code, len, chunk);
    if (r != 0) {
        printf("[!] loadbuffer(%s) err=%d: %s\n", chunk, r, lua_tostring(L, -1));
        CrashLog("[!] loadbuffer(%s) err=%d: %s\n", chunk, r, lua_tostring(L, -1));
        lua_pop(L, 1); return false;
    }

    r = lua_pcall(L, 0, 0, 0);
    if (r != 0) {
        printf("[!] pcall(%s) err=%d: %s\n", chunk, r, lua_tostring(L, -1));
        CrashLog("[!] pcall(%s) err=%d: %s\n", chunk, r, lua_tostring(L, -1));
        lua_pop(L, 1); return false;
    }

    return true;
}

static int ExtractTableFunc(lua_State* L, int tableIdx, const char* name) {
    lua_getfield(L, tableIdx, name);
    if (lua_isfunction(L, -1)) {
        return luaL_ref(L, LUA_REGISTRYINDEX);
    }

    lua_pop(L, 1);
    return LUA_NOREF;
}

static void CallScriptRef(lua_State* L, int ref, const char* label) {
    SdkRingPush("CallScript", "ENTER '%s'", label ? label : "?");
    if (ref == LUA_NOREF) return;
    lua_rawgeti(L, LUA_REGISTRYINDEX, ref);
    if (lua_pcall(L, 0, 0, 0) != 0) {
        const char* err = lua_tostring(L, -1);
        StepTrace(label, "LUA-ERR", "%s", err ? err : "<non-string error>");

        lua_pop(L, 1);
    }

    SdkRingPush("CallScript", "EXIT '%s'", label ? label : "?");
}

static void ExtractScriptMethods(lua_State* L, int tableIdx) {
    g_scriptOnTickRef = ExtractTableFunc(L, tableIdx, "OnTick");
    if (g_scriptOnTickRef == LUA_NOREF) g_scriptOnTickRef = ExtractTableFunc(L, tableIdx, "Tick");
    g_scriptOnUpdateRef = ExtractTableFunc(L, tableIdx, "OnUpdate");
    g_scriptOnDrawRef = ExtractTableFunc(L, tableIdx, "OnDraw");
    g_scriptOnUpdateExRef = ExtractTableFunc(L, tableIdx, "OnUpdateEx");
    g_scriptOnScriptsLoadedRef = ExtractTableFunc(L, tableIdx, "OnScriptsLoaded");
    g_scriptOnGameEndRef = ExtractTableFunc(L, tableIdx, "OnGameEnd");
    g_scriptOnGCMessageRef = ExtractTableFunc(L, tableIdx, "OnGCMessage");
    g_scriptOnParticleDestroyRef = ExtractTableFunc(L, tableIdx, "OnParticleDestroy");
    g_scriptOnLinearProjectileDestroyRef = ExtractTableFunc(L, tableIdx, "OnLinearProjectileDestroy");
    printf("[BOT] Script methods: OnTick=%d OnUpdate=%d OnDraw=%d OnUpdateEx=%d OnScriptsLoaded=%d OnGameEnd=%d OnGCMessage=%d OnParticleDestroy=%d OnLinearProjectileDestroy=%d\n",
        (int)(g_scriptOnTickRef != LUA_NOREF),
        (int)(g_scriptOnUpdateRef != LUA_NOREF),
        (int)(g_scriptOnDrawRef != LUA_NOREF),
        (int)(g_scriptOnUpdateExRef != LUA_NOREF),
        (int)(g_scriptOnScriptsLoadedRef != LUA_NOREF),
        (int)(g_scriptOnGameEndRef != LUA_NOREF),
        (int)(g_scriptOnGCMessageRef != LUA_NOREF),
        (int)(g_scriptOnParticleDestroyRef != LUA_NOREF),
        (int)(g_scriptOnLinearProjectileDestroyRef != LUA_NOREF));
    CrashLog("[BOT] Script methods: OnTick=%d OnUpdate=%d OnDraw=%d OnUpdateEx=%d OnScriptsLoaded=%d OnGameEnd=%d OnGCMessage=%d OnParticleDestroy=%d OnLinearProjectileDestroy=%d\n",
        (int)(g_scriptOnTickRef != LUA_NOREF),
        (int)(g_scriptOnUpdateRef != LUA_NOREF),
        (int)(g_scriptOnDrawRef != LUA_NOREF),
        (int)(g_scriptOnUpdateExRef != LUA_NOREF),
        (int)(g_scriptOnScriptsLoadedRef != LUA_NOREF),
        (int)(g_scriptOnGameEndRef != LUA_NOREF),
        (int)(g_scriptOnGCMessageRef != LUA_NOREF),
        (int)(g_scriptOnParticleDestroyRef != LUA_NOREF),
        (int)(g_scriptOnLinearProjectileDestroyRef != LUA_NOREF));
}

bool LoadLuaScriptV2(lua_State* L, const std::wstring& wpath, const char* chunkName) {
    strncpy_s(g_sdkPhase, sizeof(g_sdkPhase), "LoadLua", sizeof(g_sdkPhase) - 1);
    g_sdkPhase[sizeof(g_sdkPhase) - 1] = '\0';
    (void)chunkName;
    char mb[MAX_PATH * 4] = { 0 };
    int n = WideCharToMultiByte(CP_UTF8, 0, wpath.c_str(), -1, mb, sizeof(mb) - 1, nullptr, nullptr);
    if (n <= 0) return false;
    printf("[*] Loading via luaL_loadfile: %s\n", mb);
    CrashLog("[*] Loading via luaL_loadfile: %s\n", mb);
    lua_gc(L, LUA_GCCOLLECT, 0);
    lua_settop(L, 0);
    lua_getglobal(L, "debug");
    lua_getfield(L, -1, "traceback");
    lua_remove(L, -2);
    int errfunc = lua_gettop(L);
    int r = SEH_luaL_loadfileA(L, mb);
    if (r == -99) { printf("[!] luaL_loadfile SEH_EXCEPTION\n"); CrashLog("[!] luaL_loadfile SEH_EXCEPTION\n"); lua_pop(L, 1); return false; }
    if (r != 0) {
        const char* e = lua_tostring(L, -1);
        printf("[!] loadfile err=%d: %s\n", r, e ? e : "?");
        CrashLog("[!] loadfile err=%d: %s\n", r, e ? e : "?");
        lua_pop(L, 2); return false;
    }

    r = lua_pcall(L, 0, 1, errfunc);
    if (r != 0) {
        const char* e = lua_tostring(L, -1);
        printf("[!] pcall err=%d: %s\n", r, e ? e : "?");
        CrashLog("[!] pcall traceback: %s\n", e ? e : "?");
        lua_pop(L, 2); return false;
    }

    lua_remove(L, errfunc);
    int rt = lua_type(L, -1);
    printf("[BOT] main.lua returned: %s\n", lua_typename(L, rt));
    CrashLog("[BOT] main.lua returned: %s\n", lua_typename(L, rt));
    if (rt == LUA_TTABLE) {
        // Immediately duplicate the table and capture registry reference BEFORE any parsing
        lua_pushvalue(L, -1);
        g_scriptSelfPlayRef = luaL_ref(L, LUA_REGISTRYINDEX);
        // Now retrieve the table for method extraction
        lua_rawgeti(L, LUA_REGISTRYINDEX, g_scriptSelfPlayRef);
        ExtractScriptMethods(L, -1);
        lua_pop(L, 1);
    }

    else if (rt == LUA_TFUNCTION) {
        printf("[BOT] main.lua returned FUNCTION, calling...\n");
        CrashLog("[BOT] main.lua returned FUNCTION, calling...\n");
        lua_pushvalue(L, -1);
        if (lua_pcall(L, 0, 1, 0) != 0) {
            const char* e = lua_tostring(L, -1);
            printf("[!] entry-point pcall err: %s\n", e ? e : "?");
            CrashLog("[!] entry-point pcall err: %s\n", e ? e : "?");
            lua_pop(L, 1);
        }

        else {
            if (lua_istable(L, -1)) {
                // Immediately duplicate the table and capture registry reference BEFORE any parsing
                lua_pushvalue(L, -1);
                g_scriptSelfPlayRef = luaL_ref(L, LUA_REGISTRYINDEX);
                // Now retrieve the table for method extraction
                lua_rawgeti(L, LUA_REGISTRYINDEX, g_scriptSelfPlayRef);
                ExtractScriptMethods(L, -1);
                lua_pop(L, 1);
            }

            lua_pop(L, 1);
        }
    }

    lua_pop(L, 1);
    return true;
}

