    static float ComputeAttacksPerSecondSafe(uintptr_t p) {
        if (!p || !mem::hp(p)) return 1.0f;
        float bat = ReadBaseAttackTimeSafe(p);
        float as = ComputeUnitAttackSpeedSafe(p);
        float aps = as / (bat * 100.0f);
        if (aps < 0.2f || aps > 10.0f) aps = 1.0f;
        return aps;
    }

