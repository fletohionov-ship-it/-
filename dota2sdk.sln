    int NPC_GetItem(lua_State* L) {
        uintptr_t p = checkEnt(L, 1);
        const char* itemName = lua_tostring(L, 2);
        bool checkBackpack = lua_toboolean(L, 3) != 0;
        if (!p || !mem::hp(p) || !itemName || itemName[0] == '\0') { lua_pushnil(L); return 1; }
        if (p == g_Pawn && strcmp(itemName, "item_tpscroll") == 0 && g_PawnTpScroll && mem::hp(g_PawnTpScroll)) {
            lua_pushlightuserdata(L, (void*)g_PawnTpScroll);
            return 1;
        }

        int maxSlot = checkBackpack ? 14 : 5;
        for (int slot = 0; slot <= maxSlot; ++slot) {
            uintptr_t item = UA::FindUnitItemBySlot(p, slot);
            if (!item) continue;
            char buf[128] = { 0 };
            if (GetEntityDesignerName(item, buf, sizeof(buf)) && strcmp(buf, itemName) == 0) {
                lua_pushlightuserdata(L, (void*)item);
                return 1;
            }
        }
        uintptr_t neutItem = UA::FindUnitItemBySlot(p, 16);
        if (neutItem) {
            char buf[128] = { 0 };
            if (GetEntityDesignerName(neutItem, buf, sizeof(buf)) && strcmp(buf, itemName) == 0) {
                lua_pushlightuserdata(L, (void*)neutItem);
                return 1;
            }
        }
        lua_pushnil(L);
        return 1;
    }

    int NPC_MoveTo(lua_State* L) {
        __try {
            uintptr_t p = checkEnt(L, 1);
            if (!p) { lua_pushboolean(L, false); return 1; }
            float x = 0, y = 0, z = 0;
            if (lua_isuserdata(L, 2)) {
                LuaVector* v = (LuaVector*)lua_touserdata(L, 2);
                if (!v) { lua_pushboolean(L, false); return 1; }
                x = v->x; y = v->y; z = v->z;
            }

            else if (lua_istable(L, 2)) {
                lua_getfield(L, 2, "x"); if (lua_isnumber(L, -1)) x = (float)lua_tonumber(L, -1); lua_pop(L, 1);
                lua_getfield(L, 2, "y"); if (lua_isnumber(L, -1)) y = (float)lua_tonumber(L, -1); lua_pop(L, 1);
                lua_getfield(L, 2, "z"); if (lua_isnumber(L, -1)) z = (float)lua_tonumber(L, -1); lua_pop(L, 1);
            }

            else if (lua_isnumber(L, 2) && lua_isnumber(L, 3) && lua_isnumber(L, 4)) {
                x = (float)lua_tonumber(L, 2); y = (float)lua_tonumber(L, 3); z = (float)lua_tonumber(L, 4);
            }

            else { lua_pushboolean(L, false); return 1; }
            int ok = ::LuaPrepareUnitOrdersRaw(p, 1, 0, x, y, z, 0, 2, 0, false);
            lua_pushboolean(L, ok != 0);
            return 1;
        }

        __except (EXCEPTION_EXECUTE_HANDLER) {
            lua_pushboolean(L, false);
            return 1;
        }
    }

