        if (!p || !mem::hp(p)) { lua_pushstring(L, ""); return 1; }
        uintptr_t vt = mem::rd<uintptr_t>(p);
        if (!vt || !mem::hp(vt)) { lua_pushstring(L, ""); return 1; }
        __try {
            uintptr_t td = mem::rd<uintptr_t>(vt - 8);
            if (!td || !mem::hp(td)) { lua_pushstring(L, ""); return 1; }
            const char* name = (const char*)(td + 0x10);
            if (!name) { lua_pushstring(L, ""); return 1; }
            // MSVC RTTI names look like ".?AVCDOTA_Unit_Hero@@".
            // Strip the ".?AV" prefix and "@@" suffix.
            const char* s = name;
            if (strncmp(s, ".?AV", 4) == 0) s += 4;
            char buf[128] = { 0 };
            strncpy_s(buf, sizeof(buf), s, sizeof(buf) - 1);
            buf[sizeof(buf) - 1] = '\0';
            char* at = strstr(buf, "@@");
            if (at) *at = '\0';
            lua_pushstring(L, buf);
            return 1;
        }

        __except (EXCEPTION_EXECUTE_HANDLER) {
            lua_pushstring(L, "");
            return 1;
        }
    }

    int Entity_GetField(lua_State* L) {
        uintptr_t p = checkEnt(L, 1);
        const char* field = lua_tostring(L, 2);
        if (!p || !field) { lua_pushnil(L); return 1; }
        if (strcmp(field, "m_bActive") == 0) { lua_pushboolean(L, false); return 1; }
        lua_pushnil(L);
        return 1;
    }

    int Humanizer_ForceUserOrderByMinimap(lua_State* L) {
        double u = lua_tonumber(L, 1);
        double v = lua_tonumber(L, 2);
        const float HALF = 8300.0f;
        float wx = (float)((u - 0.5) * 2.0 * HALF);
        float wy = (float)((0.5 - v) * 2.0 * HALF);
        int r = LuaPrepareUnitOrdersRaw(0, 1, 0, wx, wy, 0.0f, 0, 0, 0, false);
        lua_pushboolean(L, r != 0);
        return 1;
    }

    int Humanizer_MoveToWorldPos(lua_State* L) {
        float x = (float)lua_tonumber(L, 1);
        float y = (float)lua_tonumber(L, 2);
        float z = (float)lua_tonumber(L, 3);
        int r = LuaPrepareUnitOrdersRaw(0, 1, 0, x, y, z, 0, 0, 0, false);
        lua_pushboolean(L, r != 0);
        return 1;
    }

    static int L_Fallback_ReturnZero(lua_State* L) { lua_pushinteger(L, 0); return 1; }
}

