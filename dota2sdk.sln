    int E_GetTreesInRadius(lua_State* L) {
        lua_newtable(L);
        float cx = 0.0f, cy = 0.0f;
        bool hasCenter = false;
        float radius = 600.0f;
        for (int arg = 1; arg <= 3; ++arg) {
            if (!hasCenter && lua_isuserdata(L, arg)) {
                LuaVector* v = (LuaVector*)lua_touserdata(L, arg);
                if (v) { cx = v->x; cy = v->y; hasCenter = true; continue; }
            }

            else if (!hasCenter && lua_istable(L, arg)) {
                lua_getfield(L, arg, "x");
                if (lua_isnumber(L, -1)) {
                    cx = (float)lua_tonumber(L, -1);
                    lua_pop(L, 1);
                    lua_getfield(L, arg, "y");
                    cy = (float)lua_tonumber(L, -1);
                    lua_pop(L, 1);
                    hasCenter = true;
                    continue;
                }

                lua_pop(L, 1);
            }

            else if (hasCenter && lua_isnumber(L, arg)) {
                float r = (float)lua_tonumber(L, arg);
                if (r > 10.0f) radius = r;
            }
        }

        if (!hasCenter && g_Pawn && mem::hp(g_Pawn)) {
            Vector3 hp = GetHeroPos(g_Pawn);
            cx = hp.x; cy = hp.y; hasCenter = true;
        }

        if (!hasCenter) return 1;
        int outIdx = 0;
        float r2 = radius * radius;
        uint64_t nowMs = GetTickCount64();
        for (int i = 0; i < g_TreeCount; ++i) {
            uintptr_t ent = g_TreeCache[i];
            if (!ent || !mem::hp(ent)) continue;
            int binId = GetTreeBinaryIdOrIndex(ent);
            auto itCut = g_CutTreeUntilMs.find(binId);
            if (itCut != g_CutTreeUntilMs.end() && nowMs < itCut->second) continue;

            Vector3 tpos = GetHeroPos(ent);
            if (fabsf(tpos.x) < 10.0f && fabsf(tpos.y) < 10.0f) continue;
            float dx = tpos.x - cx;
            float dy = tpos.y - cy;
            if (dx * dx + dy * dy <= r2) {
                pushEntityWithMetatable(L, ent);
                lua_rawseti(L, -2, ++outIdx);
                if (outIdx >= 32) break;
            }
        }

        return 1;
    }

