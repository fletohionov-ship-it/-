static int g_draftRole = 0;
static uint16_t g_draftHeroMask[5] = { 0x0FFF, 0x0FFF, 0x0FFF, 0x0FFF, 0x0FFF };

static bool IsDraftHeroSelected(int role, int slot) {
    if (role < 0 || role >= 5 || slot < 0 || slot >= 12) return false;
    uint16_t mask = g_draftHeroMask[role];
    return mask == 0 || (mask & (uint16_t)(1u << slot)) != 0;
}

static int FirstDraftHeroSlot(int role, int start) {
    if (role < 0 || role >= 5) return 0;
    for (int i = 0; i < 12; ++i) {
        int slot = (start + i) % 12;
        if (IsDraftHeroSelected(role, slot)) return slot;
    }
    return 0;
}

static void ToggleDraftHero(int role, int slot) {
    if (role < 0 || role >= 5 || slot < 0 || slot >= 12) return;
    uint16_t& mask = g_draftHeroMask[role];
    if (mask == 0) mask = 0x0FFF;
    mask ^= (uint16_t)(1u << slot);
    if (mask == 0) mask = 0x0FFF;
}

// Автоматический конвертер кириллицы (Windows-1251 -> UTF-8) для ImGui
static const char* U8(const char* str) {
    if (!str || !*str) return "";
    static char s_bufs[32][512];
    static int s_idx = 0;
    char* out = s_bufs[(s_idx++) & 31];
    // Проверяем, не в UTF-8 ли уже строка
    bool alreadyUtf8 = false;
    for (const unsigned char* p = (const unsigned char*)str; *p; ++p) {
        if ((*p == 0xD0 || *p == 0xD1) && (p[1] >= 0x80 && p[1] <= 0xBF)) {
            alreadyUtf8 = true;
            break;
        }
    }

    if (alreadyUtf8) return str;
    wchar_t wbuf[256] = { 0 };
    int wlen = MultiByteToWideChar(1251, 0, str, -1, wbuf, 255);
    if (wlen <= 0) return str;
    int ulen = WideCharToMultiByte(CP_UTF8, 0, wbuf, -1, out, 511, NULL, NULL);
    return (ulen > 0) ? out : str;
}

// Получаем официальный интерфейс ISteamGameCoordinator ("SteamGameCoordinator001") через steam_api64.dll
// Не зависит от RVA в client.dll и работает на любом ПК!
static void* GetSteamGameCoordinatorSafe() {
    static void* s_pGC = nullptr;
    if (s_pGC) return s_pGC;
    HMODULE hSteamApi = GetModuleHandleA("steam_api64.dll");
    if (!hSteamApi) return nullptr;

    typedef int32_t(__cdecl* GetHSteamUserFn)();
    typedef int32_t(__cdecl* GetHSteamPipeFn)();
    typedef void* (__cdecl* SteamClientFn)();
    auto fnUser = (GetHSteamUserFn)GetProcAddress(hSteamApi, "SteamAPI_GetHSteamUser");
    auto fnPipe = (GetHSteamPipeFn)GetProcAddress(hSteamApi, "SteamAPI_GetHSteamPipe");
    auto fnClient = (SteamClientFn)GetProcAddress(hSteamApi, "SteamClient");
    if (!fnUser || !fnPipe || !fnClient) return nullptr;

    int32_t hUser = fnUser();
    int32_t hPipe = fnPipe();
    void* pClient = fnClient();
    if (!pClient || !mem::hp((uintptr_t)pClient)) return nullptr;

    // ISteamClient::GetISteamGenericInterface находится в слоте 12 vtable
    uintptr_t vt = mem::rd<uintptr_t>((uintptr_t)pClient);
    if (!vt || !mem::hp(vt)) return nullptr;
    typedef void* (__fastcall* GetGenericFn)(void*, int32_t, int32_t, const char*);
    GetGenericFn fnGeneric = (GetGenericFn)mem::rd<uintptr_t>(vt + 12 * 8);
    if (!fnGeneric) return nullptr;

    __try {
        s_pGC = fnGeneric(pClient, hUser, hPipe, "SteamGameCoordinator001");
    }
    __except (EXCEPTION_EXECUTE_HANDLER) { s_pGC = nullptr; }
    return s_pGC;
}

static bool SendGCProtobufMsg(uint32_t msgId, const uint8_t* protoBytes, uint32_t protoLen) {
    void* pGC = GetSteamGameCoordinatorSafe();
    if (!pGC || !mem::hp((uintptr_t)pGC)) return false;
    uintptr_t vt = mem::rd<uintptr_t>((uintptr_t)pGC);
    if (!vt || !mem::hp(vt)) return false;

    // ISteamGameCoordinator::SendMessage — слот 0 vtable
    typedef int(__fastcall* GCSendMsgFn)(void* thisptr, uint32_t unMsgType, const void* pubData, uint32_t cubData);
    GCSendMsgFn fnSend = (GCSendMsgFn)mem::rd<uintptr_t>(vt + 0);
    if (!fnSend) return false;

    uint8_t packet[128] = { 0 };
    if (protoLen + 8 > sizeof(packet)) return false;
    uint32_t maskedType = msgId | 0x80000000u;
    uint32_t headerSize = 0; // пустой CMsgProtoBufHeader
    memcpy(packet + 0, &maskedType, 4);
    memcpy(packet + 4, &headerSize, 4);
    if (protoBytes && protoLen > 0) memcpy(packet + 8, protoBytes, protoLen);

    __try {
        int res = fnSend(pGC, maskedType, packet, 8 + protoLen);
        return (res == 0); // k_EGCResultOK == 0
    }
    __except (EXCEPTION_EXECUTE_HANDLER) { return false; }
}

static size_t WriteVarint32(uint8_t* out, uint32_t val) {
    size_t i = 0;
    while (val >= 0x80) {
        out[i++] = (uint8_t)((val & 0x7F) | 0x80);
        val >>= 7;
    }
    out[i++] = (uint8_t)(val & 0x7F);
    return i;
}

static void TriggerAcceptMatchGC() {
    // k_EMsgGCReadyUp = 7070 (0x1B9E): field 1 (state) = DOTALobbyReadyState_ACCEPTED (1) -> 0x08, 0x01
    const uint8_t readyPayload[] = { 0x08, 0x01 };
    SendGCProtobufMsg(0x1B9E, readyPayload, sizeof(readyPayload));
}

static void TriggerStartSearch(int modeIndex, int regionIndex) {
    const int modeIds[] = { 1, 22, 23, 4, 15 };
    const int regionIds[] = { 8, 3, 9, 4, 1, 2 };
    if (!g_searchModeMask) {
        const int safeModeIndex = (modeIndex >= 0 && modeIndex < 5) ? modeIndex : 0;
        g_searchModeMask = (1u << modeIds[safeModeIndex]);
    }
    if (!g_searchRegionMask) {
        const int safeRegionIndex = (regionIndex >= 0 && regionIndex < 6) ? regionIndex : 0;
        g_searchRegionMask = (1u << regionIds[safeRegionIndex]);
    }
    for (int i = 0; i < 5; ++i) if (g_searchModeMask & (1u << modeIds[i])) { g_searchGameMode = modeIds[i]; break; }
    for (int i = 0; i < 6; ++i) if (g_searchRegionMask & (1u << regionIds[i])) { g_searchRegion = regionIds[i]; break; }

    if (g_searchGameMode == 15) {
        ExecuteEngineConsoleCmd("sv_cheats 0; dota_bot_match_difficulty 2; dota_start_ai_game 1; map dota");
        CrashLog("[SEARCH] Started local Bot Match\n");
        return;
    }

    // Собираем CMsgStartFindingMatch (k_EMsgGCStartFindingMatch = 7033 = 0x1B79):
    // field 2 (game_modes, tag 0x10) = (1u << g_searchGameMode)
    // field 3 (lobby_type, tag 0x18) = (g_searchGameMode == 22) ? 7 (Ranked) : 0 (Casual)
    // field 6 (matchgroups, tag 0x30) = (1u << g_searchRegion)
    uint8_t proto[64] = { 0 };
    size_t len = 0;
    proto[len++] = 0x10;
    len += WriteVarint32(proto + len, g_searchModeMask);
    proto[len++] = 0x18;
    len += WriteVarint32(proto + len, (g_searchGameMode == 22) ? 7u : 0u);
    proto[len++] = 0x30;
    len += WriteVarint32(proto + len, g_searchRegionMask);

    bool ok = SendGCProtobufMsg(0x1B79, proto, (uint32_t)len);
    CrashLog("[SEARCH] GC StartFindingMatch (0x1B79) sent=%d (Mode=%d, Region=%d)\n", (int)ok, g_searchGameMode, g_searchRegion);
}

