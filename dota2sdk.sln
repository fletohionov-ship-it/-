int lua_GetAll(lua_State* L) {
    __try {
        lua_checkstack(L, 300);
        if (lua_gettop(L) >= 1 && lua_istable(L, 1)) {
            lua_getglobal(L, "Entities");
            int same = lua_rawequal(L, 1, -1);
            lua_pop(L, 1);
            if (!same) {
                lua_getglobal(L, "Entity");
                same = lua_rawequal(L, 1, -1);
                lua_pop(L, 1);
            }

            if (same) {
                lua_remove(L, 1);
            }
        }

        lua_newtable(L);
        int idx = 0;
        if (g_Pawn && mem::hp(g_Pawn)) {
            pushEntityWithMetatable(L, g_Pawn);
            lua_rawseti(L, -2, 1);
            idx = 1;
        }

        if (!g_EntityList) return 1;
        if (!lua_checkstack(L, 100)) { return 1; }
        for (int i = 1; i <= 4096; i++) {
            uintptr_t ent = GetEntity(i);
            if (ent && mem::hp(ent)) {
                if (ent == g_Pawn) continue;
                pushEntityWithMetatable(L, ent);
                lua_rawseti(L, -2, ++idx);
            }
        }

        return 1;
    }

    __except (EXCEPTION_EXECUTE_HANDLER) {
        lua_pushnil(L);
        return 1;
    }
}

int lua_Heroes_GetAll(lua_State* L) {
    lua_checkstack(L, 300);
    __try {
        SdkRingPush("EnterFn", "lua_Heroes_GetAll top=%d", lua_gettop(L));
        // Only pop slot 1 if it is a table AND it is identical to the global Heroes (or Hero)
        if (lua_gettop(L) >= 1 && lua_istable(L, 1)) {
            lua_getglobal(L, "Heroes");
            int same = lua_rawequal(L, 1, -1);
            lua_pop(L, 1);
            if (!same) {
                lua_getglobal(L, "Hero");
                same = lua_rawequal(L, 1, -1);
                lua_pop(L, 1);
            }

            if (same) {
                lua_remove(L, 1);
            }
        }

        SdkRingPush("Heroes_GetAll", "entered");
        lua_checkstack(L, 64);
        lua_newtable(L);
        SdkRingPush("Heroes_GetAll", "created table, top=%d", lua_gettop(L));
        // Force-push local hero at index 1 BEFORE the entity loop scanner
        int idx = 0;
        if (g_Pawn && mem::hp(g_Pawn)) {
            SdkRingPush("Heroes_GetAll", "pushing g_Pawn=0x%llX", (unsigned long long)g_Pawn);
            pushEntityWithMetatable(L, g_Pawn);
            SdkRingPush("Heroes_GetAll", "after push g_Pawn, top=%d", lua_gettop(L));
            lua_rawseti(L, -2, 1);
            idx = 1;
        }

        // Protective null check: if local player handle or entity list is invalid, ensure array is populated
        if (!g_Pawn || !mem::hp(g_Pawn)) {
            CrashLog("[HERO_SCAN] WARNING: Local player handle invalid (g_Pawn=0x%llX)\n", (unsigned long long)g_Pawn);
        }

        if (!g_EntityList) {
            CrashLog("[HERO_SCAN] WARNING: Entity list invalid (g_EntityList=0x%llX)\n", (unsigned long long)g_EntityList);
            CrashLog("[HERO_SCAN] Total heroes sent to Lua: %d\n", idx);
            return 1;
        }

        if (!lua_checkstack(L, 100)) {
            CrashLog("[HERO_SCAN] Total heroes sent to Lua: %d\n", idx);
            lua_pushnil(L);
            return 1;
        }

        // Entity loop scanner - iterate indices 1-5000 in g_EntityList
        for (int i = 1; i <= 5000; ++i) {
            uintptr_t ent = GetEntity(i);
            if (!ent || !mem::hp(ent) || ent == g_Pawn) continue;
            // Bug 3: Strict hero filtering
            char name[128] = { 0 };
            if (!UA::GetEntityDesignerName(ent, name, sizeof(name))) continue;
            // Must start with "npc_dota_hero_"
            if (strncmp(name, "npc_dota_hero_", 14) != 0) continue;
            // Must be a valid team (2 = Radiant, 3 = Dire)
            uint8_t teamNum = mem::rd<uint8_t>(ent + 0x3E7);
            if (teamNum != 2 && teamNum != 3) continue;
            // Must NOT be an illusion
            if (mem::rd<bool>(ent + g_off.m_bIsIllusion)) continue;
            // Must have valid hero ID (1-200)
            int heroID = mem::rd<int>(ent + g_off.m_iHeroID);
            if (heroID <= 0 || heroID >= 200) continue;
            // Must have reasonable max HP (real heroes have > 100 HP)
            int mhp = mem::rd<int>(ent + g_off.m_iMaxHealth);
            if (mhp <= 100) continue;
            pushEntityWithMetatable(L, ent);
            lua_rawseti(L, -2, ++idx);
        }

        SdkRingPush("Heroes_GetAll", "EXIT top=%d idx=%d", lua_gettop(L), idx);
        return 1;
    }

    __except (EXCEPTION_EXECUTE_HANDLER) {
        SdkRingPush("Heroes_GetAll", "SEH caught");
        lua_newtable(L);
        return 1;
    }
}

static int LuaLogStepTrace(lua_State* L) {
