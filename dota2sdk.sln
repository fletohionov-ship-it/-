    // Ищет дерево прямо на пути героя (<= 160 ед. по курсу движения) для мгновенной срубки Топориком в лесу
    static bool TryCutBlockingTreeOnPath(uintptr_t hero, float goalX, float goalY, int& outTreeBinId, int& outQbAbIdx, Vector3& outTreePos) {
        if (!hero || !mem::hp(hero)) return false;
        uintptr_t qbEnt = 0;
        for (int s = 0; s <= 5; ++s) {
            uintptr_t it = FindUnitItemBySlot(hero, s);
            char iname[64] = { 0 };
            if (!it || !GetEntityDesignerName(it, iname, sizeof(iname)) || GetEffectiveCooldown(it) > 0.05f) continue;
            if (strcmp(iname, "item_quelling_blade") == 0 || strcmp(iname, "item_bfury") == 0) {
                qbEnt = it; break;
            }
        }
        if (!qbEnt) return false;

        Vector3 myPos = GetHeroPos(hero);
        float dirX = goalX - myPos.x, dirY = goalY - myPos.y;
        float goalDist = std::sqrt(dirX * dirX + dirY * dirY);
        if (goalDist < 220.0f) return false;
        dirX /= goalDist; dirY /= goalDist;

        uint64_t nowMs = GetTickCount64();
        for (int i = 0; i < g_TreeCount; ++i) {
            uintptr_t tr = g_TreeCache[i];
            if (!tr || !mem::hp(tr)) continue;
            Vector3 tp = GetHeroPos(tr);
            float tx = tp.x - myPos.x, ty = tp.y - myPos.y;
            float d2 = tx * tx + ty * ty;
            if (d2 > 165.0f * 165.0f || d2 < 15.0f * 15.0f) continue;

            float d = std::sqrt(d2);
            float cosAng = (tx * dirX + ty * dirY) / d;
            if (cosAng >= 0.91f) { // Строго по курсу движения (угол <= 24 градуса)
                int binId = GetTreeBinaryIdOrIndex(tr);
                auto itCut = g_CutTreeUntilMs.find(binId);
                if (itCut != g_CutTreeUntilMs.end() && nowMs < itCut->second) continue;
                outTreeBinId = binId;
                outQbAbIdx = GetEntityIndexFromPtr(qbEnt);
                outTreePos = tp;
                return (outTreeBinId > 0 && outQbAbIdx > 0);
            }
        }
        return false;
    }

    // Сплит-Пуш Радар: проверяет, не зажимают ли героя враги на чужой половине карты
    static bool CheckSplitPushGankThreat(uintptr_t hero, float orderX, float orderY, float& outSafeX, float& outSafeY) {
        if (!hero || !mem::hp(hero)) return false;
        Vector3 myPos = GetHeroPos(hero);
        // Проверяем только когда мы за рекой на вражеской половине карты
        bool onEnemySide = (g_LocalTeam == 2) ? ((myPos.x + myPos.y) > 900.0f) : ((myPos.x + myPos.y) < -900.0f);
        if (!onEnemySide) return false;

        int nearEnemies = 0, nearAllies = 0;
        for (int i = 0; i < g_CacheCount; ++i) {
            uintptr_t ent = g_CacheEntries[i];
            if (!ent || !mem::hp(ent) || ent == hero) continue;
            if (!IsRealHeroByFields(ent) || mem::rd<uint8_t>(ent + g_off.m_lifeState) != 0) continue;
            Vector3 ep = GetHeroPos(ent);
            float d2 = (ep.x - myPos.x) * (ep.x - myPos.x) + (ep.y - myPos.y) * (ep.y - myPos.y);
            if (d2 <= 2100.0f * 2100.0f) {
                if (mem::rd<uint8_t>(ent + g_off.m_iTeamNum) == g_LocalTeam) nearAllies++;
                else nearEnemies++;
            }
        }

        int curHp = mem::rd<int>(hero + g_off.m_iHealth);
        int maxHp = mem::rd<int>(hero + g_off.m_iMaxHealth);
        float hpPct = (maxHp > 0) ? ((float)curHp / (float)maxHp) : 1.0f;

        if ((nearEnemies >= 2 && nearEnemies > nearAllies + 1) || (nearEnemies >= 1 && hpPct < 0.42f && nearAllies == 0)) {
            float fX = (g_LocalTeam == 3) ? 7200.0f : -7200.0f;
            float fY = (g_LocalTeam == 3) ? 6600.0f : -6600.0f;
            // Если приказ ведет еще дальше от нашего фонтана — разворачиваем к базе!
            float curDistF = (myPos.x - fX) * (myPos.x - fX) + (myPos.y - fY) * (myPos.y - fY);
            float ordDistF = (orderX - fX) * (orderX - fX) + (orderY - fY) * (orderY - fY);
            if (ordDistF >= curDistF) {
                float dx = fX - myPos.x, dy = fY - myPos.y;
                float len = std::sqrt(dx * dx + dy * dy);
                outSafeX = (len > 1.0f) ? (myPos.x + (dx / len) * 900.0f) : fX;
                outSafeY = (len > 1.0f) ? (myPos.y + (dy / len) * 900.0f) : fY;
                FindCleanWorldPos(outSafeX, outSafeY);
                return true;
            }
        }
        return false;
    }

    // ============================================================================
    //  ЧАСТЬ 10 (БОГ+ УЛЬТРА): АВТОНОМНЫЙ СЕЙВ И ДОСТАВКА КУРЬЕРА
    // ============================================================================
    static void TickSmartCourierNative(uintptr_t ctrl, void* prepareFnPtr) {
        if (!ctrl || !prepareFnPtr || !g_Pawn || !mem::hp(g_Pawn)) return;
        static uint64_t s_lastCourierTickMs = 0;
        uint64_t nowMs = GetTickCount64();
        if (nowMs - s_lastCourierTickMs < 850) return;
        s_lastCourierTickMs = nowMs;

        uintptr_t cour = g_CachedCourier;
        if (!cour || !mem::hp(cour) || mem::rd<int>(cour + g_off.m_iHealth) <= 0) return;

        typedef void(__fastcall* PrepareFn)(uintptr_t, int, int, float*, int, int, uintptr_t, int, int);
        PrepareFn fn = (PrepareFn)prepareFnPtr;
        Vector3 cPos = GetHeroPos(cour);
        alignas(16) float cposArr[4] = { cPos.x, cPos.y, cPos.z, 0.0f };

        // 1. Проверяем, нет ли рядом с курьером (<= 1050 ед.) вражеских героев или башен
        bool courierInDanger = false;
        for (int i = 0; i < g_CacheCount; ++i) {
            uintptr_t ent = g_CacheEntries[i];
            if (!ent || !mem::hp(ent) || mem::rd<uint8_t>(ent + g_off.m_iTeamNum) == g_LocalTeam) continue;
            if (!IsRealHeroByFields(ent)) {
                char en[64] = { 0 };
                if (!GetEntityDesignerName(ent, en, sizeof(en)) || strstr(en, "tower") == nullptr) continue;
            }
            Vector3 ep = GetHeroPos(ent);
            if ((ep.x - cPos.x) * (ep.x - cPos.x) + (ep.y - cPos.y) * (ep.y - cPos.y) <= 1050.0f * 1050.0f) {
                courierInDanger = true; break;
            }
        }

        if (courierInDanger) {
            for (int s = 0; s <= 7; ++s) {
                uintptr_t cAb = GetUnitAbilityBySlot(cour, s);
                char aName[96] = { 0 };
                if (!cAb || !GetEntityDesignerName(cAb, aName, sizeof(aName))) continue;
                int cAbIdx = GetEntityIndexFromPtr(cAb);
                if (cAbIdx <= 0) continue;
                if ((strcmp(aName, "courier_shield") == 0 || strcmp(aName, "courier_burst") == 0) && GetEffectiveCooldown(cAb) <= 0.05f) {
                    fn(ctrl, 8, 0, cposArr, cAbIdx, 2, cour, 0, 0);
                }
                if (strcmp(aName, "courier_return_to_base") == 0) {
                    fn(ctrl, 8, 0, cposArr, cAbIdx, 2, cour, 0, 0);
                    CrashLog("[COURIER-GOD+] Enemy near courier! Retreating courier to fountain!\n");
                }
            }
            return;
        }

        // 2. Если у героя в стеше (слоты 9..14) лежат предметы и герой не на базе — автоматически забираем и несем!
        bool hasStashItems = false;
        for (int s = 9; s <= 14; ++s) {
            if (FindUnitItemBySlot(g_Pawn, s) != 0) { hasStashItems = true; break; }
        }
        if (hasStashItems) {
            Vector3 hPos = GetHeroPos(g_Pawn);
            float fX = (g_LocalTeam == 3) ? 7200.0f : -7200.0f;
            float fY = (g_LocalTeam == 3) ? 6600.0f : -6600.0f;
            if ((hPos.x - fX) * (hPos.x - fX) + (hPos.y - fY) * (hPos.y - fY) > 900.0f * 900.0f &&
                (cPos.x - fX) * (cPos.x - fX) + (cPos.y - fY) * (cPos.y - fY) < 1200.0f * 1200.0f) {
                for (int s = 0; s <= 7; ++s) {
                    uintptr_t cAb = GetUnitAbilityBySlot(cour, s);
                    char aName[96] = { 0 };
                    if (cAb && GetEntityDesignerName(cAb, aName, sizeof(aName)) &&
                        strcmp(aName, "courier_take_stash_and_transfer_items") == 0) {
                        int cAbIdx = GetEntityIndexFromPtr(cAb);
                        if (cAbIdx > 0) fn(ctrl, 8, 0, cposArr, cAbIdx, 2, cour, 0, 0);
                        break;
                    }
                }
            }
        }
    }

    static int ReadItemChargesSafe(uintptr_t item) {
        if (!item || !mem::hp(item)) return 0;
        int abIdx = UA::GetEntityIndexFromPtr(item);
        if (abIdx > 0 && abIdx < 32768) {
            if (g_castCooldownUntil[abIdx] > GameRules_GetGameTime()) {
                return 0;
            }
        }

        char name[128] = { 0 };
        GetEntityDesignerName(item, name, sizeof(name));
        int ch = (g_off.m_iCurrentCharges) ? mem::rd<int>(item + g_off.m_iCurrentCharges) : 1;
        if (strstr(name, "magic_stick") || strstr(name, "magic_wand") ||
            strstr(name, "tpscroll") || strstr(name, "tango") ||
            strstr(name, "clarity") || strstr(name, "flask") ||
            strstr(name, "faerie_fire") || strstr(name, "enchanted_mango") ||
            strstr(name, "ward") || strstr(name, "smoke") || strstr(name, "dust") ||
            strstr(name, "blood_grenade") || strstr(name, "bottle")) {
            if (ch <= 0 || ch > 50) return 0;
            return ch;
        }
        if (ch > 0 && ch <= 100) return ch;
        return 1;
    }

