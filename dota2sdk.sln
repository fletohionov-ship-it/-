static void RenderPresentOverlay(IDXGISwapChain* sc) {
    ImDrawData* drawData = ImGui::GetDrawData();
    if (!drawData || drawData->CmdListsCount == 0) return;

    ID3D11Texture2D* backBuffer = nullptr;
    if (FAILED(sc->GetBuffer(0, __uuidof(ID3D11Texture2D), (void**)&backBuffer))) return;
    ID3D11RenderTargetView* target = nullptr;
    const HRESULT result = g_pd3dDevice->CreateRenderTargetView(backBuffer, nullptr, &target);
    backBuffer->Release();
    if (FAILED(result)) return;

    ID3D11RenderTargetView* original[D3D11_SIMULTANEOUS_RENDER_TARGET_COUNT] = {};
    ID3D11DepthStencilView* depth = nullptr;
    g_pd3dDeviceContext->OMGetRenderTargets(D3D11_SIMULTANEOUS_RENDER_TARGET_COUNT, original, &depth);
    g_pd3dDeviceContext->OMSetRenderTargets(1, &target, nullptr);
    ImGui_ImplDX11_RenderDrawData(drawData);
    g_pd3dDeviceContext->OMSetRenderTargets(D3D11_SIMULTANEOUS_RENDER_TARGET_COUNT, original, depth);
    for (auto* view : original) if (view) view->Release();
    if (depth) depth->Release();
    target->Release();
}

static std::atomic<unsigned> g_activeWindowCallbacks{0};
static std::atomic_flag g_presentBusy = ATOMIC_FLAG_INIT;

struct PresentExecutionScope {
    const bool ownsFrame = !g_presentBusy.test_and_set();
    ~PresentExecutionScope() { if (ownsFrame) g_presentBusy.clear(); }
};

struct WindowCallbackScope {
    WindowCallbackScope() { ++g_activeWindowCallbacks; }
    ~WindowCallbackScope() { --g_activeWindowCallbacks; }
};

using PresentClock = std::chrono::steady_clock;

static void RecordPresentPerf(PresentClock::time_point start, PresentClock::time_point botStart,
    PresentClock::time_point submit, PresentClock::time_point finish) {
    using Ms = std::chrono::duration<double, std::milli>;
    static auto windowStart = start;
    static unsigned frames = 0;
    static double overlayMax = 0.0, botMax = 0.0, presentMax = 0.0;
    ++frames;
    overlayMax = std::max(overlayMax, Ms(botStart - start).count());
    botMax = std::max(botMax, Ms(submit - botStart).count());
    presentMax = std::max(presentMax, Ms(finish - submit).count());
    const double elapsed = Ms(finish - windowStart).count();
    if (elapsed < 2000.0) return;
    CrashLog("[PERF] fps=%.1f overlayAndAutomationMaxMs=%.2f botMaxMs=%.2f presentMaxMs=%.2f cacheMaxMs=%.2f worldMaxMs=%.2f updateMaxMs=%.2f\n",
        1000.0 * frames / elapsed, overlayMax, botMax, presentMax,
        g_botPerfPeaks.entityCacheMs, g_botPerfPeaks.snapshotMs, g_botPerfPeaks.updateMs);
    g_botPerfPeaks = {};
    windowStart = finish;
    frames = 0;
    overlayMax = botMax = presentMax = 0.0;
}

HRESULT WINAPI HookedPresent(IDXGISwapChain* sc, UINT syncInterval, UINT flags) {
    WindowCallbackScope callback;
    if (g_shuttingDown) return g_presentOrig(sc, syncInterval, flags);
    PresentExecutionScope execution;
    if (!execution.ownsFrame) return g_presentOrig(sc, syncInterval, flags);
    const auto frameStart = PresentClock::now();
    if (InterlockedIncrement(&g_frameCounter) == 1) CrashLog("[PRESENT] first frame\n");

    static int s_autoPickHeroIdx = 0;
    static int s_attemptCountForCurrentHero = 0;
    static int s_fallbackOffset = 0;
    static uint64_t s_lastPickAttempt = 0;
    static uint64_t s_lastAutoAcceptMs = 0;
    static uint64_t s_lastAutoSearchMs = 0;
    static uint64_t s_lastAutoReconnectMs = 0;
    static bool s_autoQueueEnabled = false;
    static int  s_uiModeIdx = 0;
    static int  s_uiRegionIdx = 0;
    const uint64_t nowMs = GetTickCount64();
    static uint64_t lastAutomationTick = 0;
    if (!lastAutomationTick || nowMs - lastAutomationTick >= 100) {
        lastAutomationTick = nowMs;
        int roleIdx = (g_draftRole >= 0 && g_draftRole < 5) ? g_draftRole : 0;
        int activeSlot = FirstDraftHeroSlot(roleIdx, (s_autoPickHeroIdx >= 0 ? s_autoPickHeroIdx : 0) + s_fallbackOffset);
        g_targetPickHeroId = kHeroIds[roleIdx][activeSlot];
        uintptr_t rulesProxy = 0;
        const uintptr_t realGr = GetGameRulesPtr(&rulesProxy);
        // 1. АВТОПИК
        int curGameState = ReadGameRulesStateSafe(realGr);
        static int s_lastLoggedGs = -1;
        static uintptr_t s_lastLoggedProxy = 0;
        if (curGameState != s_lastLoggedGs || rulesProxy != s_lastLoggedProxy) {
            s_lastLoggedGs = curGameState;
            s_lastLoggedProxy = rulesProxy;
            CrashLog("[STATE] GameState changed to: %d (Proxy: 0x%llX, Rules: 0x%llX)\n",
                curGameState, (unsigned long long)rulesProxy, (unsigned long long)realGr);
        }

        // 1. АВТОПИК (ТОЛЬКО на стадии выбора героев GameState == 2!)
        static uint64_t s_draftStageStartMs = 0;
        if (g_autoPick && g_Pawn == 0 && curGameState == 2) {
            if (s_draftStageStartMs == 0) s_draftStageStartMs = nowMs;
            if (nowMs - s_draftStageStartMs >= 2000 && nowMs - s_lastPickAttempt >= 1800) {
                s_lastPickAttempt = nowMs;
                const char* heroName = internalHeroNames[roleIdx][activeSlot];
                int heroId = kHeroIds[roleIdx][activeSlot];
                if (DirectPickHero(heroName, heroId)) {
                    StepTrace("NativeDraft", "ACT", "Pick requested for %s (ID=%d)", heroName, heroId);
                    if (++s_attemptCountForCurrentHero >= 2) {
                        s_attemptCountForCurrentHero = 0;
                        s_fallbackOffset = (s_fallbackOffset + 1) % 12;
                    }
                } else {
                    StepTrace("NativeDraft", "WAIT", "ExecuteClientCmd could not submit pick for %s", heroName);
                }
            } else {
                StepTrace("NativeDraft", "TICK", "Waiting for pick retry interval");
            }
        }
        else {
            if (!g_autoPick) StepTrace("NativeDraft", "WAIT", "Auto-pick disabled");
            else if (g_Pawn) StepTrace("NativeDraft", "WAIT", "Local hero already bound");
            else StepTrace("NativeDraft", "WAIT", "GameState=%d; waiting for hero selection", curGameState);
            s_draftStageStartMs = 0;
            s_attemptCountForCurrentHero = 0;
            s_fallbackOffset = 0;
        }

        // 2. АВТОПРИНЯТИЕ через GC (0x1B9E k_EMsgGCReadyUp)
        if (g_autoAcceptEnabled && g_Pawn == 0 && curGameState == 0) {
            if (nowMs - s_lastAutoAcceptMs > 2500) {
                s_lastAutoAcceptMs = nowMs;
                TriggerAcceptMatchGC();
            }
        }

        // 3. АВТОПОИСК
        if (s_autoQueueEnabled && (curGameState == 0 || curGameState == 6)) {
            if (nowMs - s_lastAutoSearchMs > 6000) {
                s_lastAutoSearchMs = nowMs;
                if (curGameState == 6) {
                    ExecuteEngineConsoleCmd("disconnect");
                }

                else {
                    TriggerStartSearch(s_uiModeIdx, s_uiRegionIdx);
                }
            }
        }

        // 4. АВТОРЕКОННЕКТ
        if (g_autoReconnect && g_Pawn == 0 && curGameState == 7) {
            if (nowMs - s_lastAutoReconnectMs > 4500) {
                s_lastAutoReconnectMs = nowMs;
                TriggerAutoReconnect();
            }
        }
    }

    static int currentTab = 0;
    std::unique_lock<std::recursive_mutex> overlayLock(g_overlayMutex);
    if (g_toggleMenuPending.exchange(false)) g_showMenu = !g_showMenu;
    if (g_showMenu && InitPresentOverlay(sc)) {
        ImGui_ImplDX11_NewFrame();
        ImGui_ImplWin32_NewFrame();
        ImGui::NewFrame();
