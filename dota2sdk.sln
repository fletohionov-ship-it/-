    int count = mem::rd<int>(dataEntity + realVecOff);
    uintptr_t dataPtr = mem::rd<uintptr_t>(dataEntity + realVecOff + 0x08);
    if (!dataPtr || !mem::hp(dataPtr) || count <= teamSlot || count > 16) return 0;

    uintptr_t playerDataPtr = dataPtr + (uintptr_t)teamSlot * 0x12F0;
