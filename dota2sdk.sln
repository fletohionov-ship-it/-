                static int s_errCount = 0;
                if (s_errCount++ < 5) {
                    CrashLog("[EXEC-ERR] VTable slot 51 is invalid (0x%llX). Engine patched?\n", (unsigned long long)fnAddr);
                }
            }
        }
    }
    return false;
}

