static void CallLuaCallback(lua_State* L, const char* name) {
    SdkRingPush("CallCB", "ENTER '%s'", name ? name : "?");
    if (!L || !name) return;
    lua_getglobal(L, "Callback");
    if (!lua_istable(L, -1)) { lua_pop(L, 1); return; }
    lua_getfield(L, -1, "Call");
    if (!lua_isfunction(L, -1)) { lua_pop(L, 2); return; }
    lua_pushstring(L, name);
    if (lua_pcall(L, 1, 0, 0) != 0) {
        const char* err = lua_tostring(L, -1);
        if (err && strlen(err) > 0) { printf("[CB Err/%s] %s\n", name, err); CrashLog("[CB Err/%s] %s\n", name, err); }
        lua_pop(L, 1);
    }

    lua_pop(L, 1);
    SdkRingPush("CallCB", "EXIT '%s'", name ? name : "?");
}

static void WriteRuntimeDiagnostics(uint64_t now) {
    static uint64_t last = 0;
    if (!StepTraceDue(now, last)) return;
    char hero[128] = {};
    const bool hasPawn = g_Pawn && mem::hp(g_Pawn);
    if (hasPawn) UA::GetEntityDesignerName(g_Pawn, hero, sizeof(hero));
    const Vector3 position = hasPawn ? GetHeroPos(g_Pawn) : Vector3{};
    const int hp = hasPawn ? mem::rd<int>(g_Pawn + g_off.m_iHealth) : 0;
    const int maxHp = hasPawn ? mem::rd<int>(g_Pawn + g_off.m_iMaxHealth) : 0;
    CrashLog("[DIAG] GameState=%d GameTime=%.1f EntityList=0x%llX(ch0=0x%llX) CacheCnt=%d LocalCtrl=0x%llX Pawn=0x%llX(%s) HP=%d/%d Pos=(%.0f,%.0f)\n",
        GameRules_GetGameState(), GameRules_GetGameTime(), (unsigned long long)g_EntityList,
        (unsigned long long)GetEntityChunk(0), g_CacheCount, (unsigned long long)g_LocalController,
        (unsigned long long)g_Pawn, hero[0] ? hero : "-", hp, maxHp, position.x, position.y);
}

static void CallAllTickCallbacks() {
    static uint64_t s_lastBotTickMs = 0;
    const uint64_t nowTickMs = GetTickCount64();
    if (!g_running || g_shuttingDown || (s_lastBotTickMs && nowTickMs - s_lastBotTickMs < kBotTickIntervalMs)) return;
    s_lastBotTickMs = nowTickMs;
    ++g_botLogicTick;
    strncpy_s(g_sdkPhase, sizeof(g_sdkPhase), "Tick", sizeof(g_sdkPhase) - 1);
    const auto cacheStarted = BotPerfClock::now();
    UA::RefreshEntityCache();
    AccumulateBotPerf(g_botPerfPeaks.entityCacheMs, cacheStarted);
    if (!g_Pawn || !mem::hp(g_Pawn) || mem::rd<int>(g_Pawn + g_off.m_iMaxHealth) < 150
        || (g_PawnIndex > 0 && GetEntity(g_PawnIndex) != g_Pawn)) {
        g_Pawn = 0;
        g_PawnIndex = -1;
        static uint64_t lastDetect = 0;
        static uint64_t lastGeneration = 0;
        if (g_EntityList && (!lastDetect || nowTickMs - lastDetect >= 1000 || lastGeneration != g_entityListGeneration)) {
            lastDetect = nowTickMs;
            lastGeneration = g_entityListGeneration;
            AutoDetectHero();
        }
    }
    WriteRuntimeDiagnostics(nowTickMs);
    if (!g_L) {
        StepTrace("Tick", "WAIT", "Lua state is unavailable");
        return;
    }
    if (InterlockedCompareExchange(&g_tickPending, 1, 0) != 0) {
        StepTrace("Tick", "WAIT", "Previous Lua tick still running");
        return;
    }
    if (!g_Pawn) {
        StepTrace("OnUpdate", "WAIT", "No Local Hero (GameState=%d)", GameRules_GetGameState());
        __try {
            CallScriptRef(g_L, g_scriptOnUpdateExRef, "OnUpdateEx");
        }
        __except (EXCEPTION_EXECUTE_HANDLER) {
            StepTrace("OnUpdateEx", "LUA-ERR", "Native exception 0x%08lX", GetExceptionCode());
        }
        InterlockedExchange(&g_tickPending, 0);
        return;
    }

    SdkRingPush("OnUpdate", "enter, top=%d", lua_gettop(g_L));
    {
        static uint64_t s_lastTelemMs = 0;
        if (nowTickMs - s_lastTelemMs >= 5000 && g_Pawn && mem::hp(g_Pawn)) {
            s_lastTelemMs = nowTickMs;
            Vector3 hpPos = GetHeroPos(g_Pawn);
            int curHp = mem::rd<int>(g_Pawn + g_off.m_iHealth);
            int maxHp = mem::rd<int>(g_Pawn + g_off.m_iMaxHealth);
            int lvl = mem::rd<int>(g_Pawn + g_off.m_iCurrentLevel);
            float mana = mem::rd<float>(g_Pawn + g_off.m_flMana);
            float maxMana = mem::rd<float>(g_Pawn + g_off.m_flMaxMana);
            int pid = (g_LocalController && mem::hp(g_LocalController)) ? mem::rd<int>(g_LocalController + g_off.m_nPlayerID) : 0;
            uintptr_t pd = GetPlayerDataTeamPtr(pid);
            int gold = (pd && mem::hp(pd)) ? (mem::rd<int>(pd + 0x30) + mem::rd<int>(pd + 0x34)) : -1;

            char invBuf[512] = { 0 };
            int off = 0;
            for (int s = 0; s <= 8; ++s) {
                uintptr_t it = UA::FindUnitItemBySlot(g_Pawn, s);
                if (!it) continue;
                char iname[64] = { 0 };
                UA::GetEntityDesignerName(it, iname, sizeof(iname));
                const char* shortIname = (strncmp(iname, "item_", 5) == 0) ? (iname + 5) : iname;
                int ch = g_off.m_iCurrentCharges ? mem::rd<int>(it + g_off.m_iCurrentCharges) : 0;
                off += snprintf(invBuf + off, sizeof(invBuf) - off, "[%d]=%s(%d) ", s, shortIname, ch);
            }
            uintptr_t tpIt = UA::FindUnitItemBySlot(g_Pawn, 15);
            int tpCh = (tpIt && g_off.m_iCurrentCharges) ? mem::rd<int>(tpIt + g_off.m_iCurrentCharges) : 0;

            int nearTrees450 = 0, nearEnemyCreeps = 0, lowestCreepHp = 9999, nearNeutrals = 0;
            for (int i = 0; i < g_TreeCount; ++i) {
                uintptr_t tr = g_TreeCache[i];
                if (!tr || !mem::hp(tr)) continue;
                Vector3 tp = GetHeroPos(tr);
                if ((tp.x - hpPos.x) * (tp.x - hpPos.x) + (tp.y - hpPos.y) * (tp.y - hpPos.y) <= 450.0f * 450.0f) nearTrees450++;
            }
            for (int i = 0; i < g_CacheCount; ++i) {
                uintptr_t e = g_CacheEntries[i];
                if (!e || !mem::hp(e) || e == g_Pawn) continue;
                Vector3 ep = GetHeroPos(e);
                if ((ep.x - hpPos.x) * (ep.x - hpPos.x) + (ep.y - hpPos.y) * (ep.y - hpPos.y) > 900.0f * 900.0f) continue;
                char en[64] = { 0 };
                UA::GetEntityDesignerName(e, en, sizeof(en));
                if (strstr(en, "neutral")) nearNeutrals++;
                else if (strstr(en, "creep") && mem::rd<uint8_t>(e + g_off.m_iTeamNum) != g_LocalTeam) {
                    nearEnemyCreeps++;
                    int chp = mem::rd<int>(e + g_off.m_iHealth);
                    if (chp > 0 && chp < lowestCreepHp) lowestCreepHp = chp;
                }
            }

            CrashLog("[TELEM t=%.1fs] LVL=%d HP=%d/%d(%.0f%%) MP=%.0f/%.0f Gold=%d Dmg=%d Pos=(%.0f,%.0f) EnemyCreeps=%d(minHP=%d) Neut=%d Trees450=%d Runes=%d\n",
                GameRules_GetDOTATime(), lvl, curHp, maxHp, maxHp > 0 ? (100.0f * curHp / maxHp) : 0.0f,
                mana, maxMana, gold, UA::EstimateUnitBaseDamage(g_Pawn), hpPos.x, hpPos.y,
                nearEnemyCreeps, lowestCreepHp == 9999 ? 0 : lowestCreepHp, nearNeutrals, nearTrees450, g_RuneCount);
            CrashLog("[TELEM-INV] %s| TP=%s(%d)\n", invBuf[0] ? invBuf : "empty ", tpIt ? "yes" : "no", tpCh);
        }
    }
    LONG hk = InterlockedExchange(&g_hotkeyAction, 0);
    if (hk != 0 && g_L) {
        const char* cmd = nullptr;
        if (hk == 1) {
            cmd = "_G.BotConfig.role = 1; _G.BotConfig.lane = 0; print('[Hotkey] F5: Carry Mid');";
        }

        else if (hk == 2) {
            cmd = "_G.BotConfig.role = 2; _G.BotConfig.lane = 3; print('[Hotkey] F6: Mid Mid');";
        }

        else if (hk == 3) {
            cmd = "_G.BotConfig.role = 3; _G.BotConfig.lane = 2; print('[Hotkey] F8: Support Safe');";
        }

        if (cmd) {
            luaL_dostring(g_L, cmd);
            luaL_dostring(g_L, "if Menu.SyncBotConfig then Menu.SyncBotConfig() end");
        }
    }

    static volatile LONG g_uiDiag = 0;
    if (InterlockedIncrement(&g_uiDiag) == 30) {
        lua_getglobal(g_L, "Menu");
        if (lua_istable(g_L, -1)) {
            lua_getfield(g_L, -1, "Find");
            if (lua_isfunction(g_L, -1)) {
                lua_pushstring(g_L, "Scripts");
                lua_pushstring(g_L, "Bot");
                lua_pushstring(g_L, "Control");
                lua_pushstring(g_L, "Enabled");
                if (lua_pcall(g_L, 4, 1, 0) == 0) {
                    int ty = lua_type(g_L, -1);
                    CrashLog("[UIDIAG] Menu.Find returned %s\n", lua_typename(g_L, ty));
                    if (lua_istable(g_L, -1)) {
                        lua_getfield(g_L, -1, "Get");
                        if (lua_isfunction(g_L, -1)) {
                            lua_pushvalue(g_L, -2);
                            if (lua_pcall(g_L, 1, 1, 0) == 0) {
                                CrashLog("[UIDIAG] Get() -> %s\n", lua_toboolean(g_L, -1) ? "true" : "false");
                                lua_pop(g_L, 1);
                            }

                            else lua_pop(g_L, 1);
                        }

                        else lua_pop(g_L, 1);
                    }
                }

                else lua_pop(g_L, 1);
                lua_pop(g_L, 1);
            }

            else lua_pop(g_L, 1);
        }

        lua_pop(g_L, 1);
    }

    SdkRingPush("Tick", "ENTER top=%d", lua_gettop(g_L));
    __try {
        lua_settop(g_L, 0);
        CallScriptRef(g_L, g_scriptOnTickRef, "OnTick");
        if (g_scriptOnUpdateRef != LUA_NOREF && g_scriptSelfPlayRef != LUA_NOREF) {
            lua_settop(g_L, 0);
            lua_rawgeti(g_L, LUA_REGISTRYINDEX, g_scriptOnUpdateRef);
            lua_rawgeti(g_L, LUA_REGISTRYINDEX, g_scriptSelfPlayRef);
            const auto updateStarted = BotPerfClock::now();
            int result = lua_pcall(g_L, 1, 0, 0);
            AccumulateBotPerf(g_botPerfPeaks.updateMs, updateStarted);
            if (result != 0) {
                const char* err = lua_tostring(g_L, -1);
                StepTrace("OnUpdate", "LUA-ERR", "%s", err ? err : "<non-string error>");
                lua_settop(g_L, 0);
            }
        }

        lua_settop(g_L, 0);
        CallScriptRef(g_L, g_scriptOnUpdateExRef, "OnUpdateEx");
        lua_settop(g_L, 0);
        for (int i = 0; g_callbackNames[i]; i++) CallLuaCallback(g_L, g_callbackNames[i]);
        lua_settop(g_L, 0);
    }

    __except (EXCEPTION_EXECUTE_HANDLER) {
        StepTrace("Tick", "LUA-ERR", "Native exception 0x%08lX", GetExceptionCode());
    }

    InterlockedExchange(&g_tickPending, 0);
}

