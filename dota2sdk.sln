        }

        lua_rawget(L, 1);
        return 1;
    }

    __except (EXCEPTION_EXECUTE_HANDLER) {
        lua_pushnil(L);
        return 1;
    }
}

static int L_GameRulesIndexHandler(lua_State* L) {
    const char* key = lua_tostring(L, 2);
    if (key) {
        __try {
            const uintptr_t pGameRules = GetGameRulesInstance();
            if (!pGameRules) {
                lua_pushnumber(L, 0.0);
                return 1;
            }

            // GetGameTime, GetMatchTime, GetInGameTime, time - use GameRules_GetGameTime()
            if (strcmp(key, "GetGameTime") == 0 || strcmp(key, "GetMatchTime") == 0 ||
                strcmp(key, "GetInGameTime") == 0 || strcmp(key, "time") == 0) {
                lua_pushnumber(L, (double)GameRules_GetGameTime());
                return 1;
            }

            // IsPaused - read from 0x1AAC
            if (strcmp(key, "IsPaused") == 0) {
                bool isPaused = *reinterpret_cast<bool*>(pGameRules + 0x1AAC);
                lua_pushboolean(L, isPaused);
                return 1;
            }

            // IsDayTime - read m_bIsTemporaryDay from 0x6E4
            if (strcmp(key, "IsDayTime") == 0) {
                bool isDayTime = *reinterpret_cast<bool*>(pGameRules + 0x6E4);
                lua_pushboolean(L, isDayTime);
                return 1;
            }

            // IsNightTime - read m_bIsTemporaryNight from 0x6E5
            if (strcmp(key, "IsNightTime") == 0) {
                bool isNightTime = *reinterpret_cast<bool*>(pGameRules + 0x6E5);
                lua_pushboolean(L, isNightTime);
                return 1;
            }

            // GetGameStartTime, GetMatchStartTime, GetGameStart - return 0.0
            if (strcmp(key, "GetGameStartTime") == 0 || strcmp(key, "GetMatchStartTime") == 0 ||
                strcmp(key, "GetGameStart") == 0) {
                lua_pushnumber(L, 0.0);
                return 1;
            }
        }

        __except (EXCEPTION_EXECUTE_HANDLER) {
            lua_pushnumber(L, 0.0);
            return 1;
        }
    }

    lua_rawget(L, 1);
    return 1;
}

static int L_EngineIndexHandler(lua_State* L) {
    const char* key = lua_tostring(L, 2);
    if (key) {
        if (strcmp(key, "IsInGame") == 0) {
            lua_pushboolean(L, (g_Pawn != 0 && mem::hp(g_Pawn)) || (GameRules_GetGameState() >= 2));
            return 1;
        }

        if (strcmp(key, "IsConnected") == 0 || strcmp(key, "IsHUDVisible") == 0) {
            lua_pushboolean(L, true);
            return 1;
        }

        if (strcmp(key, "IsLoading") == 0) {
            lua_pushboolean(L, GameRules_GetGameState() == 1);
            return 1;
        }
    }

    lua_rawget(L, 1);
    return 1;
}

static int L_MenuFindWrapper(lua_State* L) {
    int n = lua_gettop(L);
    lua_pushvalue(L, lua_upvalueindex(1));
    for (int i = 1; i <= n; i++) {
        lua_pushvalue(L, i);
    }

    if (lua_pcall(L, n, 1, 0) != 0) {
        const char* err = lua_tostring(L, -1);
        CrashLog("[API] Menu.Find wrapper error: %s\n", err ? err : "?");
        lua_pop(L, 1);
        lua_pushnil(L);
        return 1;
    }

    if (lua_istable(L, -1) || lua_isuserdata(L, -1)) {
        lua_newtable(L);
        lua_pushcfunction(L, MenuWidgetIndexHandler);
        lua_setfield(L, -2, "__index");
        lua_setmetatable(L, -2);
    }

    return 1;
}

static void pushEntityWithMetatable(lua_State* L, uintptr_t ent) {
    if (!ent || !mem::hp(ent)) { lua_pushnil(L); return; }
    if (!lua_checkstack(L, 16)) { lua_pushnil(L); return; }
    lua_pushlightuserdata(L, (void*)(uintptr_t)0xDEAD0002ULL);
    lua_rawget(L, LUA_REGISTRYINDEX);
    if (!lua_istable(L, -1)) {
        lua_pop(L, 1);
        lua_newtable(L);
        lua_newtable(L);
        lua_pushstring(L, "v");
        lua_setfield(L, -2, "__mode");
        lua_setmetatable(L, -2);
        lua_pushlightuserdata(L, (void*)(uintptr_t)0xDEAD0002ULL);
        lua_pushvalue(L, -2);
        lua_rawset(L, LUA_REGISTRYINDEX);
    }

    lua_pushlightuserdata(L, (void*)ent);
    lua_rawget(L, -2);
    if (lua_istable(L, -1)) {
        lua_remove(L, -2);
        return;
    }

    lua_pop(L, 1);
    lua_newtable(L);
    lua_pushlightuserdata(L, (void*)ent);
    lua_setfield(L, -2, "__ptr");
    lua_pushlightuserdata(L, (void*)(uintptr_t)0xDEAD0001ULL);
    lua_rawget(L, LUA_REGISTRYINDEX);
    if (!lua_istable(L, -1)) {
        lua_pop(L, 1);
        lua_newtable(L);
        lua_pushcfunction(L, L_EntityIndexHandler);
        lua_setfield(L, -2, "__index");
        lua_pushcfunction(L, L_Fallback_ReturnNil);
        lua_setfield(L, -2, "__newindex");
        lua_pushlightuserdata(L, (void*)(uintptr_t)0xDEAD0001ULL);
        lua_pushvalue(L, -2);
        lua_rawset(L, LUA_REGISTRYINDEX);
    }

    lua_setmetatable(L, -2);
    lua_pushlightuserdata(L, (void*)ent);
    lua_pushvalue(L, -2);
    lua_rawset(L, -4);
    lua_remove(L, -2);
}

static uintptr_t GetVtableFn(uintptr_t obj, uintptr_t vtOff) {
    if (!obj || !mem::hp(obj)) return 0;
    uintptr_t vt = mem::rd<uintptr_t>(obj); if (!vt || !mem::hp(vt)) return 0;
    uintptr_t fn = mem::rd<uintptr_t>(vt + vtOff);
    if (!fn || !mem::isCodePtr(fn, "client.dll")) return 0;
    return fn;
}

namespace UA {
    static uintptr_t g_clientBase_cached = 0;
    static size_t g_clientSize_cached = 0;
    static void CacheClientModule() {
        if (g_clientBase_cached) return;
        HMODULE h = GetModuleHandleA("client.dll");
        if (!h) return;
        MODULEINFO mi{};
        if (GetModuleInformation(GetCurrentProcess(), h, &mi, sizeof(mi))) {
            g_clientBase_cached = (uintptr_t)mi.lpBaseOfDll;
            g_clientSize_cached = mi.SizeOfImage;
        }
    }

    static bool SafeReadModifierName(uintptr_t mod, char* out, size_t outSize) {
        if (!out || outSize < 2) return false;
        out[0] = '\0';
        if (!mod || !mem::hp(mod)) return false;
        CacheClientModule();
        __try {
            for (uintptr_t nameOff : { (uintptr_t)0x28, (uintptr_t)0x20, (uintptr_t)0x30, (uintptr_t)0x38 }) {
                uintptr_t strPtr = *(uintptr_t*)(mod + nameOff);
                if (mem::hp(strPtr)) {
                    const char* s = (const char*)strPtr;
                    if (strncmp(s, "modifier_", 9) == 0 || strncmp(s, "item_", 5) == 0) {
                        size_t len = strnlen(s, outSize - 1);
                        if (len > 0) {
                            memcpy(out, s, len);
                            out[len] = '\0';
                            return true;
                        }
                    }
                }
            }

            uintptr_t vt = *(uintptr_t*)mod;
            if (!g_clientBase_cached || vt < g_clientBase_cached || vt - g_clientBase_cached >= g_clientSize_cached) return false;
            uintptr_t col = *(uintptr_t*)(vt - 8);
            if (!mem::hp(col)) return false;
            int32_t td_rva = *(int32_t*)(col + 0x0C);
            if (td_rva <= 0 || td_rva > 0x08000000) return false;
            uintptr_t nameAddr = g_client + (uintptr_t)td_rva + 0x10;
            if (nameAddr < g_clientBase_cached || nameAddr - g_clientBase_cached >= g_clientSize_cached) return false;
            const char* rttiName = (const char*)nameAddr;
            size_t len = strnlen(rttiName, outSize - 1);
            if (len == 0) return false;
            memcpy(out, rttiName, len);
            out[len] = '\0';
            return true;
        }

        __except (EXCEPTION_EXECUTE_HANDLER) {
            out[0] = '\0';
            return false;
        }
    }

    static const char* Mod_GetName(uintptr_t mod) {
        static thread_local char s_modNameBuf[128];
        if (SafeReadModifierName(mod, s_modNameBuf, sizeof(s_modNameBuf))) {
            return s_modNameBuf;
        }

        return nullptr;
    }

