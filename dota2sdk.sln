    static bool WriteQuickBuySlots(uintptr_t qbCtrl, uintptr_t vecMem, int vecSize, const int* ids, int idCount) {
        __try {
            int allocCount = mem::rd<int>(qbCtrl + 0x28);
            if (allocCount <= 0 || allocCount > 64 || vecSize <= 0 || !mem::hp(vecMem)) return false;

            int maxSlots = allocCount < vecSize ? allocCount : vecSize;
            int limit = idCount < maxSlots ? idCount : maxSlots;
            if (limit <= 0) return false;

            for (int slotIndex = 0; slotIndex < limit; ++slotIndex) {
                uintptr_t slotAddress = vecMem + (uintptr_t)slotIndex * 0x58;
                if (!mem::hp(slotAddress)) break;
                *(int*)(slotAddress + 0x30) = ids[slotIndex];     // m_nAbilityID (+0x30)
                *(uint8_t*)(slotAddress + 0x44) = 1;              // m_bMarkedForBuy (+0x44)
            }
            return true;
        }
        __except (EXCEPTION_EXECUTE_HANDLER) {
            return false;
        }
    }

    int EN_SetQuickBuy(lua_State* L) {
        if (!lua_istable(L, 1)) {
            lua_pushboolean(L, false);
            return 1;
        }
        int ids[32] = { 0 };
        int idCount = 0;
        int tableLen = (int)lua_objlen(L, 1);
        for (int i = 1; i <= tableLen && idCount < 32; ++i) {
            lua_rawgeti(L, 1, i);
            if (lua_isnumber(L, -1)) {
                int id = (int)lua_tointeger(L, -1);
                if (id > 0) ids[idCount++] = id;
            }
            else if (lua_isstring(L, -1)) {
                int id = ResolveItemIdByName(L, lua_tostring(L, -1));
                if (id > 0) ids[idCount++] = id;
            }
            lua_pop(L, 1);
        }

        int pid = 0;
        if (g_LocalController && mem::hp(g_LocalController)) pid = mem::rd<int>(g_LocalController + g_off.m_nPlayerID);
        if ((pid < 0 || pid >= 10) && g_Pawn && mem::hp(g_Pawn)) pid = mem::rd<int>(g_Pawn + g_off.m_iPlayerID);
        if (pid < 0 || pid >= 10) pid = 0;

        uintptr_t pd = GetPlayerDataTeamPtr(pid);
        if (pd && g_off.m_quickBuyController && idCount > 0) {
            uintptr_t qbCtrl = pd + g_off.m_quickBuyController;
            int vecSize = mem::rd<int>(qbCtrl + 0x18);
            uintptr_t vecMem = mem::rd<uintptr_t>(qbCtrl + 0x20);
            int allocCount = mem::rd<int>(qbCtrl + 0x28);

            static int s_qbLogCount = 0;
            if (s_qbLogCount++ < 5) {
                CrashLog("[QB] pid=%d pd=0x%llX qbCtrl=0x%llX size=%d mem=0x%llX alloc=%d firstId=%d\n",
                    pid, (unsigned long long)pd, (unsigned long long)qbCtrl, vecSize, (unsigned long long)vecMem, allocCount, ids[0]);
            }

            if (vecMem && mem::hp(vecMem)) {
                WriteQuickBuySlots(qbCtrl, vecMem, vecSize, ids, idCount);
            }
        }
        lua_pushboolean(L, true);
        return 1;
    }

