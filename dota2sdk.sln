    int NPC_IsInRangeOfShop(lua_State* L) {
        uintptr_t p = checkEnt(L, 1);
        int shopType = lua_isnumber(L, 2) ? (int)lua_tointeger(L, 2) : -1;
        if (!p || !mem::hp(p)) { lua_pushboolean(L, false); return 1; }
        // Проверяем дистанцию ТОЛЬКО для Secret Shop (Потайной лавки)
        if (shopType == 2 || shopType == 5) {
            Vector3 pos = GetHeroPos(p);
            const float RADIUS = 900.0f;
            float s1x = -4700.0f, s1y = -600.0f;
            float s2x = 4700.0f, s2y = 600.0f;
            bool inSec = ((pos.x - s1x) * (pos.x - s1x) + (pos.y - s1y) * (pos.y - s1y) <= RADIUS * RADIUS) ||
                ((pos.x - s2x) * (pos.x - s2x) + (pos.y - s2y) * (pos.y - s2y) <= RADIUS * RADIUS);
            lua_pushboolean(L, inSec);
            return 1;
        }

        // Для домашней лавки всегда возвращаем true — закуп работает по всей карте через курьера!
        lua_pushboolean(L, true);
        return 1;
    }

    static bool GetRTTIName(uintptr_t ent, char* out, size_t outSize) {
        if (!out || outSize < 2) return false;
        out[0] = '\0';
        if (!ent || !mem::hp(ent)) return false;
        if (!g_client) return false;
        uintptr_t vt = mem::rd<uintptr_t>(ent);
        if (!vt || !mem::hp(vt)) return false;
        uintptr_t col = mem::rd<uintptr_t>(vt - 8);
        if (!col || !mem::hp(col)) return false;
        uint32_t nameRva = mem::rd<uint32_t>(col + 0x0C);
        if (nameRva == 0 || nameRva > 0x8000000) return false;
        const char* name = (const char*)(g_client + nameRva + 0x10);
        if (!name) return false;
        __try {
            size_t n = strnlen(name, outSize - 1);
            if (n == 0) return false;
            memcpy(out, name, n);
            out[n] = '\0';
            return true;
        }

        __except (EXCEPTION_EXECUTE_HANDLER) {
            out[0] = '\0';
            return false;
        }
    }

    bool GetEntityDesignerName(uintptr_t ent, char* out, size_t outSize) {
        if (!out || outSize < 2) return false;
        out[0] = '\0';
        if (!ent || !mem::hp(ent)) return false;
        uintptr_t ident = mem::rd<uintptr_t>(ent + 0x10);
        if (!ident || !mem::hp(ident)) return false;
        uintptr_t strPtr = mem::rd<uintptr_t>(ident + 0x20);
        if (!strPtr || strPtr == ~0ULL || !mem::hp(strPtr)) {
            strPtr = mem::rd<uintptr_t>(ident + 0x18);
            if (!strPtr || strPtr == ~0ULL || !mem::hp(strPtr)) return false;
        }

        __try {
            const char* str = (const char*)strPtr;
            size_t len = strnlen(str, outSize - 1);
            if (len == 0) return false;
            memcpy(out, str, len);
            out[len] = '\0';
            return true;
        }

        __except (EXCEPTION_EXECUTE_HANDLER) {
            out[0] = '\0';
            return false;
        }
    }

