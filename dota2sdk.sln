    int NPC_IsMovingReal(lua_State* L) {
        uintptr_t p = checkEnt(L, 1);
        if (!p || !mem::hp(p)) { lua_pushboolean(L, false); return 1; }
        if (p == g_Pawn) {
            uint64_t now = GetTickCount64();
            if (g_lastAttackOrderTick > 0 && (now - g_lastAttackOrderTick) < 350) {
                lua_pushboolean(L, false);
                return 1;
            }
        }

        struct MoveTrack { float x, y; uint64_t tick; bool moving; };
        static std::map<uintptr_t, MoveTrack> s_track;
        Vector3 pos = GetHeroPos(p);
        uint64_t now = GetTickCount64();
        auto it = s_track.find(p);
        if (it == s_track.end()) {
            s_track[p] = { pos.x, pos.y, now, false };
            lua_pushboolean(L, false);
            return 1;
        }

        if (now - it->second.tick >= 50) {
            float dx = pos.x - it->second.x;
            float dy = pos.y - it->second.y;
            it->second.moving = (dx * dx + dy * dy > 4.0f);
            it->second.x = pos.x;
            it->second.y = pos.y;
            it->second.tick = now;
        }

        lua_pushboolean(L, it->second.moving);
        return 1;
    }

    static bool IsUnitRangedSafe(uintptr_t p) {
        if (!p || !mem::hp(p)) return false;
        if (g_off.m_iAttackCapabilities > 0) {
            int cap = mem::rd<int>(p + g_off.m_iAttackCapabilities);
            if (cap == 1) return false;
            if (cap == 2) return true;
        }
        if (g_off.m_iAttackRange > 0) {
            int r = mem::rd<int>(p + g_off.m_iAttackRange);
            if (r >= 100 && r <= 1500) return r > 240;
        }
        char name[128] = { 0 };
        if (GetEntityDesignerName(p, name, sizeof(name))) {
            if (strstr(name, "ranged") || strstr(name, "tower") || strstr(name, "siege")) return true;
            if (strncmp(name, "npc_dota_hero_", 14) == 0) {
                if (strstr(name, "antimage") || strstr(name, "juggernaut") || strstr(name, "axe") ||
                    strstr(name, "mars") || strstr(name, "shredder") || strstr(name, "dawnbreaker") ||
                    strstr(name, "primal_beast") || strstr(name, "brewmaster") || strstr(name, "phantom_lancer") ||
                    strstr(name, "meepo") || strstr(name, "ember_spirit") || strstr(name, "void_spirit") ||
                    strstr(name, "broodmother") || strstr(name, "underlord") || strstr(name, "treant") ||
                    strstr(name, "kez")) {
                    return false;
                }
            }
        }
        uint32_t ut = mem::rd<uint32_t>(p + g_off.m_iUnitType);
        return ((ut >> 15) & 1) != 0;
    }

    int NPC_IsRangedReal(lua_State* L) {
        uintptr_t p = checkEnt(L, 1);
        lua_pushboolean(L, IsUnitRangedSafe(p));
        return 1;
    }

    static uint64_t ReadNPCStateMask(uintptr_t p) {
        if (!p || !mem::hp(p)) return 0;
        uintptr_t mgr = p + (g_off.m_ModifierManager ? g_off.m_ModifierManager : 0xE30);
        int count = mem::rd<int>(mgr + 0x10);
        uintptr_t list = mem::rd<uintptr_t>(mgr + 0x18);
        if (count <= 0 || count > 128 || !list || !mem::hp(list)) return 0;
        uint64_t mask = 0;
        char nameBuf[128];
        for (int i = 0; i < count; ++i) {
            uintptr_t mod = mem::rd<uintptr_t>(list + i * 8);
            if (!SafeReadModifierName(mod, nameBuf, sizeof(nameBuf))) continue;
            if (strstr(nameBuf, "stun") || strstr(nameBuf, "bashed")) mask |= (1ULL << 4);
            if (strstr(nameBuf, "silence")) mask |= (1ULL << 3);
            if (strstr(nameBuf, "hex") || strstr(nameBuf, "sheep") || strstr(nameBuf, "voodoo")) mask |= (1ULL << 5);
            if (strstr(nameBuf, "disarm")) mask |= (1ULL << 6);
            if (strstr(nameBuf, "root") || strstr(nameBuf, "ensnare") || strstr(nameBuf, "entangle")) mask |= (1ULL << 7);
            if (strstr(nameBuf, "muted")) mask |= (1ULL << 8);
            if (strstr(nameBuf, "invuln") || strstr(nameBuf, "cyclone") || strstr(nameBuf, "fountain_invulnerability")) mask |= (1ULL << 10);
            if (strstr(nameBuf, "black_king_bar") || strstr(nameBuf, "magic_immune") || strstr(nameBuf, "juggernaut_blade_fury")) mask |= (1ULL << 12);
            if (strstr(nameBuf, "attack_immune") || strstr(nameBuf, "ghost_state") || strstr(nameBuf, "decrepify")) mask |= (1ULL << 13);
        }

        return mask;
    }

    uint64_t GetNPCStateMask(uintptr_t p) {
        if (!p || !mem::hp(p)) return 0;
        const auto cached = g_cachedStateMasks.find(p);
        if (cached != g_cachedStateMasks.end()) return cached->second;
        const uint64_t mask = ReadNPCStateMask(p);
        g_cachedStateMasks.emplace(p, mask);
        return mask;
    }

