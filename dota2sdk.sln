    uintptr_t localCtrl = FindLocalControllerStrict();
    if (!localCtrl || !mem::isHeapObj(localCtrl)) return false;
    g_LocalController = localCtrl;
    int localPid = mem::rd<int>(localCtrl + g_off.m_nPlayerID);
    auto OnHeroBound = [&](uintptr_t hero, int idx) {
        g_Pawn = hero;
        g_PawnIndex = idx;
        g_LocalTeam = mem::rd<uint8_t>(hero + g_off.m_iTeamNum);
        if (s_lastDetectedPawn != hero) {
            s_lastDetectedPawn = hero;
            g_spentGoldEstimate = 0;
            g_totalTrainedPoints = 0;
            g_trainedAbilityLevels.clear();
            memset(g_castCooldownUntil, 0, sizeof(g_castCooldownUntil));
            LoadOffsets();
            g_GridNav.TryBindNativeGridNav();
            CrashLog("[HERO] Bound new hero pawn=0x%llX, refreshed Schema & Native CGridNav!\n", (unsigned long long)hero);
        }
        };
    uint32_t hh = mem::rd<uint32_t>(localCtrl + g_off.m_hAssignedHero);
    if (hh == 0 || hh == 0xFFFFFFFF) hh = mem::rd<uint32_t>(localCtrl + g_off.m_hPawn);
    if (hh != 0 && hh != 0xFFFFFFFF) {
        uintptr_t hero = ResolveHandle(hh);
        if (hero && IsRealHeroByFields(hero)) {
            OnHeroBound(hero, UA::GetEntityIndexFromPtr(hero));
            return true;
        }
    }

    if (localPid >= 0 && localPid < 24) {
        for (int i = 1; i <= 5000; ++i) {
            uintptr_t ent = GetEntity(i);
            if (!ent || !IsRealHeroByFields(ent)) continue;
            int heroPid = g_off.m_iPlayerID ? mem::rd<int>(ent + g_off.m_iPlayerID) : -1;
            uint32_t hOwner = g_off.m_hOwnerEntity ? mem::rd<uint32_t>(ent + g_off.m_hOwnerEntity) : 0;
            if (heroPid == localPid || (hOwner != 0 && hOwner != 0xFFFFFFFF && ResolveHandle(hOwner) == localCtrl)) {
                OnHeroBound(ent, i);
                return true;
            }
        }
    }

    return false;
}

