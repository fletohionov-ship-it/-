    uintptr_t dataEntity = isRadiant ? g_DataRadiantEntity : g_DataDireEntity;
    if (!dataEntity || !mem::hp(dataEntity)) dataEntity = g_DataRadiantEntity ? g_DataRadiantEntity : g_DataDireEntity;
