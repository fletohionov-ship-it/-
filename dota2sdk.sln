    static float ReadSpecialFromKV(lua_State* L, uintptr_t a, const char* key, int level) {
        if (!a || !key || !*key || !PushAbilityKVRecord(L, a)) return 0.0f;
        if (level < 1) level = ReadAbilityLevelSafe(a);
        if (level < 1) level = 1;
        float result = 0.0f;
        bool found = false;
        lua_getfield(L, -1, "AbilityValues");
        if (lua_istable(L, -1)) {
            lua_getfield(L, -1, key);
            if (lua_isnumber(L, -1)) { result = (float)lua_tonumber(L, -1); found = true; }
            else if (lua_isstring(L, -1)) { result = ParseLevelNumberFromStr(lua_tostring(L, -1), level); found = true; }
            else if (lua_istable(L, -1)) {
                lua_getfield(L, -1, "value");
                if (lua_isnumber(L, -1)) { result = (float)lua_tonumber(L, -1); found = true; }
                else if (lua_isstring(L, -1)) { result = ParseLevelNumberFromStr(lua_tostring(L, -1), level); found = true; }
                lua_pop(L, 1);
            }

            lua_pop(L, 1);
        }

        lua_pop(L, 1);
        if (!found) {
            lua_getfield(L, -1, key);
            if (lua_isnumber(L, -1)) { result = (float)lua_tonumber(L, -1); found = true; }
            else if (lua_isstring(L, -1)) { result = ParseLevelNumberFromStr(lua_tostring(L, -1), level); found = true; }
            lua_pop(L, 1);
        }

        lua_pop(L, 1);
        return result;
    }

