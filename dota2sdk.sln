    int Hero_GetRecentDamage(lua_State* L) {
        uintptr_t p = checkEnt(L, 1);
        if (!p || !mem::hp(p)) { lua_pushnumber(L, 0.0); return 1; }
        struct DmgTrack { uintptr_t ptr; int lastHp; float dmgAccum; uint64_t lastDropTick; };
        static DmgTrack s_dmg[2048] = { 0 };
        static int s_dmgCount = 0;
        int curHp = mem::rd<int>(p + g_off.m_iHealth);
        uint64_t now = GetTickCount64();
        DmgTrack* track = nullptr;
        for (int i = 0; i < s_dmgCount; ++i) {
            if (s_dmg[i].ptr == p) { track = &s_dmg[i]; break; }
        }

        if (!track && s_dmgCount < 2048) {
            track = &s_dmg[s_dmgCount++];
            track->ptr = p; track->lastHp = curHp; track->dmgAccum = 0.0f; track->lastDropTick = 0;
        }

        if (!track) { lua_pushnumber(L, 0.0); return 1; }
        if (now - track->lastDropTick > 2000) track->dmgAccum = 0.0f;
        if (curHp > 0 && curHp < track->lastHp) {
            track->dmgAccum += (float)(track->lastHp - curHp);
            track->lastDropTick = now;
        }

        track->lastHp = curHp;
        lua_pushnumber(L, (double)track->dmgAccum);
        return 1;
    }

