// ===== KV parser =====
struct KVEntry { std::string key, value; std::vector<KVEntry> children; bool hasChildren = false; };
class KVParser {
public:
    const char* p; const char* end;
    KVParser(const std::string& s) { p = s.data(); end = s.data() + s.size(); }
    void skipWS() {
        while (p < end) {
            char ch = *p;
            if (ch == ' ' || ch == '\t' || ch == '\r' || ch == '\n') { p++; continue; }
            if (ch == '/' && p + 1 < end && p[1] == '/') { p += 2; while (p < end && *p != '\n') p++; continue; }
            if (ch == '#' && p + 1 < end) { while (p < end && *p != '\n') p++; continue; }
            break;
        }
    }

    bool parseString(std::string& out) {
        skipWS(); if (p >= end || *p != '"') return false;
        p++; out.clear();
        while (p < end && *p != '"') { if (*p == '\\' && p + 1 < end) { p++; out += *p++; } else out += *p++; }
        if (p < end) p++; return true;
    }

    bool parseEntries(std::vector<KVEntry>& out) {
        while (true) {
            skipWS(); if (p >= end) return true;
            if (*p == '}') { p++; return true; }
            std::string key; if (!parseString(key)) return false;
            skipWS();
            if (p < end && *p == '{') {
                p++; KVEntry e; e.key = key; e.hasChildren = true;
                if (!parseEntries(e.children)) return false;
                out.push_back(std::move(e));
            }

            else {
                std::string val; if (!parseString(val)) return false;
                KVEntry e; e.key = key; e.value = val; out.push_back(std::move(e));
            }
        }
    }
};
static void kvEntriesToLua(lua_State* L, const std::vector<KVEntry>& entries) {
    lua_newtable(L);
    for (auto& e : entries) {
        if (e.hasChildren) { kvEntriesToLua(L, e.children); lua_setfield(L, -2, e.key.c_str()); }
        else {
            const char* s = e.value.c_str(); char* endptr = nullptr;
            double d = strtod(s, &endptr);
            if (endptr != s && endptr == s + strlen(s) && *s != '\0') lua_pushnumber(L, d);
            else lua_pushlstring(L, e.value.c_str(), e.value.size());
            lua_setfield(L, -2, e.key.c_str());
        }
    }
}

static bool readFileBytesKV(const std::wstring& wpath, std::string& out) {
    HANDLE h = CreateFileW(wpath.c_str(), GENERIC_READ, FILE_SHARE_READ, nullptr, OPEN_EXISTING, FILE_ATTRIBUTE_NORMAL, nullptr);
    if (h == INVALID_HANDLE_VALUE) return false;
    LARGE_INTEGER sz;
    if (!GetFileSizeEx(h, &sz) || sz.QuadPart > 200 * 1024 * 1024) { CloseHandle(h); return false; }
    out.resize((size_t)sz.QuadPart);
    DWORD r = 0; BOOL ok = ReadFile(h, &out[0], (DWORD)out.size(), &r, nullptr);
    CloseHandle(h); return ok && r == out.size();
}

