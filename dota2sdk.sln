// ===== Lua Vector =====
struct LuaVector { float x, y, z; };
static const char* VECTOR_MT = "umbrella.vector";
LuaVector* checkVec(lua_State* L, int idx) { return (LuaVector*)luaL_checkudata(L, idx, VECTOR_MT); }
LuaVector* pushVec(lua_State* L, float x, float y, float z) {
    LuaVector* v = (LuaVector*)lua_newuserdata(L, sizeof(LuaVector));
    v->x = x; v->y = y; v->z = z;
    luaL_getmetatable(L, VECTOR_MT); lua_setmetatable(L, -2); return v;
}

int vec_length_fn(lua_State* L) { LuaVector* v = checkVec(L, 1); lua_pushnumber(L, sqrtf(v->x * v->x + v->y * v->y + v->z * v->z)); return 1; }
int vec_length2d_fn(lua_State* L) { LuaVector* v = checkVec(L, 1); lua_pushnumber(L, sqrtf(v->x * v->x + v->y * v->y)); return 1; }
int vec_getforward_fn(lua_State* L) {
    LuaVector* v = checkVec(L, 1);
    if (!v) { pushVec(L, 1.0f, 0.0f, 0.0f); return 1; }
    float yaw = v->y;
    float radians = yaw * 3.14159f / 180.0f;
    pushVec(L, cosf(radians), sinf(radians), 0.0f);
    return 1;
}

int vec_len(lua_State* L) { lua_pushinteger(L, 1); return 1; }
int vec_index(lua_State* L) {
    LuaVector* v = checkVec(L, 1);
    if (lua_isnumber(L, 2)) {
        int idx = (int)lua_tointeger(L, 2);
        if (idx == 1 || idx == 2) { pushVec(L, v->x, v->y, v->z); return 1; }
        lua_pushnil(L);
        return 1;
    }

    const char* k = lua_tostring(L, 2); if (!k) { lua_pushnil(L); return 1; }
    if (!strcmp(k, "x")) lua_pushnumber(L, v->x);
    else if (!strcmp(k, "y")) lua_pushnumber(L, v->y);
    else if (!strcmp(k, "z")) lua_pushnumber(L, v->z);
    else if (!strcmp(k, "Length")) lua_pushcfunction(L, vec_length_fn);
    else if (!strcmp(k, "Length2D")) lua_pushcfunction(L, vec_length2d_fn);
    else if (!strcmp(k, "GetForward")) lua_pushcfunction(L, vec_getforward_fn);
    else lua_pushnil(L);
    return 1;
}

int vec_add(lua_State* L) {
    LuaVector* a = checkVec(L, 1);
    if (lua_isuserdata(L, 2)) { LuaVector* b = checkVec(L, 2); pushVec(L, a->x + b->x, a->y + b->y, a->z + b->z); }
    else { float n = (float)lua_tonumber(L, 2); pushVec(L, a->x + n, a->y + n, a->z + n); }
    return 1;
}

int vec_sub(lua_State* L) {
    LuaVector* a = checkVec(L, 1);
    if (lua_isuserdata(L, 2)) { LuaVector* b = checkVec(L, 2); pushVec(L, a->x - b->x, a->y - b->y, a->z - b->z); }
    else { float n = (float)lua_tonumber(L, 2); pushVec(L, a->x - n, a->y - n, a->z - n); }
    return 1;
}

int vec_mul(lua_State* L) { LuaVector* a = checkVec(L, 1); float n = (float)lua_tonumber(L, 2); pushVec(L, a->x * n, a->y * n, a->z * n); return 1; }
int vec_unm(lua_State* L) { LuaVector* a = checkVec(L, 1); pushVec(L, -a->x, -a->y, -a->z); return 1; }
int vec_tostring(lua_State* L) {
    LuaVector* a = checkVec(L, 1);
    char buf[128]; snprintf(buf, sizeof(buf), "Vector(%.1f, %.1f, %.1f)", a->x, a->y, a->z);
    lua_pushstring(L, buf); return 1;
}

int vec_equals(lua_State* L) {
    LuaVector* a = checkVec(L, 1); LuaVector* b = checkVec(L, 2);
    lua_pushboolean(L, fabsf(a->x - b->x) < 0.01f && fabsf(a->y - b->y) < 0.01f && fabsf(a->z - b->z) < 0.01f); return 1;
}

int l_Vector(lua_State* L) { pushVec(L, (float)lua_tonumber(L, 1), (float)lua_tonumber(L, 2), (float)lua_tonumber(L, 3)); return 1; }
