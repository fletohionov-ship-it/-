    if (playerID < 0 || playerID >= 10) playerID = 0;
    bool isRadiant = (playerID < 5);
    int teamSlot = playerID % 5;

    static uint64_t s_lastScanMs = 0;
    uint64_t nowMs = GetTickCount64();
    if (s_lastScanMs == 0 || nowMs - s_lastScanMs > 2000 || !g_DataRadiantEntity || !g_DataDireEntity || !mem::hp(g_DataRadiantEntity)) {
        s_lastScanMs = nowMs;
        g_DataRadiantEntity = 0;
        g_DataDireEntity = 0;
        if (g_EntityList) {
            for (int chunkIdx = 0; chunkIdx < 64; ++chunkIdx) {
                uintptr_t chunk = GetEntityChunk(chunkIdx);
                if (!chunk || !mem::hp(chunk)) continue;
                for (int slotInChunk = 0; slotInChunk < 512; ++slotInChunk) {
                    int i = (chunkIdx << CHUNK_SHIFT) | slotInChunk;
                    if (i <= 0) continue;
