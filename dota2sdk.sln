void CrashLogInit() {
    char path[MAX_PATH];
    GetModuleFileNameA(g_hMod, path, MAX_PATH);
    std::string s(path);
    size_t pos = s.find_last_of("\\/");
    if (pos != std::string::npos) s = s.substr(0, pos + 1);
    s += "dota2sdk_crash.log";
    fopen_s(&g_crashLog, s.c_str(), "w");
    if (g_crashLog) {
        setvbuf(g_crashLog, g_crashLogBuffer, _IOFBF, sizeof(g_crashLogBuffer));
        fprintf(g_crashLog, "=== Dota 2 SDK v64.0 Crash Log ===\n");
        fprintf(g_crashLog, "Built: %s %s\n", __DATE__, __TIME__);
        fflush(g_crashLog);
    }
}

LONG WINAPI CrashHandler(EXCEPTION_POINTERS* info) {
    CrashLog("\n===== SEH CRASH =====\n");
    unsigned int code = (unsigned int)info->ExceptionRecord->ExceptionCode;
    unsigned long long addr = (unsigned long long)info->ExceptionRecord->ExceptionAddress;
    CrashLog("Code: 0x%08X  Addr: 0x%llX\n", code, addr);
    if (g_crashLog) fflush(g_crashLog);
    return EXCEPTION_EXECUTE_HANDLER;
}

static volatile LONG g_vehDepth = 0;
static volatile LONG g_vehLogCount = 0;
LONG WINAPI VectoredHandler(PEXCEPTION_POINTERS info) {
    DWORD code = info->ExceptionRecord->ExceptionCode;
    if (code == 0xE06D7363) return EXCEPTION_CONTINUE_SEARCH; // C++ exception
    if (code == 0x40010006) return EXCEPTION_CONTINUE_SEARCH; // OutputDebugString
    if (code == 0x406D1388) return EXCEPTION_CONTINUE_SEARCH; // Thread name
    CONTEXT* ctx = info->ContextRecord;
    if (g_hMod) {
        MODULEINFO mi{};
        if (GetModuleInformation(GetCurrentProcess(), g_hMod, &mi, sizeof(mi))) {
            uintptr_t base = (uintptr_t)mi.lpBaseOfDll;
            if ((uintptr_t)ctx->Rip >= base && (uintptr_t)ctx->Rip < base + mi.SizeOfImage) {
                return EXCEPTION_CONTINUE_SEARCH;
            }
        }
    }

    HMODULE hSchema = GetModuleHandleA("schemasystem.dll");
    if (hSchema) {
        MODULEINFO mi{};
        if (GetModuleInformation(GetCurrentProcess(), hSchema, &mi, sizeof(mi))) {
            uintptr_t base = (uintptr_t)mi.lpBaseOfDll;
            if ((uintptr_t)ctx->Rip >= base && (uintptr_t)ctx->Rip < base + mi.SizeOfImage) {
                return EXCEPTION_CONTINUE_SEARCH;
            }
        }
    }

    BOOL isRealCrash = FALSE;
    switch (code) {
    case EXCEPTION_ACCESS_VIOLATION:
    case EXCEPTION_ILLEGAL_INSTRUCTION:
    case EXCEPTION_PRIV_INSTRUCTION:
    case EXCEPTION_IN_PAGE_ERROR:
    case EXCEPTION_ARRAY_BOUNDS_EXCEEDED:
    case EXCEPTION_DATATYPE_MISALIGNMENT:
        isRealCrash = TRUE; break;
    }

    if (!isRealCrash) return EXCEPTION_CONTINUE_SEARCH;
    unsigned int codeUi = (unsigned int)code;
    unsigned long long addr = (unsigned long long)info->ExceptionRecord->ExceptionAddress;
    CrashLog("\n===== VECTORED CRASH =====\n");
    CrashLog("Code: 0x%08X Addr: 0x%llX\n", codeUi, addr);
    {
        HMODULE hmods[256]; DWORD needed = 0;
        if (EnumProcessModules(GetCurrentProcess(), hmods, sizeof(hmods), &needed)) {
            DWORD count = needed / sizeof(HMODULE);
            for (DWORD i = 0; i < count; ++i) {
                MODULEINFO mi{};
                if (!GetModuleInformation(GetCurrentProcess(), hmods[i], &mi, sizeof(mi))) continue;
                uintptr_t base = (uintptr_t)mi.lpBaseOfDll;
                if ((uintptr_t)ctx->Rip >= base && (uintptr_t)ctx->Rip < base + mi.SizeOfImage) {
                    char name[MAX_PATH] = { 0 };
                    GetModuleBaseNameA(GetCurrentProcess(), hmods[i], name, MAX_PATH);
                    CrashLog("Fault module: %s + 0x%llX (base=0x%llX)\n",
                        name, (unsigned long long)((uintptr_t)ctx->Rip - base), (unsigned long long)base);
                    break;
                }
            }
        }
    }

    CrashLog("RIP=0x%llX RSP=0x%llX RBP=0x%llX\n",
        (unsigned long long)ctx->Rip, (unsigned long long)ctx->Rsp, (unsigned long long)ctx->Rbp);
    CrashLog("RAX=0x%llX RBX=0x%llX RCX=0x%llX RDX=0x%llX\n",
        (unsigned long long)ctx->Rax, (unsigned long long)ctx->Rbx, (unsigned long long)ctx->Rcx, (unsigned long long)ctx->Rdx);
    CrashLog("RSI=0x%llX RDI=0x%llX R8=0x%llX R9=0x%llX\n",
        (unsigned long long)ctx->Rsi, (unsigned long long)ctx->Rdi, (unsigned long long)ctx->R8, (unsigned long long)ctx->R9);
    if (g_L) {
        __try {
            CrashLog("Lua: stacktop=%d\n", lua_gettop(g_L));
            const char* luaErr = lua_tostring(g_L, -1);
            CrashLog("Lua: top-as-string='%s'\n", luaErr ? luaErr : "<not-a-string>");
        }

        __except (EXCEPTION_EXECUTE_HANDLER) {}
    }

    CrashLog("LastEntityKey='%s'\n", GetLastEntityKeyForLog());
    CrashLog("Phase='%s'\n", g_sdkPhase);
    __try { SdkRingDump(g_crashLog); }
    __except (EXCEPTION_EXECUTE_HANDLER) {}
    CrashLog("==========================\n");
    return EXCEPTION_CONTINUE_SEARCH;
}

bool InitConsole() {
    if (!AllocConsole()) return false;
    if (freopen_s(&g_fout, "CONOUT$", "w", stdout) != 0) return false;
    if (freopen_s(&g_fin, "CONIN$", "r", stdin) != 0) return false;
    SetConsoleOutputCP(65001); SetConsoleCP(65001);
    HANDLE h = GetStdHandle(STD_OUTPUT_HANDLE);
    DWORD m = 0;
    if (GetConsoleMode(h, &m)) g_ansi = !!SetConsoleMode(h, m | 0x0004);
    return true;
}

void CleanupConsole() {
    if (g_fout) fclose(g_fout);
    if (g_fin) fclose(g_fin);
    if (g_crashLog) {
        FILE* log = g_crashLog;
        g_crashLog = nullptr;
        fclose(log);
    }
    FreeConsole();
}

