}

static int L_NPCIndexHandler(lua_State* L) {
    __try {
        const char* key = lua_tostring(L, 2);
        if (!key) { lua_rawget(L, 1); return 1; }
        if (strcmp(key, "aoe_radiuses") == 0) {
            lua_newtable(L);
            return 1;
        }

        lua_rawget(L, 1);
        if (!lua_isnil(L, -1)) return 1;
        lua_pop(L, 1);
        if (strncmp(key, "Is", 2) == 0) {
            lua_pushcfunction(L, L_Fallback_ReturnFalse);
            return 1;
        }

        if (strncmp(key, "Get", 3) == 0) {
            lua_pushcfunction(L, L_Fallback_ReturnZero);
