    int GR_GetProjectiles(lua_State* L) {
        lua_newtable(L);
        if (!g_client) return 1;
        uintptr_t manager = mem::rd<uintptr_t>(g_client + PROJECTILE_MANAGER_RVA);
        if (!manager || !mem::hp(manager)) {
            uintptr_t gr = mem::rd<uintptr_t>(g_client + dwGameRules);
            if (gr && mem::hp(gr)) manager = mem::rd<uintptr_t>(gr + 0x8);
        }

        if (!manager || !mem::hp(manager)) return 1;
        uintptr_t projArray = manager + PROJECTILE_ARRAY_OFFSET;
        int count = 0;
        for (int i = 0; i < 1024; ++i) {
            uintptr_t pProj = mem::rd<uintptr_t>(projArray + i * 8);
            if (!pProj || !mem::hp(pProj)) continue;
            __try {
                float sx = mem::rd<float>(pProj + 0x0C);
                float sy = mem::rd<float>(pProj + 0x10);
                float sz = mem::rd<float>(pProj + 0x14);
                float vx = mem::rd<float>(pProj + 0x18);
                float vy = mem::rd<float>(pProj + 0x1C);
                float vz = mem::rd<float>(pProj + 0x20);
                float tx = mem::rd<float>(pProj + 0x24);
                float ty = mem::rd<float>(pProj + 0x28);
                float tz = mem::rd<float>(pProj + 0x2C);
                if (fabsf(vx) < 1.0f && fabsf(vy) < 1.0f) {
                    sx = mem::rd<float>(pProj + 0x50);
                    sy = mem::rd<float>(pProj + 0x54);
                    sz = mem::rd<float>(pProj + 0x58);
                    vx = mem::rd<float>(pProj + 0x68);
                    vy = mem::rd<float>(pProj + 0x6C);
                    vz = mem::rd<float>(pProj + 0x70);
                }

                if (fabsf(vx) < 1.0f && fabsf(vy) < 1.0f) continue;
                int32_t id = mem::rd<int32_t>(pProj + 0x40);
                uint32_t hCaster = mem::rd<uint32_t>(pProj + 0x90);
                uint32_t hTarget = mem::rd<uint32_t>(pProj + 0x94);
                int32_t srcIdx = (hCaster != 0 && hCaster != 0xFFFFFFFF) ? (int32_t)(hCaster & INDEX_MASK) : (mem::rd<int32_t>(pProj + 0x84) & INDEX_MASK);
                lua_newtable(L);
                lua_pushinteger(L, id != 0 ? id : (i + 1)); lua_setfield(L, -2, "id");
                pushVec(L, sx, sy, sz); lua_setfield(L, -2, "start_pos");
                pushVec(L, sx, sy, sz); lua_setfield(L, -2, "current_pos");
                pushVec(L, tx, ty, tz); lua_setfield(L, -2, "target_pos");
                pushVec(L, vx, vy, vz); lua_setfield(L, -2, "velocity");
                lua_pushinteger(L, srcIdx); lua_setfield(L, -2, "source_index");
                lua_pushnumber(L, sx); lua_setfield(L, -2, "start_x");
                lua_pushnumber(L, sy); lua_setfield(L, -2, "start_y");
                lua_pushnumber(L, sz); lua_setfield(L, -2, "start_z");
                lua_pushnumber(L, tx); lua_setfield(L, -2, "target_x");
                lua_pushnumber(L, ty); lua_setfield(L, -2, "target_y");
                lua_pushnumber(L, tz); lua_setfield(L, -2, "target_z");
                lua_pushnumber(L, vx); lua_setfield(L, -2, "vel_x");
                lua_pushnumber(L, vy); lua_setfield(L, -2, "vel_y");
                lua_pushnumber(L, vz); lua_setfield(L, -2, "vel_z");
                lua_pushinteger(L, hCaster); lua_setfield(L, -2, "caster_handle");
                lua_pushinteger(L, hTarget); lua_setfield(L, -2, "target_handle");
                lua_rawseti(L, -2, ++count);
            }

            __except (EXCEPTION_EXECUTE_HANDLER) {}
        }

        return 1;
    }

    static int ResolveItemIdByName(lua_State* L, const char* iname) {
        if (!iname || !*iname) return 0;
        std::string clean = iname;
        if (clean.find("item_") == 0) clean = clean.substr(5);
        std::string full = "item_" + clean;
        auto it1 = g_itemIdsByName.find(full);
        if (it1 != g_itemIdsByName.end() && it1->second > 0) return it1->second;
        auto it2 = g_itemIdsByName.find(clean);
        if (it2 != g_itemIdsByName.end() && it2->second > 0) return it2->second;
        int resolvedId = 0;
        lua_getglobal(L, "CatalogItemIds");
        if (lua_istable(L, -1)) {
            lua_getfield(L, -1, full.c_str());
            if (lua_isnumber(L, -1)) resolvedId = (int)lua_tointeger(L, -1);
            lua_pop(L, 1);
            if (resolvedId <= 0) {
                lua_getfield(L, -1, clean.c_str());
                if (lua_isnumber(L, -1)) resolvedId = (int)lua_tointeger(L, -1);
                lua_pop(L, 1);
            }
        }

        lua_pop(L, 1);
        if (resolvedId > 0) {
            g_itemIdsByName[full] = resolvedId;
            g_itemIdsByName[clean] = resolvedId;
        }

        return resolvedId;
    }

    int PL_PrepareUnitOrders(lua_State* L) {
        int n = lua_gettop(L);
        if (n < 2) { lua_pushboolean(L, false); return 1; }
        int order = (int)lua_tointeger(L, 2);
        uintptr_t target = 0;
        if (n >= 3) {
            if (lua_isnumber(L, 3)) target = (uintptr_t)lua_tointeger(L, 3);
            else if (lua_isstring(L, 3)) target = (uintptr_t)ResolveItemIdByName(L, lua_tostring(L, 3));
            else target = checkEnt(L, 3);
        }

        float px = 0, py = 0, pz = 0;
        if (n >= 4 && lua_isuserdata(L, 4)) {
            LuaVector* v = (LuaVector*)lua_touserdata(L, 4);
            if (v) { px = v->x; py = v->y; pz = v->z; }
        }

        else if (n >= 4 && lua_istable(L, 4)) {
            lua_getfield(L, 4, "x"); px = (float)lua_tonumber(L, -1); lua_pop(L, 1);
            lua_getfield(L, 4, "y"); py = (float)lua_tonumber(L, -1); lua_pop(L, 1);
            lua_getfield(L, 4, "z"); pz = (float)lua_tonumber(L, -1); lua_pop(L, 1);
        }

        int ability = 0;
        if (n >= 5) {
            if (lua_isnil(L, 5)) {
                ability = 0;
            }

            else if (lua_isnumber(L, 5)) {
                ability = (int)lua_tointeger(L, 5);
            }

            else if (lua_isstring(L, 5)) {
                ability = ResolveItemIdByName(L, lua_tostring(L, 5));
            }

            else {
                uintptr_t abEnt = checkEnt(L, 5);
                if (abEnt) ability = UA::GetEntityIndexFromPtr(abEnt);
            }
        }

        int issuer = (n >= 6) ? (int)lua_tointeger(L, 6) : 2;
        uintptr_t unit = (n >= 7) ? checkEnt(L, 7) : g_Pawn;
        if (!unit || !mem::hp(unit)) unit = g_Pawn;
        int queue = 0;
        if (n >= 8) {
            if (lua_isboolean(L, 8)) queue = lua_toboolean(L, 8) ? 1 : 0;
            else if (lua_isnumber(L, 8)) queue = (int)lua_tointeger(L, 8);
        }

        int show = (n >= 9) ? (lua_toboolean(L, 9) ? 1 : 0) : 0;
        int ok = LuaPrepareUnitOrdersRaw(unit, order, target, px, py, pz, ability, issuer, queue, show != 0);
        lua_pushboolean(L, ok != 0);
        return 1;
    }

    int PL_HoldPosition(lua_State* L) {
        uintptr_t unit = checkEnt(L, 2);
        if (!unit || !mem::hp(unit)) unit = g_Pawn;
        if (!unit || !mem::hp(unit)) { lua_pushboolean(L, false); return 1; }
        int queue = lua_isboolean(L, 3) ? (lua_toboolean(L, 3) ? 1 : 0) : 0;
        Vector3 v = GetHeroPos(unit);
        int ok = LuaPrepareUnitOrdersRaw(unit, 10, 0, v.x, v.y, v.z, 0, 2, queue, false);
        lua_pushboolean(L, ok != 0);
        return 1;
    }

    int PL_AttackTarget(lua_State* L) {
        int top = lua_gettop(L);
        uintptr_t unit = g_Pawn;
        uintptr_t target = 0;
        if (top >= 3) {
            uintptr_t u2 = checkEnt(L, 2);
            uintptr_t t3 = checkEnt(L, 3);
            if (t3) {
                unit = (u2 && mem::hp(u2)) ? u2 : g_Pawn;
                target = t3;
            }

            else {
                uintptr_t u1 = checkEnt(L, 1);
                unit = (u1 && mem::hp(u1)) ? u1 : g_Pawn;
                target = u2;
            }
        }

        else if (top == 2) {
            uintptr_t e1 = checkEnt(L, 1);
            uintptr_t e2 = checkEnt(L, 2);
            if (e2 && e1 == g_Pawn) {
                unit = e1;
                target = e2;
            }

            else if (e2) {
                unit = (e1 && mem::hp(e1)) ? e1 : g_Pawn;
                target = e2;
            }

            else {
                target = e1;
            }
        }

        else if (top == 1) {
            target = checkEnt(L, 1);
        }

        if (!unit || !mem::hp(unit)) unit = g_Pawn;
        if (!unit || !target || target == unit) { lua_pushboolean(L, false); return 1; }
        Vector3 v = GetHeroPos(target);
        int ok = LuaPrepareUnitOrdersRaw(unit, 4, target, v.x, v.y, v.z, 0, 2, 0, false);
        lua_pushboolean(L, ok != 0);
        return 1;
    }

    int PL_GetTotalGold(lua_State* L) {
