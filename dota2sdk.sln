    int NPC_IsChannellingAbilitySafe(lua_State* L) {
        uintptr_t p = checkEnt(L, 1);
        if (!p || !mem::hp(p)) { lua_pushboolean(L, false); return 1; }
        if (p == g_Pawn && GetTickCount64() < g_channelUntilTick) {
