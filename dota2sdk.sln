    static bool ReadEntityVisibility(uintptr_t p) {
        if (!p || !mem::hp(p) || mem::rd<int>(p + g_off.m_iHealth) <= 0) return false;
        if (mem::rd<uint8_t>(p + g_off.m_lifeState) != 0) return false;
        uintptr_t scene = mem::rd<uintptr_t>(p + g_off.m_pGameSceneNode);
        if (!scene || !mem::hp(scene)) return false;
        if (p == g_Pawn) return true;
        uint8_t myTeam = g_Pawn ? mem::rd<uint8_t>(g_Pawn + g_off.m_iTeamNum) : (uint8_t)g_LocalTeam;
        uint8_t entTeam = mem::rd<uint8_t>(p + g_off.m_iTeamNum);
        if (entTeam == myTeam) return true;
        Vector3 pos = GetHeroPos(p);
        if (fabsf(pos.x) < 1.0f && fabsf(pos.y) < 1.0f) return false;
        static std::unordered_map<uintptr_t, uint64_t> s_lastSeenMs;
        uint64_t nowMs = GetTickCount64();
        uint8_t dormant = mem::rd<uint8_t>(scene + 0x113);
        if (dormant == 0) {
            s_lastSeenMs[p] = nowMs;
            return true;
        }

        if (g_MapHackEnabled) {
            auto it = s_lastSeenMs.find(p);
            if (it != s_lastSeenMs.end() && (nowMs - it->second) <= 5000) {
                return true;
            }
        }

        for (int i = 0; i < g_CacheCount; ++i) {
            uintptr_t ally = g_CacheEntries[i];
            if (!ally || !mem::hp(ally)) continue;
            if (mem::rd<uint8_t>(ally + g_off.m_iTeamNum) != myTeam) continue;
            if (mem::rd<int>(ally + g_off.m_iHealth) <= 0) continue;
            Vector3 apos = GetHeroPos(ally);
            float dx = pos.x - apos.x;
            float dy = pos.y - apos.y;
            if (dx * dx + dy * dy <= 1850.0f * 1850.0f) {
                s_lastSeenMs[p] = nowMs;
                return true;
            }
        }

        return false;
    }

    static bool IsEntityVisibleToTeam(uintptr_t p) {
        if (!p || !mem::hp(p)) return false;
        const auto cached = g_cachedVisibility.find(p);
        if (cached != g_cachedVisibility.end()) return cached->second;
        const bool visible = ReadEntityVisibility(p);
        g_cachedVisibility.emplace(p, visible);
        return visible;
    }

