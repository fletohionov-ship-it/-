    static float ComputeUnitAttackSpeedSafe(uintptr_t p) {
        if (!p || !mem::hp(p)) return 100.0f;
        int baseAS = mem::rd<int>(p + 0xCE4);
        if (baseAS < 20 || baseAS > 1000) baseAS = 100;
        int agiOff = g_off.m_flAgilityTotal ? (int)g_off.m_flAgilityTotal : 0x1AF0;
        float agi = mem::rd<float>(p + agiOff);
        if (agi < 0.0f || agi > 2000.0f) agi = 0.0f;
        float totalAS = (float)baseAS + agi;
        if (totalAS < 20.0f) totalAS = 100.0f;
        if (totalAS > 1500.0f) totalAS = 1500.0f;
        return totalAS;
    }

