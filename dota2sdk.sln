// Автономный модуль динамической схемы с поддержкой наследования и кэшем VirtualQuery
namespace AutoSchema
{
    struct ClassEntry {
        std::string name, dll, base;
        uint32_t baseOff = 0;
        int32_t size = 0;
        std::unordered_map<std::string, uint32_t> fields;
    };

    struct RegionCache {
        static constexpr int kSlots = 12;
        uintptr_t base[kSlots] = {};
        uintptr_t end[kSlots] = {};
        int next = 0;
        bool Hit(uintptr_t p, uintptr_t e) const {
            for (int i = 0; i < kSlots; ++i)
                if (base[i] && p >= base[i] && e <= end[i]) return true;
            return false;
        }
        void Put(uintptr_t b, uintptr_t e) {
            base[next] = b; end[next] = e;
            next = (next + 1) % kSlots;
        }
    };
    static thread_local RegionCache g_rc;
    static std::unordered_map<std::string, ClassEntry> g_classes;

    inline bool Readable(uintptr_t p, size_t n) {
        if (!p || p < 0x10000) return false;
        uintptr_t end = p + n;
        if (end < p) return false;
        if (g_rc.Hit(p, end)) return true;

        uintptr_t cur = p;
        MEMORY_BASIC_INFORMATION mbi{};
        while (cur < end) {
            if (!VirtualQuery(reinterpret_cast<LPCVOID>(cur), &mbi, sizeof(mbi))) return false;
            if (mbi.State != MEM_COMMIT) return false;
            if (mbi.Protect & (PAGE_NOACCESS | PAGE_GUARD)) return false;
            const DWORD good = PAGE_READONLY | PAGE_READWRITE | PAGE_WRITECOPY |
                PAGE_EXECUTE_READ | PAGE_EXECUTE_READWRITE | PAGE_EXECUTE_WRITECOPY;
            if (!(mbi.Protect & good)) return false;
            uintptr_t regionEnd = reinterpret_cast<uintptr_t>(mbi.BaseAddress) + mbi.RegionSize;
            if (regionEnd <= cur) return false;
            cur = regionEnd;
            if (regionEnd >= end) g_rc.Put(reinterpret_cast<uintptr_t>(mbi.BaseAddress), regionEnd);
        }
        return true;
    }

    template <class T>
    inline bool SafeRead(uintptr_t addr, T& out) {
        if (!Readable(addr, sizeof(T))) return false;
        std::memcpy(&out, reinterpret_cast<const void*>(addr), sizeof(T));
        return true;
    }

    inline bool ReadCStr(uintptr_t addr, std::string& out, size_t maxLen = 96) {
        out.clear();
        if (!addr) return false;
        char buf[96];
        if (maxLen > sizeof(buf)) maxLen = sizeof(buf);
        if (Readable(addr, maxLen)) {
            std::memcpy(buf, reinterpret_cast<const void*>(addr), maxLen);
            for (size_t i = 0; i < maxLen; ++i) {
                if (buf[i] == 0) return !out.empty();
                unsigned char u = static_cast<unsigned char>(buf[i]);
                if (u < 0x20 || u > 0x7E) return false;
                out.push_back(buf[i]);
            }
            return false;
        }
        return false;
    }

    inline std::string Lower(std::string s) {
        for (char& c : s) if (c >= 'A' && c <= 'Z') c = static_cast<char>(c - 'A' + 'a');
        return s;
    }

    inline void CollectBinding(uintptr_t binding) {
        uintptr_t namePtr = 0, fieldsPtr = 0, dllPtr = 0;
        int16_t fieldCount = 0;
        int32_t classSize = 0;
        if (!SafeRead(binding + 0x08, namePtr) || !SafeRead(binding + 0x24, fieldCount) ||
            !SafeRead(binding + 0x20, classSize) || !SafeRead(binding + 0x30, fieldsPtr)) return;
        if (fieldCount < 0 || fieldCount > 1024) return;

        std::string clsName, dll, baseName;
        if (!ReadCStr(namePtr, clsName) || clsName.size() < 2) return;
        if (SafeRead(binding + 0x10, dllPtr)) ReadCStr(dllPtr, dll);

        uint32_t baseOff = 0;
        uintptr_t arr = 0;
        if (SafeRead(binding + 0x38, arr) && arr) {
            for (int s = 0; s < 6; ++s) {
                uintptr_t v = 0;
                if (!SafeRead(arr + s * 8, v) || v < 0x10000) continue;
                uintptr_t np = 0; std::string nm; int32_t bsize = 0;
                if (!SafeRead(v + 0x08, np) || !ReadCStr(np, nm) || nm.size() < 3 || nm[0] != 'C') continue;
                if (!SafeRead(v + 0x20, bsize) || bsize <= 0 || (classSize > 0 && bsize > classSize)) continue;
                baseName = nm;
                if (s > 0) {
                    int32_t bo = 0;
                    if (SafeRead(arr + (s - 1) * 8, bo) && bo >= 0 && bo < 0x10000)
                        baseOff = static_cast<uint32_t>(bo);
                }
                break;
            }
        }

        std::string key = Lower(clsName);
        ClassEntry& e = g_classes[key];
        if (e.name.empty()) {
            e.name = clsName; e.dll = dll; e.size = classSize; e.base = baseName; e.baseOff = baseOff;
        }
        else if (!dll.empty() && !e.dll.empty() && Lower(dll) != Lower(e.dll)) {
            if (Lower(dll) == "client" && Lower(e.dll) != "client") {
                e.dll = dll; e.size = classSize; e.base = baseName; e.baseOff = baseOff;
                e.fields.clear();
            }
            else {
                return;
            }
        }

        int validStreak = 0;
        for (int f = 0; f < fieldCount; ++f) {
            uintptr_t fd = fieldsPtr + static_cast<uintptr_t>(f) * 0x20;
            uintptr_t fnamePtr = 0; int32_t foffset = 0;
            if (!SafeRead(fd + 0x00, fnamePtr) || !SafeRead(fd + 0x10, foffset)) break;
            std::string fname;
            if (!ReadCStr(fnamePtr, fname) || fname.size() < 2) {
                if (++validStreak > 2) break;
                continue;
            }
            validStreak = 0;
            if (foffset >= -0x1000 && foffset <= 0x20000)
                e.fields.emplace(Lower(fname), static_cast<uint32_t>(foffset));
        }
    }

    // Поиск оффсета с учетом всей цепочки базовых классов (до 16 колен)
    inline uint32_t GetOffset(const std::string& cls, const std::string& fld, uint32_t fallback = 0) {
        std::string cur = Lower(cls);
        std::string target = Lower(fld);
        uint32_t accum = 0;
        for (int d = 0; d < 16 && !cur.empty(); ++d) {
            auto it = g_classes.find(cur);
            if (it == g_classes.end()) return fallback;
            auto jt = it->second.fields.find(target);
            if (jt != it->second.fields.end()) return jt->second + accum;
            if (it->second.base.empty()) return fallback;
            accum += it->second.baseOff;
            cur = Lower(it->second.base);
        }
        return fallback;
    }
}

