bool LoadHeroVtables() {
    std::ifstream f(GetHeroVtPath(), std::ios::binary);
    if (!f) return false; uint32_t count = 0; f.read((char*)&count, 4);
    if (count == 0 || count > 1000) return false;
    g_HeroVtableList.clear();
    for (uint32_t i = 0; i < count; i++) { uintptr_t v = 0; f.read((char*)&v, sizeof(v)); g_HeroVtableList.push_back(v); }
    return true;
}

static uintptr_t ReadEntityChunk(uintptr_t system, uintptr_t chunksOffset, int index) {
    if (!system) return 0;
    const uintptr_t chunk = mem::rd<uintptr_t>(system + chunksOffset + sizeof(uintptr_t) * index);
    return (chunk & 7) == 0 && mem::hp(chunk) ? chunk : 0;
}

static uintptr_t GetEntityChunk(int index) {
    return ReadEntityChunk(g_EntityList, g_entityChunksOffset, index);
}

static int ScoreEntityChunks(uintptr_t system, uintptr_t chunksOffset) {
    int score = 0;
    for (int chunkIndex = 0; chunkIndex < 2; ++chunkIndex) {
        const uintptr_t chunk = ReadEntityChunk(system, chunksOffset, chunkIndex);
        if (!chunk || !IsRealHeapPtr(chunk)) continue;
        for (int slot = 0; slot <= CHUNK_MASK; ++slot) {
            const uintptr_t identity = chunk + ENTRY_SIZE * slot;
            const uintptr_t entity = mem::rd<uintptr_t>(identity + ENTITY_OFF);
            if (!entity || (entity & 7) != 0 || !mem::hp(entity)) continue;
            const uint32_t index = (chunkIndex << CHUNK_SHIFT) | slot;
            if ((mem::rd<uint32_t>(identity + HANDLE_OFF) & INDEX_MASK) == index
                && mem::isHeapObj(entity)) {
                ++score;
                break;
            }
        }
    }
    return score;
}

static bool DetectEntityChunksOffset(uintptr_t system, uintptr_t preferredOffset, uintptr_t& offset) {
    if (!system || (system & 7) != 0 || !mem::hp(system) || !IsRealHeapPtr(system)) return false;
    const uintptr_t alternateOffset = preferredOffset == 0 ? 0x10 : 0;
    const int preferredScore = ScoreEntityChunks(system, preferredOffset);
    const int alternateScore = ScoreEntityChunks(system, alternateOffset);
    if (preferredScore == 0 && alternateScore == 0) return false;
    offset = alternateScore > preferredScore ? alternateOffset : preferredOffset;
    return true;
}

static void RefreshEntityList(uint64_t now) {
    static uint64_t lastCheck = 0;
    if (!g_client || (lastCheck && now - lastCheck < 1000)) return;
    lastCheck = now;

    const uintptr_t legacyRva = g_off.dwEntityList ? g_off.dwEntityList : dwEntityList;
    const uintptr_t legacy = mem::rd<uintptr_t>(g_client + legacyRva);
    uintptr_t system = legacy;
    uintptr_t offset = CHUNKS_BASE;
    const char* source = "legacy RVA";
    if (!DetectEntityChunksOffset(system, CHUNKS_BASE, offset)) {
        system = AutoResolveGameEntitySystem();
        source = "client signature";
        if (!DetectEntityChunksOffset(system, 0x10, offset)) {
            const uintptr_t server = mem::base("server.dll");
            g_pEntitySystem = server ? server + 0x4CFACE0 : 0;
            system = g_pEntitySystem ? mem::rd<uintptr_t>(g_pEntitySystem) : 0;
            source = "server global with client identities";
            if (!DetectEntityChunksOffset(system, 0x10, offset)) {
                system = 0;
                offset = CHUNKS_BASE;
            }
        }
    }

    if (!system) {
        StepTrace("EntityList", "WAIT", "No valid client chunks (legacy=0x%llX); retrying",
            (unsigned long long)legacy);
    }
    if (system == g_EntityList && offset == g_entityChunksOffset) return;
    g_EntityList = system;
    g_entityChunksOffset = offset;
    g_off.chunksBase = offset;
    ++g_entityListGeneration;
    g_Pawn = 0;
    g_PawnIndex = -1;
    g_LocalController = 0;
    g_CachedCourier = 0;
    g_CacheLastTick = 0;
    CrashLog("[ENTITYLIST] source=%s base=0x%llX chunks=+0x%llX ch0=0x%llX ch1=0x%llX\n",
        system ? source : "lost", (unsigned long long)system, (unsigned long long)offset,
        (unsigned long long)GetEntityChunk(0), (unsigned long long)GetEntityChunk(1));
}

uintptr_t GetEntityList() { return g_EntityList; }
uintptr_t GetEntity(int idx) {
    if (!g_EntityList) return 0;
    if (idx < 0 || idx > INDEX_MASK) return 0;
    uintptr_t chunk = GetEntityChunk(idx >> CHUNK_SHIFT);
    if (!chunk || !mem::hp(chunk)) return 0;
    uintptr_t ident = chunk + (int)(ENTRY_SIZE * (idx & CHUNK_MASK));
    if (!mem::hp(ident)) return 0;
    // Handle sanity check: low 15 bits of the handle at ident+HANDLE_OFF must equal idx.
    uint32_t h = mem::rd<uint32_t>(ident + HANDLE_OFF);
    if ((h & INDEX_MASK) != (uint32_t)idx) return 0;
    uintptr_t ent = mem::rd<uintptr_t>(ident + ENTITY_OFF);
    return (ent && mem::hp(ent)) ? ent : 0;
}

uintptr_t ResolveHandle(uint32_t handle) {
    if (handle == 0 || handle == 0xFFFFFFFF || handle == 0xFFFFFFFE) return 0;
    if (!g_EntityList) return 0;
    uint32_t idx = handle & INDEX_MASK;
    uintptr_t chunk = GetEntityChunk(idx >> CHUNK_SHIFT);
    if (!chunk || !mem::hp(chunk)) return 0;
    uintptr_t ident = chunk + (int)(ENTRY_SIZE * (idx & CHUNK_MASK));
    if (!mem::hp(ident)) return 0;
    uint32_t stored = mem::rd<uint32_t>(ident + HANDLE_OFF);
    if (stored != handle) return 0;   // strict handle match
    uintptr_t ent = mem::rd<uintptr_t>(ident + ENTITY_OFF);
    return (ent && mem::hp(ent)) ? ent : 0;
}

Vector3 GetHeroPos(uintptr_t pawn) {
    Vector3 v{ 0,0,0 };
    if (!pawn || !mem::hp(pawn)) return v;
    uintptr_t sceneOff = g_off.m_pGameSceneNode ? g_off.m_pGameSceneNode : 0x330;
    uintptr_t scene = mem::rd<uintptr_t>(pawn + sceneOff);
    if (!scene || !mem::hp(scene)) return v;
    uintptr_t vecOff = g_off.m_vecAbsOrigin ? g_off.m_vecAbsOrigin : 0xD8;
    uintptr_t posAddr = scene + vecOff;
    if (!mem::hp(posAddr)) return v;
    v.x = mem::rd<float>(posAddr + 0);
    v.y = mem::rd<float>(posAddr + 4);
    v.z = mem::rd<float>(posAddr + 8);
    return v;
}

static const char* kEmbeddedGridNavB64 =
"iVBORw0KGgoAAAANSUhEUgAAAUcAAAFHCAIAAAC9Kxk8AAAUz0lEQVR4nO2d27rkpg6E3fvL+79y74vOOIxtMAcdSqL+q8mK28agQggEPg5CCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQK/4PfoxJGWYDNMwAAAAASUVORK5CYII=";
static const char* kEmbeddedElevationB64 =
"";
static bool DecodeB64PngToGray327(const std::string& b64, std::vector<uint8_t>& outGray) {
    if (b64.size() < 1000) return false;
    DWORD binLen = 0;
    if (!CryptStringToBinaryA(b64.c_str(), (DWORD)b64.size(), CRYPT_STRING_BASE64, nullptr, &binLen, nullptr, nullptr) || binLen == 0) return false;
    std::vector<uint8_t> bin(binLen);
    if (!CryptStringToBinaryA(b64.c_str(), (DWORD)b64.size(), CRYPT_STRING_BASE64, bin.data(), &binLen, nullptr, nullptr)) return false;
    (void)CoInitializeEx(nullptr, COINIT_MULTITHREADED);
    IWICImagingFactory* pFactory = nullptr;
    if (FAILED(CoCreateInstance(CLSID_WICImagingFactory, nullptr, CLSCTX_INPROC_SERVER, IID_PPV_ARGS(&pFactory))) || !pFactory) return false;
    IWICStream* pStream = nullptr;
    IWICBitmapDecoder* pDecoder = nullptr;
    IWICBitmapFrameDecode* pFrame = nullptr;
    IWICFormatConverter* pConv = nullptr;
    bool ok = false;
    if (SUCCEEDED(pFactory->CreateStream(&pStream)) && pStream &&
        SUCCEEDED(pStream->InitializeFromMemory(bin.data(), binLen)) &&
        SUCCEEDED(pFactory->CreateDecoderFromStream(pStream, nullptr, WICDecodeMetadataCacheOnLoad, &pDecoder)) && pDecoder &&
        SUCCEEDED(pDecoder->GetFrame(0, &pFrame)) && pFrame &&
        SUCCEEDED(pFactory->CreateFormatConverter(&pConv)) && pConv &&
        SUCCEEDED(pConv->Initialize(pFrame, GUID_WICPixelFormat32bppBGRA, WICBitmapDitherTypeNone, nullptr, 0.0, WICBitmapPaletteTypeCustom))) {
        UINT w = 0, h = 0;
        pConv->GetSize(&w, &h);
        if (w == 327 && h == 327) {
            std::vector<uint8_t> bgra(327 * 327 * 4);
            if (SUCCEEDED(pConv->CopyPixels(nullptr, 327 * 4, (UINT)bgra.size(), bgra.data()))) {
                outGray.resize(327 * 327);
                int validCells = 0;
                for (size_t i = 0; i < 327 * 327; ++i) {
                    outGray[i] = bgra[i * 4 + 2];
                    if (outGray[i] >= 128) validCells++;
                }

                ok = (validCells > 5000);
            }
        }
    }

    if (pConv) pConv->Release();
    if (pFrame) pFrame->Release();
    if (pDecoder) pDecoder->Release();
    if (pStream) pStream->Release();
    pFactory->Release();
    return ok;
}

static std::string ExtractB64FieldFromHtml(const std::string& html, const char* sectionName) {
    size_t secPos = html.find(sectionName);
    if (secPos == std::string::npos) return "";
    size_t b64Pos = html.find("\"b64\":\"", secPos);
    if (b64Pos == std::string::npos || b64Pos - secPos > 200) return "";
    size_t start = b64Pos + 7;
    size_t end = html.find("\"", start);
    if (end == std::string::npos) return "";
    return html.substr(start, end - start);
}

// ============================================================================
//  GOD++ JPS PATHFINDER (Zero-Alloc JPS + Native CGridNav/327x327 +
//  Tower Danger CostMap + String Pulling + LRU PathCache + Local Avoidance)
// ============================================================================
struct NativeCGridNavLayout {
    char    pad_0x00[0x24];
    int32_t m_nGridWidth;      // +0x24
    char    pad_0x28[0x04];
    int32_t m_nGridHeight;     // +0x2C
    char    pad_0x30[0x20];
    float* m_pHeightMap;      // +0x50
    uint32_t* m_pTerrainMap;   // +0x58
};

class GridNavPathfinder {
public:
    static constexpr int kW = 327;
    static constexpr int kH = 327;
    static constexpr int kN = kW * kH;
    static constexpr float kMinX = -10464.0f;
    static constexpr float kMaxX = 10400.0f;
    static constexpr float kMinY = -10464.0f;
    static constexpr float kMaxY = 10400.0f;
    static constexpr float kSpanX = 20864.0f;
    static constexpr float kSpanY = 20864.0f;

    std::vector<uint8_t> m_staticTerrain;
    std::vector<uint8_t> m_elev;
    std::vector<uint8_t> m_walk;
    std::vector<float>   m_danger;

    // Нативный CGridNav из памяти движка (по конспекту 2_2.txt: +0x24, +0x2C, +0x50, +0x58)
    uintptr_t m_nativeGn = 0;
    int       m_natW = 0, m_natH = 0, m_natStride = 0;
    float* m_natHeightMap = nullptr;
    uint32_t* m_natTerrainMap = nullptr;
    bool      m_nativeSynced = false;

    struct PathCacheEntry {
        int sx, sy, ex, ey;
        uint64_t timestampMs;
        std::vector<std::pair<float, float>> worldPts;
    };
    std::vector<PathCacheEntry> m_cache;
    uint64_t m_lastPathSearchTick = 0;

    uint64_t m_lastSyncTick = 0;
    bool m_loaded = false;
    bool m_triedLoad = false;

    // Проверяет, является ли адрес валидным объектом CGridNav со структурой из 2_2.txt
    static bool IsValidNativeGridNavObj(uintptr_t cand, int& outW, int& outH, float*& outHMap, uint32_t*& outTMap) {
        if (!cand || !mem::isHeapObj(cand)) return false;
        int32_t w = mem::rd<int32_t>(cand + (g_off.gn_widthOff ? g_off.gn_widthOff : 0x24));
        int32_t h = mem::rd<int32_t>(cand + (g_off.gn_heightOff ? g_off.gn_heightOff : 0x2C));
        if (w < 120 || w > 512 || h < 120 || h > 512 || std::abs(w - h) > 16) return false;
        uintptr_t pH = mem::rd<uintptr_t>(cand + (g_off.gn_heightMapOff ? g_off.gn_heightMapOff : 0x50));
        uintptr_t pT = mem::rd<uintptr_t>(cand + (g_off.gn_terrainMapOff ? g_off.gn_terrainMapOff : 0x58));
        if (!mem::hp(pH) || !mem::hp(pT)) return false;

        int stride = (w + 3) & ~3;
        int centerIdx = (h / 2) * stride + (w / 2);
        uint32_t centerPacked = mem::rd<uint32_t>(pT + centerIdx * 4);
        float centerZ = mem::rd<float>(pH + centerIdx * 4);
        uint16_t tType = (uint16_t)(centerPacked & 0xFFFF);
        if ((tType == 16 || tType == 17) && centerZ >= -500.0f && centerZ <= 1500.0f) {
            outW = w; outH = h;
            outHMap = (float*)pH;
            outTMap = (uint32_t*)pT;
            return true;
        }
        return false;
    }

    // Авто-поиск CGridNav* в памяти client.dll (больше никогда не нужно искать вручную после обновлений!)
    bool TryBindNativeGridNav() {
        if (!m_loaded) return false;
        if (m_nativeSynced && m_nativeGn && mem::hp((uintptr_t)m_natHeightMap)) return true;
        // ВАЖНО: никогда не ищем CGridNav в главном меню (пока герой не загрузился на карту)!
        if (!g_client || !g_Pawn || !mem::hp(g_Pawn)) return false;

        static uint64_t s_lastTryMs = 0;
        uint64_t nowMs = GetTickCount64();
        if (nowMs - s_lastTryMs < 3000) return false;
        s_lastTryMs = nowMs;

        int w = 0, h = 0; float* hMap = nullptr; uint32_t* tMap = nullptr;
        uintptr_t knownRvas[] = { g_off.rvaGridNav, 0x61A5710, GRIDNAV_RVA };
        for (uintptr_t rva : knownRvas) {
            if (!rva) continue;
            uintptr_t ptr = mem::rd<uintptr_t>(g_client + rva);
            if (IsValidNativeGridNavObj(ptr, w, h, hMap, tMap)) {
                m_nativeGn = ptr;
                g_off.rvaGridNav = rva;
                break;
            }
        }

        if (m_nativeGn && hMap && tMap) {
            m_natW = w; m_natH = h; m_natStride = (w + 3) & ~3;
            m_natHeightMap = hMap; m_natTerrainMap = tMap;
            m_nativeSynced = true;

            for (int gy = 0; gy < kH; ++gy) {
                for (int gx = 0; gx < kW; ++gx) {
                    float wx = kMinX + ((float)gx + 0.5f) / (float)kW * kSpanX;
                    float wy = kMaxY - ((float)gy + 0.5f) / (float)kH * kSpanY;
                    int nx = std::max(0, std::min((int)((wx - (-10208.0f)) / (20416.0f / m_natW)), m_natW - 1));
                    int ny = std::max(0, std::min((int)((wy - (-10720.0f)) / (20928.0f / m_natH)), m_natH - 1));
                    uint32_t packed = mem::rd<uint32_t>((uintptr_t)m_natTerrainMap + (ny * m_natStride + nx) * 4);
                    uint16_t tType = (uint16_t)(packed & 0xFFFF);
                    m_staticTerrain[gy * kW + gx] = (tType == 16 || tType == 17) ? 1 : 0;
                }
            }
            m_walk = m_staticTerrain;
            m_cache.clear();
            CrashLog("[JPS-NATIVE] Synced native CGridNav (%dx%d) m_pHeightMap=0x%llX m_pTerrainMap=0x%llX!\n",
                m_natW, m_natH, (unsigned long long)m_natHeightMap, (unsigned long long)m_natTerrainMap);
            return true;
        }
        return false;
    }

    // Точное чтение Z-высоты рельефа из нативного m_pHeightMap (+0x50) с фоллбэком на m_elev
    float GetNativeGroundZ(float wx, float wy) const {
        if (m_nativeSynced && m_natHeightMap && mem::hp((uintptr_t)m_natHeightMap) && m_natW > 0 && m_natH > 0) {
            float cellX = 20416.0f / (float)m_natW;
            float cellY = 20928.0f / (float)m_natH;
            int nx = std::max(0, std::min((int)((wx - (-10208.0f)) / cellX), m_natW - 1));
            int ny = std::max(0, std::min((int)((wy - (-10720.0f)) / cellY), m_natH - 1));
            float z = mem::rd<float>((uintptr_t)m_natHeightMap + (ny * m_natStride + nx) * 4);
            if (z >= -500.0f && z <= 1500.0f) return z;
        }
        int gx, gy;
        WorldToGrid(wx, wy, gx, gy);
        int idx = gy * kW + gx;
        return (!m_elev.empty()) ? (128.0f + ((float)m_elev[idx] - 90.0f) * 2.0f) : 128.0f;
    }

    // 3D RayTrace по карте высот и препятствий
    bool TraceRay3D(float sx, float sy, float ex, float ey, float& outHitX, float& outHitY, float& outHitZ) const {
        outHitX = ex; outHitY = ey; outHitZ = GetNativeGroundZ(ex, ey);
        float dx = ex - sx, dy = ey - sy;
        float dist = std::sqrt(dx * dx + dy * dy);
        if (dist < 32.0f) return true;

        int steps = std::max(2, (int)(dist / 48.0f));
        float prevZ = GetNativeGroundZ(sx, sy);
        for (int i = 1; i <= steps; ++i) {
            float t = (float)i / (float)steps;
            float cx = sx + dx * t;
            float cy = sy + dy * t;
            float cz = GetNativeGroundZ(cx, cy);
            int gx, gy;
            WorldToGrid(cx, cy, gx, gy);
            if (IsBlocked(gx, gy) || std::fabs(cz - prevZ) > 68.0f) {
                outHitX = cx; outHitY = cy; outHitZ = cz;
                return false;
            }
            prevZ = cz;
        }
        return true;
    }

    bool Init() {
        if (m_loaded) return true;
        if (m_triedLoad) return false;
        m_triedLoad = true;
        m_danger.assign(kN, 0.0f);
        m_cache.reserve(32);

        std::wstring baseDir = GetDllDirW();
        std::vector<std::wstring> paths = {
            baseDir + L"zone_editor_custom_coordinates_2.html",
            baseDir + L"zone_editor_custom_coordinates.html",
            baseDir + L"scripts\\zone_editor_custom_coordinates_2.html",
            baseDir + L"scripts\\zone_editor_custom_coordinates.html",
            baseDir + L"scripts\\self_play\\zone_editor_custom_coordinates_2.html"
        };
        std::string htmlBuf;
        for (const auto& p : paths) {
            std::ifstream f(p, std::ios::binary);
            if (f) {
                htmlBuf.assign((std::istreambuf_iterator<char>(f)), std::istreambuf_iterator<char>());
                if (htmlBuf.size() > 10000) break;
            }
        }
        if (htmlBuf.size() > 10000) {
            std::string gridB64 = ExtractB64FieldFromHtml(htmlBuf, "\"gridnav\"");
            std::string elevB64 = ExtractB64FieldFromHtml(htmlBuf, "\"elevation\"");
            std::vector<uint8_t> gGray;
            if (DecodeB64PngToGray327(gridB64, gGray) && DecodeB64PngToGray327(elevB64, m_elev)) {
                m_staticTerrain.resize(kN);
                for (size_t i = 0; i < gGray.size(); ++i) m_staticTerrain[i] = (gGray[i] >= 128) ? 1 : 0;
                m_walk = m_staticTerrain;
                m_loaded = true;
                TryBindNativeGridNav();
                CrashLog("[JPS-GOD++] Loaded 327x327 GNV + Elevation from HTML!\n");
                return true;
            }
        }
        {
            std::vector<uint8_t> gGray;
            if (DecodeB64PngToGray327(kEmbeddedGridNavB64, gGray) && DecodeB64PngToGray327(kEmbeddedElevationB64, m_elev)) {
                m_staticTerrain.resize(kN);
                for (size_t i = 0; i < gGray.size(); ++i) m_staticTerrain[i] = (gGray[i] >= 128) ? 1 : 0;
                m_walk = m_staticTerrain;
                m_loaded = true;
                TryBindNativeGridNav();
                CrashLog("[JPS-GOD++] Loaded embedded 327x327 GNV + Elevation map!\n");
                return true;
            }
        }

        m_staticTerrain.assign(kN, 1);
        m_elev.assign(kN, 128);
        m_walk = m_staticTerrain;
        m_loaded = true;
        TryBindNativeGridNav();
        CrashLog("[JPS-GOD++] Initialized dynamic 327x327 JPS grid!\n");
        return true;
    }

    bool IsValid() const { return m_loaded; }
    int Width() const { return kW; }
    int Height() const { return kH; }

    inline void WorldToGrid(float wx, float wy, int& gx, int& gy) const {
        float fx = (wx - kMinX) / kSpanX * (float)kW;
        float fy = (kMaxY - wy) / kSpanY * (float)kH;
        gx = (int)std::floor(fx);
        gy = (int)std::floor(fy);
        gx = gx < 0 ? 0 : (gx >= kW ? kW - 1 : gx);
        gy = gy < 0 ? 0 : (gy >= kH ? kH - 1 : gy);
    }

    inline void GridToWorldCenter(int gx, int gy, float& wx, float& wy, float& wz) const {
        gx = gx < 0 ? 0 : (gx >= kW ? kW - 1 : gx);
        gy = gy < 0 ? 0 : (gy >= kH ? kH - 1 : gy);
        wx = kMinX + ((float)gx + 0.5f) / (float)kW * kSpanX;
        wy = kMaxY - ((float)gy + 0.5f) / (float)kH * kSpanY;
        wz = GetNativeGroundZ(wx, wy);
    }

    inline bool IsBlocked(int gx, int gy) const {
        if (gx < 0 || gy < 0 || gx >= kW || gy >= kH) return true;
        return m_walk[gy * kW + gx] == 0;
    }

    inline float GetDanger(int gx, int gy) const {
        if (gx < 0 || gy < 0 || gx >= kW || gy >= kH || m_danger.empty()) return 0.0f;
        return m_danger[gy * kW + gx];
    }

    // Проверка шага между соседними клетками (блокирует срез углов сквозь деревья и резкие клиффы)
    inline bool NavEdgeOK(int x, int y, int nx, int ny) const {
        if (nx < 0 || ny < 0 || nx >= kW || ny >= kH) return false;
        int a = y * kW + x;
        int b = ny * kW + nx;
        if (!m_walk[a] || !m_walk[b]) return false;
        if (!m_elev.empty() && std::abs((int)m_elev[a] - (int)m_elev[b]) > 24) return false;
        int dx = nx - x, dy = ny - y;
        if (dx != 0 && dy != 0) {
            int i1 = y * kW + (x + dx);
            int i2 = (y + dy) * kW + x;
            if (!m_walk[i1] || !m_walk[i2]) return false;
            if (!m_elev.empty() && (std::abs((int)m_elev[a] - (int)m_elev[i1]) > 24 ||
                std::abs((int)m_elev[a] - (int)m_elev[i2]) > 24)) return false;
        }
        return true;
    }

    // Проверка прямой видимости для String Pulling (учитывает и стены, и опасные зоны башен!)
    bool LineOfSight(int x0, int y0, int x1, int y1, bool avoidDanger = true) const {
        int dx = std::abs(x1 - x0), dy = std::abs(y1 - y0);
        int sx = (x0 < x1) ? 1 : -1, sy = (y0 < y1) ? 1 : -1;
        int err = dx - dy;
        int prevX = x0, prevY = y0;
        float startDanger = GetDanger(x0, y0);
        float endDanger = GetDanger(x1, y1);
        while (true) {
            if (!NavEdgeOK(prevX, prevY, x0, y0)) return false;
            // Не позволяем String Pulling спрямлять путь сквозь вражескую башню, если старт и финиш вне башни!
            if (avoidDanger && startDanger < 10.0f && endDanger < 10.0f && GetDanger(x0, y0) >= 25.0f) {
                return false;
            }
            if (x0 == x1 && y0 == y1) return true;
            prevX = x0; prevY = y0;
            int e2 = 2 * err;
            if (e2 > -dy) { err -= dy; x0 += sx; }
            if (e2 < dx) { err += dx; y0 += sy; }
        }
    }

    bool FindNearestUnblocked(int& gx, int& gy, int maxRadius = 18) const {
        if (!IsBlocked(gx, gy)) return true;
        int bestX = gx, bestY = gy, bestD2 = 999999;
        bool found = false;
        for (int r = 1; r <= maxRadius; ++r) {
            for (int dy = -r; dy <= r; ++dy) {
                for (int dx = -r; dx <= r; ++dx) {
                    int tx = gx + dx, ty = gy + dy;
                    if (!IsBlocked(tx, ty)) {
                        int d2 = dx * dx + dy * dy;
                        if (d2 < bestD2) { bestD2 = d2; bestX = tx; bestY = ty; found = true; }
                    }
                }
            }
            if (found) break;
        }
        if (found) { gx = bestX; gy = bestY; }
        return found;
    }

    // Rebuild dynamic obstacles at most once per second.
    void SyncDynamicObstacles() {
        const uint64_t now = GetTickCount64();
        if (m_lastSyncTick && now - m_lastSyncTick < 1000) return;
        if (!m_loaded && !Init()) return;
        m_lastSyncTick = now;
        if (!m_nativeSynced) TryBindNativeGridNav();
        m_cache.clear();
        m_walk = m_staticTerrain;
        std::fill(m_danger.begin(), m_danger.end(), 0.0f);

        // 1. Живые деревья (исключая срубленные из g_CutTreeUntilMs)
        for (int i = 0; i < g_TreeCount; ++i) {
            uintptr_t tree = g_TreeCache[i];
            if (!tree || !mem::hp(tree)) continue;
            int binId = UA::GetTreeBinaryIdOrIndex(tree);
            auto itCut = g_CutTreeUntilMs.find(binId);
            if (itCut != g_CutTreeUntilMs.end() && now < itCut->second) continue;

            Vector3 tp = GetHeroPos(tree);
            int gx0, gy0;
            WorldToGrid(tp.x, tp.y, gx0, gy0);
            for (int dy = -1; dy <= 1; ++dy) {
                for (int dx = -1; dx <= 1; ++dx) {
                    int x = gx0 + dx, y = gy0 + dy;
                    if (x < 0 || y < 0 || x >= kW || y >= kH) continue;
                    float wx, wy, wz;
                    GridToWorldCenter(x, y, wx, wy, wz);
                    if (std::fabs(wx - tp.x) <= 58.0f && std::fabs(wy - tp.y) <= 58.0f) {
                        m_walk[y * kW + x] = 0;
                    }
                }
            }
        }

        // 2. Постройки и CostMap вражеских башен
        for (int i = 0; i < g_CacheCount; ++i) {
            uintptr_t ent = g_CacheEntries[i];
            if (!ent || !mem::hp(ent) || ent == g_Pawn) continue;
            char name[128] = { 0 };
            if (!UA::GetEntityDesignerName(ent, name, sizeof(name))) continue;
            bool isTower = (strstr(name, "tower") != nullptr);
            bool isBuilding = isTower || strstr(name, "rax") || strstr(name, "barracks") ||
                strstr(name, "fort") || strstr(name, "building") || strstr(name, "filler") ||
                strstr(name, "healer") || strstr(name, "shrine");
            if (!isBuilding) continue;

            Vector3 bp = GetHeroPos(ent);
            float hull = mem::rd<float>(ent + (g_off.m_flHullRadius ? g_off.m_flHullRadius : 0xD60));
            if (hull < 60.0f || hull > 400.0f) {
                hull = strstr(name, "fort") ? 240.0f : (strstr(name, "rax") ? 175.0f : 140.0f);
            }
            int cellRad = (int)std::ceil(hull / 64.0f) + 1;
            int gx0, gy0;
            WorldToGrid(bp.x, bp.y, gx0, gy0);
            for (int dy = -cellRad; dy <= cellRad; ++dy) {
                for (int dx = -cellRad; dx <= cellRad; ++dx) {
                    int x = gx0 + dx, y = gy0 + dy;
                    if (x < 0 || y < 0 || x >= kW || y >= kH) continue;
                    float wx, wy, wz;
                    GridToWorldCenter(x, y, wx, wy, wz);
                    float d2 = (wx - bp.x) * (wx - bp.x) + (wy - bp.y) * (wy - bp.y);
                    if (d2 <= (hull + 20.0f) * (hull + 20.0f)) {
                        m_walk[y * kW + x] = 0;
                    }
                }
            }

            // Если это живая ВРАЖЕСКАЯ башня и под ней нет наших союзных крипов — размечаем радиус 820 как опасную зону!
            if (isTower && g_LocalTeam != 0 && mem::rd<uint8_t>(ent + g_off.m_iTeamNum) != g_LocalTeam) {
                bool allyCreepsTanking = false;
                for (int k = 0; k < g_CacheCount; ++k) {
                    uintptr_t a = g_CacheEntries[k];
                    if (!a || !mem::hp(a) || a == g_Pawn) continue;
                    if (mem::rd<uint8_t>(a + g_off.m_iTeamNum) != g_LocalTeam) continue;
                    Vector3 ap = GetHeroPos(a);
                    if ((ap.x - bp.x) * (ap.x - bp.x) + (ap.y - bp.y) * (ap.y - bp.y) <= 720.0f * 720.0f) {
                        allyCreepsTanking = true;
                        break;
                    }
                }
                if (!allyCreepsTanking) {
                    const float kTowerRad = 820.0f;
                    int rCells = (int)std::ceil(kTowerRad / 64.0f);
                    for (int dy = -rCells; dy <= rCells; ++dy) {
                        for (int dx = -rCells; dx <= rCells; ++dx) {
                            int x = gx0 + dx, y = gy0 + dy;
                            if (x < 0 || y < 0 || x >= kW || y >= kH) continue;
                            float wx, wy, wz;
                            GridToWorldCenter(x, y, wx, wy, wz);
                            float dist = std::sqrt((wx - bp.x) * (wx - bp.x) + (wy - bp.y) * (wy - bp.y));
                            if (dist <= kTowerRad) {
                                float factor = 1.0f - (dist / kTowerRad);
                                m_danger[y * kW + x] += 65.0f * factor;
                            }
                        }
                    }
                }
            }
        }
    }

    // Итеративный прыжок JPS (останавливается на углах препятствий И на границе опасности башен)
    int JumpJPS(int x, int y, int dx, int dy, int ex, int ey, int& stepsRemaining) const {
        while (stepsRemaining > 0) {
            --stepsRemaining;
            int nx = x + dx;
            int ny = y + dy;
            if (!NavEdgeOK(x, y, nx, ny)) return -1;
            if (nx == ex && ny == ey) return ny * kW + nx;

            // Если входим в опасную зону вражеской башни — делаем Jump Point, чтобы JPS оценил обход по лесу!
            if (GetDanger(x, y) < 10.0f && GetDanger(nx, ny) >= 20.0f) {
                return ny * kW + nx;
            }

            if (dx != 0 && dy != 0) {
                if ((!NavEdgeOK(nx, ny, nx - dx, ny) && NavEdgeOK(nx, ny, nx - dx, ny + dy)) ||
                    (!NavEdgeOK(nx, ny, nx, ny - dy) && NavEdgeOK(nx, ny, nx + dx, ny - dy))) {
                    return ny * kW + nx;
                }
                if (JumpJPS(nx, ny, dx, 0, ex, ey, stepsRemaining) != -1
                    || JumpJPS(nx, ny, 0, dy, ex, ey, stepsRemaining) != -1) {
                    return ny * kW + nx;
                }
            }
            else if (dx != 0) {
                if ((!NavEdgeOK(nx, ny, nx, ny + 1) && NavEdgeOK(nx, ny, nx + dx, ny + 1)) ||
                    (!NavEdgeOK(nx, ny, nx, ny - 1) && NavEdgeOK(nx, ny, nx + dx, ny - 1))) {
                    return ny * kW + nx;
                }
            }
            else {
                if ((!NavEdgeOK(nx, ny, nx + 1, ny) && NavEdgeOK(nx, ny, nx + 1, ny + dy)) ||
                    (!NavEdgeOK(nx, ny, nx - 1, ny) && NavEdgeOK(nx, ny, nx - 1, ny + dy))) {
                    return ny * kW + nx;
                }
            }
            x = nx;
            y = ny;
        }
        return -1;
    }

    bool FindPathWorld(float start_x, float start_y, float end_x, float end_y, std::vector<std::pair<float, float>>& out_world) {
        out_world.clear();
        if (!m_loaded || !std::isfinite(start_x) || !std::isfinite(start_y)
            || !std::isfinite(end_x) || !std::isfinite(end_y)) return false;
        SyncDynamicObstacles();
        int sx, sy, ex, ey;
        WorldToGrid(start_x, start_y, sx, sy);
        WorldToGrid(end_x, end_y, ex, ey);
        if (!FindNearestUnblocked(sx, sy, 18)) return false;
        if (!FindNearestUnblocked(ex, ey, 18)) return false;

        // 1. Быстрая проверка прямой видимости (0.001 мс)
        if ((sx == ex && sy == ey) || LineOfSight(sx, sy, ex, ey, true)) {
            out_world.emplace_back(start_x, start_y);
            out_world.emplace_back(end_x, end_y);
            return true;
        }

        const uint64_t nowMs = GetTickCount64();
        for (const auto& ce : m_cache) {
            if (nowMs - ce.timestampMs > 1000) continue;
            if (ce.sx == sx && ce.sy == sy && ce.ex == ex && ce.ey == ey) {
                out_world = ce.worldPts;
                out_world.front() = { start_x, start_y };
                out_world.back() = { end_x, end_y };
                return true;
            }
        }

        if (m_lastPathSearchTick && nowMs - m_lastPathSearchTick < 500) return false;
        m_lastPathSearchTick = nowMs;
        int stepsRemaining = 24000;

        // Use generation counters to reuse the search arrays.
        static std::vector<float> s_gScore(kN, 0.0f);
        static std::vector<int>   s_came(kN, -1);
        static std::vector<int>   s_visitedGen(kN, 0);
        static std::vector<int>   s_closedGen(kN, 0);
        static int s_curGen = 1;
        if (++s_curGen >= 0x3FFFFFFF) {
            std::fill(s_visitedGen.begin(), s_visitedGen.end(), 0);
            std::fill(s_closedGen.begin(), s_closedGen.end(), 0);
            s_curGen = 1;
        }

        struct Node { float f; int ci; };
        struct Cmp { bool operator()(const Node& a, const Node& b) const { return a.f > b.f; } };
        std::priority_queue<Node, std::vector<Node>, Cmp> heap;
        auto octile = [](int dx, int dy) {
            int mx = std::max(std::abs(dx), std::abs(dy));
            int mn = std::min(std::abs(dx), std::abs(dy));
            return (float)mx + 0.41421356f * (float)mn;
            };

        int si = sy * kW + sx;
        int ei = ey * kW + ex;
        s_gScore[si] = 0.0f;
        s_came[si] = -1;
        s_visitedGen[si] = s_curGen;
        heap.push({ octile(ex - sx, ey - sy), si });

        const int DX[8] = { 1, -1, 0, 0, 1, 1, -1, -1 };
        const int DY[8] = { 0, 0, 1, -1, 1, -1, 1, -1 };
        int closestNode = si;
        float closestH = octile(ex - sx, ey - sy);

        while (!heap.empty() && stepsRemaining > 0) {
            Node cur = heap.top(); heap.pop();
            int ci = cur.ci;
            if (s_closedGen[ci] == s_curGen) continue;
            if (ci == ei) { closestNode = ei; break; }
            s_closedGen[ci] = s_curGen;

            int x = ci % kW, y = ci / kW;
            float hNow = octile(ex - x, ey - y);
            if (hNow < closestH) { closestH = hNow; closestNode = ci; }

            int parent = s_came[ci];
            int dirs[8][2];
            int dirCount = 0;
            if (parent == -1) {
                for (int d = 0; d < 8; ++d) { dirs[dirCount][0] = DX[d]; dirs[dirCount][1] = DY[d]; dirCount++; }
            }
            else {
                int px = parent % kW, py = parent / kW;
                int dx = (x > px) ? 1 : ((x < px) ? -1 : 0);
                int dy = (y > py) ? 1 : ((y < py) ? -1 : 0);
                if (dx != 0 && dy != 0) {
                    dirs[dirCount][0] = dx; dirs[dirCount][1] = 0;  dirCount++;
                    dirs[dirCount][0] = 0;  dirs[dirCount][1] = dy; dirCount++;
                    dirs[dirCount][0] = dx; dirs[dirCount][1] = dy; dirCount++;
                    if (!NavEdgeOK(x, y, x - dx, y)) { dirs[dirCount][0] = -dx; dirs[dirCount][1] = dy;  dirCount++; }
                    if (!NavEdgeOK(x, y, x, y - dy)) { dirs[dirCount][0] = dx;  dirs[dirCount][1] = -dy; dirCount++; }
                }
                else if (dx != 0) {
                    dirs[dirCount][0] = dx; dirs[dirCount][1] = 0; dirCount++;
                    if (!NavEdgeOK(x, y, x, y + 1)) { dirs[dirCount][0] = dx; dirs[dirCount][1] = 1;  dirCount++; }
                    if (!NavEdgeOK(x, y, x, y - 1)) { dirs[dirCount][0] = dx; dirs[dirCount][1] = -1; dirCount++; }
                }
                else if (dy != 0) {
                    dirs[dirCount][0] = 0; dirs[dirCount][1] = dy; dirCount++;
                    if (!NavEdgeOK(x, y, x + 1, y)) { dirs[dirCount][0] = 1;  dirs[dirCount][1] = dy; dirCount++; }
                    if (!NavEdgeOK(x, y, x - 1, y)) { dirs[dirCount][0] = -1; dirs[dirCount][1] = dy; dirCount++; }
                }
            }

            for (int d = 0; d < dirCount; ++d) {
                int jNode = JumpJPS(x, y, dirs[d][0], dirs[d][1], ex, ey, stepsRemaining);
                if (jNode == -1 || s_closedGen[jNode] == s_curGen) continue;
                int jx = jNode % kW, jy = jNode / kW;
                float distCost = octile(jx - x, jy - y);
                float dangerPenalty = (GetDanger(x, y) + GetDanger(jx, jy)) * 0.5f;
                float ng = s_gScore[ci] + distCost + dangerPenalty;
                if (s_visitedGen[jNode] != s_curGen || ng < s_gScore[jNode]) {
                    s_visitedGen[jNode] = s_curGen;
                    s_gScore[jNode] = ng;
                    s_came[jNode] = ci;
                    heap.push({ ng + octile(ex - jx, ey - jy), jNode });
                }
            }
        }

        if (closestNode == si) return false;
        std::vector<int> jpsNodes;
        for (int at = closestNode; at != -1; at = s_came[at]) jpsNodes.push_back(at);
        std::reverse(jpsNodes.begin(), jpsNodes.end());

        // 4. String Pulling (спрямление пути по LineOfSight)
        std::vector<int> smoothed;
        smoothed.push_back(jpsNodes[0]);
        size_t i = 0;
        while (i < jpsNodes.size() - 1) {
            size_t best = i + 1;
            for (size_t j = jpsNodes.size() - 1; j > i + 1; --j) {
                int ax = jpsNodes[i] % kW, ay = jpsNodes[i] / kW;
                int bx = jpsNodes[j] % kW, by = jpsNodes[j] / kW;
                if (LineOfSight(ax, ay, bx, by, true)) { best = j; break; }
            }
            smoothed.push_back(jpsNodes[best]);
            i = best;
        }

        out_world.emplace_back(start_x, start_y);
        for (size_t k = 1; k < smoothed.size(); ++k) {
            float wx, wy, wz;
            GridToWorldCenter(smoothed[k] % kW, smoothed[k] / kW, wx, wy, wz);
            out_world.emplace_back(wx, wy);
        }
        if (closestNode == ei && !out_world.empty()) {
            out_world.back() = { end_x, end_y };
        }

        // 5. Сохраняем в LRU PathCache
        if (closestNode == ei && out_world.size() >= 2) {
            if (m_cache.size() >= 32) m_cache.erase(m_cache.begin());
            m_cache.push_back({ sx, sy, ex, ey, nowMs, out_world });
        }
        return out_world.size() >= 2;
    }

    // Модуль Local Avoidance: мягкое огибание стоящих на пути крипов и героев без пересчета сетки!
    void ApplyLocalAvoidance(float myX, float myY, float& wpX, float& wpY) const {
        float dirX = wpX - myX, dirY = wpY - myY;
        float wpDist = std::sqrt(dirX * dirX + dirY * dirY);
        if (wpDist < 60.0f) return;
        dirX /= wpDist; dirY /= wpDist;

        float repX = 0.0f, repY = 0.0f;
        for (int i = 0; i < g_CacheCount; ++i) {
            uintptr_t ent = g_CacheEntries[i];
            if (!ent || !mem::hp(ent) || ent == g_Pawn) continue;
            Vector3 up = GetHeroPos(ent);
            float ox = up.x - myX, oy = up.y - myY;
            float dist2 = ox * ox + oy * oy;
            if (dist2 > 165.0f * 165.0f || dist2 < 1.0f) continue;

            // Отталкиваемся только от тех юнитов, которые стоят ПЕРЕД нами по курсу движения
            float dot = (ox * dirX + oy * dirY);
            if (dot <= 0.0f) continue;
            float dist = std::sqrt(dist2);
            float force = (165.0f - dist) / 165.0f;
            // Перпендикулярное смещение в свободную сторону от юнита
            float cross = dirX * oy - dirY * ox;
            float side = (cross >= 0.0f) ? -1.0f : 1.0f;
            repX += (-dirY * side) * force * 42.0f;
            repY += (dirX * side) * force * 42.0f;
        }
        if (std::fabs(repX) > 1.0f || std::fabs(repY) > 1.0f) {
            float candX = wpX + repX, candY = wpY + repY;
            int gx, gy;
            WorldToGrid(candX, candY, gx, gy);
            if (!IsBlocked(gx, gy)) {
                wpX = candX;
                wpY = candY;
            }
        }
    }

    // Модуль Interception: итеративное упреждение движущейся цели (из 2_2.txt)
    static void ComputeInterception(
        float myX, float myY, float mySpeed,
        float targetX, float targetY, float targetVx, float targetVy,
        float& outX, float& outY)
    {
        outX = targetX; outY = targetY;
        float tSpeed2 = targetVx * targetVx + targetVy * targetVy;
        if (tSpeed2 < 25.0f || mySpeed < 100.0f) return;

        float px = targetX, py = targetY;
        for (int i = 0; i < 4; ++i) {
            float dx = px - myX, dy = py - myY;
            float dist = std::sqrt(dx * dx + dy * dy);
            if (dist < 80.0f) break;
            float t = std::min(dist / mySpeed, 1.8f);
            px = targetX + targetVx * t;
            py = targetY + targetVy * t;
        }
        outX = px; outY = py;
    }
};
