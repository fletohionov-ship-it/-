static void InstallPresentHook() {
    WNDCLASSEXA wc = { sizeof(wc) };
    wc.lpfnWndProc = DefWindowProcA;
    wc.hInstance = GetModuleHandleA(nullptr);
    wc.lpszClassName = "dummy_dx11_v601";
    RegisterClassExA(&wc);
    HWND hwnd = CreateWindowA("dummy_dx11_v601", "", WS_POPUP, 0, 0, 100, 100, nullptr, nullptr, wc.hInstance, nullptr);
    DXGI_SWAP_CHAIN_DESC scd = {};
    scd.BufferCount = 1;
    scd.BufferDesc.Format = DXGI_FORMAT_R8G8B8A8_UNORM;
    scd.BufferUsage = DXGI_USAGE_RENDER_TARGET_OUTPUT;
    scd.OutputWindow = hwnd;
    scd.SampleDesc.Count = 1;
    scd.Windowed = TRUE;
    scd.SwapEffect = DXGI_SWAP_EFFECT_DISCARD;
    ID3D11Device* dev = nullptr;
    ID3D11DeviceContext* ctx = nullptr;
    IDXGISwapChain* sc = nullptr;
    D3D_FEATURE_LEVEL lvl = D3D_FEATURE_LEVEL_11_0;
    HRESULT hr = D3D11CreateDeviceAndSwapChain(nullptr, D3D_DRIVER_TYPE_HARDWARE, nullptr, 0,
        &lvl, 1, D3D11_SDK_VERSION, &scd, &sc, &dev, nullptr, &ctx);
    if (SUCCEEDED(hr) && sc) {
        void** vt = *(void***)sc;
        g_presentVtable = vt;
        g_presentOrig = (PresentFn)vt[8];
        DWORD oldProtect = 0;
        if (VirtualProtect(&vt[8], sizeof(void*), PAGE_EXECUTE_READWRITE, &oldProtect)) {
            vt[8] = (void*)HookedPresent;
            VirtualProtect(&vt[8], sizeof(void*), oldProtect, &oldProtect);
            printf("[PRESENT] hooked (orig %p)\n", (void*)g_presentOrig);
            CrashLog("[PRESENT] hooked (orig %p)\n", (void*)g_presentOrig);
        }

        sc->Release(); if (ctx) ctx->Release(); if (dev) dev->Release();
    }

    else CrashLog("[PRESENT] failed hr=0x%X\n", (unsigned int)hr);
    if (hwnd) DestroyWindow(hwnd);
    UnregisterClassA("dummy_dx11_v601", wc.hInstance);
}

LRESULT CALLBACK HookedWndProc(HWND hwnd, UINT msg, WPARAM wParam, LPARAM lParam) {
    WindowCallbackScope callback;
    if (g_shuttingDown) return CallWindowProcW(g_origWndProc, hwnd, msg, wParam, lParam);
    if (msg == WM_KEYDOWN && wParam == VK_INSERT && !(lParam & 0x40000000)) {
        g_toggleMenuPending.store(true);
    }
    {
        const std::unique_lock<std::recursive_mutex> lock(g_overlayMutex, std::try_to_lock);
        if (lock.owns_lock() && g_showMenu && g_imguiInitialized) {
            ImGui_ImplWin32_WndProcHandler(hwnd, msg, wParam, lParam);
            ImGuiIO& io = ImGui::GetIO();
            if (io.WantCaptureMouse || io.WantCaptureKeyboard) return TRUE;
        }
    }

    if (msg == WM_KEYDOWN && !(lParam & 0x40000000)) {
        if (wParam == VK_F5) {
            InterlockedExchange(&g_hotkeyAction, 1);
        }

        else if (wParam == VK_F6) {
            InterlockedExchange(&g_hotkeyAction, 2);
        }

        else if (wParam == VK_F8) {
            InterlockedExchange(&g_hotkeyAction, 3);
        }
    }

    return CallWindowProcW(g_origWndProc, hwnd, msg, wParam, lParam);
}

BOOL CALLBACK EnumWindowsProc(HWND hwnd, LPARAM) {
    DWORD pid = 0; GetWindowThreadProcessId(hwnd, &pid);
    if (pid == GetCurrentProcessId() && IsWindowVisible(hwnd)) {
        wchar_t cls[64] = { 0 }; GetClassNameW(hwnd, cls, 63);
        if (wcsstr(cls, L"SDL") || wcsstr(cls, L"Valve") || wcsstr(cls, L"Dota") || wcsstr(cls, L"dota")) {
            g_gameHwnd = hwnd; CrashLog("[+] Found game HWND %p class=%ls\n", hwnd, cls); return FALSE;
        }
    }

    return TRUE;
}

void InstallWndProcHook() {
    EnumWindows(EnumWindowsProc, 0);
    if (!g_gameHwnd) {
        EnumWindows([](HWND h, LPARAM)->BOOL {
            DWORD pid = 0; GetWindowThreadProcessId(h, &pid);
            if (pid == GetCurrentProcessId() && IsWindowVisible(h)) { g_gameHwnd = h; return FALSE; }
            return TRUE;
            }, 0);
    }

    if (!g_gameHwnd) { printf("[!] No game window found\n"); return; }
    g_origWndProc = (WNDPROC)GetWindowLongPtrW(g_gameHwnd, GWLP_WNDPROC);
    if (!g_origWndProc || !SetWindowLongPtrW(g_gameHwnd, GWLP_WNDPROC, (LONG_PTR)HookedWndProc)) {
        CrashLog("[WND] Hook installation failed (%lu)\n", GetLastError());
        return;
    }
    if (g_origWndProc) { printf("[+] WndProc hooked\n"); CrashLog("[+] WndProc hooked HWND=%p\n", g_gameHwnd); }
}

void UninstallWndProcHook() {
    if (!g_gameHwnd || !g_origWndProc) return;
    if (GetWindowLongPtrW(g_gameHwnd, GWLP_WNDPROC) != (LONG_PTR)HookedWndProc) return;
    if (!SetWindowLongPtrW(g_gameHwnd, GWLP_WNDPROC, (LONG_PTR)g_origWndProc)) {
        CrashLog("[WND] Hook restoration failed (%lu)\n", GetLastError());
    }
}
static void UninstallPresentHook() {
    if (!g_presentVtable || !g_presentOrig || g_presentVtable[8] != (void*)HookedPresent) return;
    DWORD oldProtect = 0;
    if (VirtualProtect(&g_presentVtable[8], sizeof(void*), PAGE_EXECUTE_READWRITE, &oldProtect)) {
        g_presentVtable[8] = (void*)g_presentOrig;
        VirtualProtect(&g_presentVtable[8], sizeof(void*), oldProtect, &oldProtect);
        printf("[PRESENT] unhooked\n");
        CrashLog("[PRESENT] unhooked\n");
    }

    g_presentVtable = nullptr;
}

