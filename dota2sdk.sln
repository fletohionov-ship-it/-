// Pattern scanner for code sections
static uintptr_t FindPatternInCode(const char* moduleName, const char* pattern) {
    HMODULE hMod = GetModuleHandleA(moduleName);
    if (!hMod) return 0;
    MODULEINFO mi{};
    if (!GetModuleInformation(GetCurrentProcess(), hMod, &mi, sizeof(mi))) return 0;
    uintptr_t base = (uintptr_t)mi.lpBaseOfDll;
    size_t size = mi.SizeOfImage;

    // Convert pattern string to byte mask (using raw arrays)
    static uint8_t bytes[256];
    static uint8_t mask[256];
    size_t patternLen = 0;
    const char* p = pattern;
    while (*p && patternLen < 256) {
        if (*p == ' ') { p++; continue; }
        if (*p == '?') {
            bytes[patternLen] = 0;
            mask[patternLen] = 0;
            p++;
        }
        else {
            if (p[1] == 0) break;
            char hex[3] = { p[0], p[1], 0 };
            bytes[patternLen] = (uint8_t)strtol(hex, nullptr, 16);
            mask[patternLen] = 1;
            p += 2;
        }
        patternLen++;
    }
    if (patternLen == 0) return 0;

    __try {
        uint8_t* scanStart = (uint8_t*)base;
        uint8_t* scanEnd = scanStart + size - patternLen;
        for (uint8_t* ptr = scanStart; ptr < scanEnd; ptr++) {
            bool match = true;
            for (size_t i = 0; i < patternLen; i++) {
                if (mask[i] && ptr[i] != bytes[i]) {
                    match = false;
                    break;
                }
            }
            if (match) return (uintptr_t)ptr;
        }
    }
    __except (EXCEPTION_EXECUTE_HANDLER) {
        return 0;
    }
    return 0;
}

// Вычисление целевого адреса из RIP-relative инструкции (mov rax, [rip + disp32])
template <typename T>
inline T GetRipAddress(uintptr_t instructionAddr, int offsetToDisp = 3, int instructionSize = 7) {
    if (!instructionAddr) return T{};
    int32_t disp = *reinterpret_cast<int32_t*>(instructionAddr + offsetToDisp);
    return reinterpret_cast<T>(instructionAddr + instructionSize + disp);
}

// Авто-резолв GameEntitySystem из client.dll
inline uintptr_t AutoResolveGameEntitySystem() {
    static uintptr_t globalSlot = 0;
    static bool scanned = false;
    if (!scanned && GetModuleHandleA("client.dll")) {
        scanned = true;
        uintptr_t pat = 0;
        __try {
            pat = SmartCore::FindPatternInModule("client.dll",
                "48 8B ? ? ? ? ? 48 85 C0 0F 84 ? ? ? ? 48 8B 09 48 85 C9 74 06 "
                "48 8B 41 58 EB 16 80 7B 10 00 75 09 48 8B 80 10 02 00 00 EB 07 "
                "48 8B 80 30 02 00 00");
            if (pat && (mem::rd<uint8_t>(pat + 2) & 0xC7) == 0x05) {
                const uintptr_t slot = pat + 7 + mem::rd<int32_t>(pat + 3);
                if ((slot & 7) == 0 && mem::isCodePtr(slot, "client.dll")) globalSlot = slot;
            }
        }
        __except (EXCEPTION_EXECUTE_HANDLER) {}
        CrashLog("[ENTITYLIST] CGameEntitySystem signature slot=0x%llX\n", (unsigned long long)globalSlot);
    }
    return globalSlot ? mem::rd<uintptr_t>(globalSlot) : 0;
}

// Авто-резолв LocalPlayerController из client.dll
inline uintptr_t AutoResolveLocalPlayerController() {
    uintptr_t pat = FindPatternInCode("client.dll", "48 8B 05 ? ? ? ? 48 85 C0 74 4F");
    if (!pat) return 0;
    uintptr_t* pCtrl = GetRipAddress<uintptr_t*>(pat, 3, 7);
    return (pCtrl && !IsBadReadPtr(pCtrl, 8)) ? *pCtrl : 0;
}

static int FindFieldRecursive(SchemaClassInfoData_t* classInfo, const char* fieldName, int depth = 0) {
    if (!classInfo || !mem::hp((uintptr_t)classInfo) || depth > 8) return 0;
    uint16_t fieldCount = mem::rd<uint16_t>((uintptr_t)classInfo + 0x24);
    uintptr_t fieldsPtr = mem::rd<uintptr_t>((uintptr_t)classInfo + 0x30);
    if (fieldsPtr && mem::hp(fieldsPtr) && fieldCount > 0 && fieldCount < 2000) {
        for (uint16_t i = 0; i < fieldCount; ++i) {
            uintptr_t field = fieldsPtr + i * 0x20;
            const char* name = mem::rd<const char*>(field + 0x00);
            if (name && mem::hp((uintptr_t)name)) {
                __try {
                    if (strcmp(name, fieldName) == 0) {
                        int off = mem::rd<int>(field + 0x10);
                        CrashLog("[SCHEMA] FOUND '%s' at offset 0x%X\n", fieldName, off);
                        return off;
                    }
                }

                __except (EXCEPTION_EXECUTE_HANDLER) {}
            }
        }
    }

    uint8_t baseCount = mem::rd<uint8_t>((uintptr_t)classInfo + 0x29);
    if (baseCount == 0 || baseCount > 8) baseCount = 1;
    uintptr_t basesPtr = mem::rd<uintptr_t>((uintptr_t)classInfo + 0x38);
    if (basesPtr && mem::hp(basesPtr)) {
        for (uint8_t i = 0; i < baseCount; ++i) {
            uintptr_t baseEntry = basesPtr + i * 0x10;
            uint32_t baseOffset = mem::rd<uint32_t>(baseEntry + 0x00);
            uintptr_t baseClassPtr = mem::rd<uintptr_t>(baseEntry + 0x08);
            if (baseClassPtr && mem::hp(baseClassPtr) && baseOffset < 0x10000) {
                int off = FindFieldRecursive((SchemaClassInfoData_t*)baseClassPtr, fieldName, depth + 1);
                if (off != 0) return off + (int)baseOffset;
            }
        }
    }

    return 0;
}

static int QuerySchemaNative(const char* className, const char* fieldName) {
    __try {
        if (!g_pClientTypeScope) {
            void** vt = *(void***)g_pSchemaSystem;
            if (!vt || !vt[13]) return 0;
            typedef void* (__fastcall* FindTypeScopeFn)(void* thisptr, const char* moduleName, void* pOut);
            FindTypeScopeFn FindScope = (FindTypeScopeFn)vt[13];
            g_pClientTypeScope = FindScope(g_pSchemaSystem, "client.dll", nullptr);
            if (!g_pClientTypeScope) return 0;
        }

        void** scopeVt = *(void***)g_pClientTypeScope;
        if (!scopeVt) return 0;
        // vt[2] with OUT parameter (proven to work perfectly in our brute-force test)
        typedef void* (__fastcall* FindDeclaredClassFn)(void* thisptr, void** outClassInfo, const char* className);
        FindDeclaredClassFn FindClass = (FindDeclaredClassFn)scopeVt[2];
        if (!FindClass) return 0;
        void* classInfo = nullptr;
        __try {
            void* ret = FindClass(g_pClientTypeScope, &classInfo, className);
            if (!classInfo) classInfo = ret; // Fallback just in case
        }

        __except (EXCEPTION_EXECUTE_HANDLER) {}
        if (!classInfo || !mem::hp((uintptr_t)classInfo)) {
            static int failClass = 0;
            if (failClass++ < 3) CrashLog("[SCHEMA] FindClass failed for '%s'\n", className);
            return 0;
        }

        g_schemaReady = true;
        return FindFieldRecursive((SchemaClassInfoData_t*)classInfo, fieldName);
    }

    __except (EXCEPTION_EXECUTE_HANDLER) {
        return 0;
    }
}

inline int g_schemaResolvedCount = 0;
static int GetNativeSchemaOffset(const char* className, const char* fieldName) {
    if (!className || !fieldName) return 0;
    std::string cacheKey = std::string(className) + "::" + fieldName;
    {
        std::lock_guard<std::mutex> lock(g_schemaMutex);
        auto it = g_schemaCacheMap.find(cacheKey);
        if (it != g_schemaCacheMap.end()) {
            return it->second;
        }
    }

    InitSchemaSystem();
    if (!g_pSchemaSystem) return 0;
    int resultOffset = QuerySchemaNative(className, fieldName);
    if (resultOffset != 0) {
        std::lock_guard<std::mutex> lock(g_schemaMutex);
        g_schemaCacheMap[cacheKey] = resultOffset;
        g_schemaResolvedCount++;
        if (g_schemaCacheMap.size() == 1) {
            CrashLog("[SCHEMA] First resolved offset: %s::%s = 0x%X\n", className, fieldName, resultOffset);
        }
    }

    return resultOffset;
}

static int GetOff(const char* className, const char* fieldName, int fallback) {
    int off = GetNativeSchemaOffset(className, fieldName);
    return (off != 0) ? off : fallback;
}

