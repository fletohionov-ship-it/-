    static int ReadAbilityLevelSafe(uintptr_t a) {
        if (!a || !mem::hp(a)) return 0;
        char name[128] = { 0 };
        if (GetEntityDesignerName(a, name, sizeof(name)) && strncmp(name, "item_", 5) == 0) {
            return 1;
        }

        int abIdx = UA::GetEntityIndexFromPtr(a);
        int trained = (abIdx > 0 && g_trainedAbilityLevels.count(abIdx)) ? g_trainedAbilityLevels[abIdx] : 0;
        int lvl = (g_off.m_iLevel) ? mem::rd<int>(a + g_off.m_iLevel) : 0;
        if (lvl < 0 || lvl > 7) lvl = 0;
        return (lvl > trained) ? lvl : trained;
    }

    static float GetEffectiveCooldown(uintptr_t a) {
        if (!a || !mem::hp(a)) return 0.0f;
        float bestCd = 0.0f;
        int abIdx = UA::GetEntityIndexFromPtr(a);
        if (abIdx > 0 && abIdx < 32768) {
            float rem = g_castCooldownUntil[abIdx] - GameRules_GetGameTime();
            if (rem > bestCd) bestCd = rem;
        }

        if (g_off.m_fCooldown > 0) {
            float rawCd = mem::rd<float>(a + g_off.m_fCooldown);
            if (rawCd > bestCd && rawCd <= 180.0f) bestCd = rawCd;
        }

        return bestCd;
    }

    // Находит универсальный скилл уклонения/неуязвимости у ЛЮБОГО из наших 60 героев
    // typeOut: 8 = без цели (Blade Fury, Counterspell, Rage, Switcheroo, Dissimulate), 5 = в точку (Ball Lightning, Sleight, Waveform, Time Walk), 6 = на себя (Disruption, Astral, Cold Embrace)
    static uintptr_t FindHeroNativeDodgeSpell(uintptr_t hero, int& typeOut) {
        if (!hero || !mem::hp(hero)) return 0;
        float myMana = mem::rd<float>(hero + (g_off.m_flMana ? g_off.m_flMana : 0xCFC));
        for (int s = 0; s < 6; ++s) {
            uintptr_t ab = UA::GetUnitAbilityBySlot(hero, s);
            if (!ab || !mem::hp(ab) || ReadAbilityLevelSafe(ab) <= 0 || GetEffectiveCooldown(ab) > 0.05f) continue;
            int mCost = g_off.m_iManaCost ? mem::rd<int>(ab + g_off.m_iManaCost) : 50;
            if (mCost > 0 && myMana < (float)mCost) continue;

            char name[96] = { 0 };
            if (!UA::GetEntityDesignerName(ab, name, sizeof(name))) continue;

            if (strstr(name, "counterspell") || strstr(name, "blade_fury") ||
                strstr(name, "life_stealer_rage") || strstr(name, "phase_shift") ||
                strstr(name, "dissimulate") || strstr(name, "voodoo_switcheroo") ||
                strstr(name, "nyx_assassin_spiked_carapace")) {
                typeOut = 8; return ab;
            }
            if (strstr(name, "ember_spirit_sleight") || strstr(name, "ball_lightning") ||
                strstr(name, "waveform") || strstr(name, "faceless_void_time_walk") ||
                strstr(name, "antimage_blink") || strstr(name, "queenofpain_blink")) {
                typeOut = 5; return ab;
            }
            if (strstr(name, "shadow_demon_disruption") || strstr(name, "obsidian_destroyer_astral") ||
                strstr(name, "dazzle_shallow_grave")) {
                typeOut = 6; return ab;
            }
        }
        return 0;
    }

    // Проверяет, бьет ли вражеская башня прямо сейчас нашего героя, и находит союзного крипа для сброса агра (De-Aggro)
    static uintptr_t FindAllyCreepForTowerDeaggro(uintptr_t hero) {
        if (!hero || !mem::hp(hero)) return 0;
        Vector3 myPos = GetHeroPos(hero);
        uintptr_t aggroTower = 0;
        Vector3 towerPos = { 0, 0, 0 };

        for (int i = 0; i < g_CacheCount; ++i) {
            uintptr_t ent = g_CacheEntries[i];
            if (!ent || !mem::hp(ent) || mem::rd<uint8_t>(ent + g_off.m_iTeamNum) == g_LocalTeam) continue;
            char name[64] = { 0 };
            if (!UA::GetEntityDesignerName(ent, name, sizeof(name)) || strstr(name, "tower") == nullptr) continue;

            Vector3 tPos = GetHeroPos(ent);
            float dHero2 = (tPos.x - myPos.x) * (tPos.x - myPos.x) + (tPos.y - myPos.y) * (tPos.y - myPos.y);
            if (dHero2 > 800.0f * 800.0f) continue;

            uint32_t hTgt = mem::rd<uint32_t>(ent + (g_off.m_hTarget ? g_off.m_hTarget : 0x1B58));
            if (hTgt != 0 && hTgt != 0xFFFFFFFF && ResolveHandle(hTgt) == hero) {
                aggroTower = ent;
                towerPos = tPos;
                break;
            }
        }
        if (!aggroTower) return 0;

        uintptr_t bestAllyCreep = 0;
        float bestDist2 = 300.0f * 300.0f;
        for (int i = 0; i < g_CacheCount; ++i) {
            uintptr_t ally = g_CacheEntries[i];
            if (!ally || !mem::hp(ally) || ally == hero) continue;
            if (mem::rd<uint8_t>(ally + g_off.m_iTeamNum) != g_LocalTeam) continue;
            if (mem::rd<int>(ally + g_off.m_iHealth) <= 60) continue;
            char aName[64] = { 0 };
            if (!UA::GetEntityDesignerName(ally, aName, sizeof(aName)) || strstr(aName, "creep") == nullptr) continue;
            Vector3 ap = GetHeroPos(ally);
            float dTower2 = (ap.x - towerPos.x) * (ap.x - towerPos.x) + (ap.y - towerPos.y) * (ap.y - towerPos.y);
            if (dTower2 > 700.0f * 700.0f) continue;

            float dMe2 = (ap.x - myPos.x) * (ap.x - myPos.x) + (ap.y - myPos.y) * (ap.y - myPos.y);
            if (dMe2 < bestDist2) { bestDist2 = dMe2; bestAllyCreep = ally; }
        }
        return bestAllyCreep;
    }

    // ============================================================================
    //  ЧАСТЬ 7 & 8 (БОГ+ УЛЬТРА): КИЛЛСТИЛ И ТИМФАЙТ НА ВСЕ 60 ГЕРОЕВ (POS 1..5)
    // ============================================================================
    static bool IsDisableOrHexAbility(const char* name) {
        if (!name || !*name) return false;
        return strstr(name, "sheepstick") || strstr(name, "abyssal") || strstr(name, "atos") ||
            strstr(name, "gleipnir") || strstr(name, "cyclone") || strstr(name, "stun") ||
            strstr(name, "hex") || strstr(name, "voodoo") || strstr(name, "shackles") ||
            strstr(name, "telekinesis") || strstr(name, "bushwhack") || strstr(name, "impale") ||
            strstr(name, "storm_bolt") || strstr(name, "magic_missile") || strstr(name, "frostbite");
    }

    // Ищет вражеского героя в радиусе каста, которого можно гарантированно добить прямо сейчас (любым героем/предметом)
    static bool TryUniversalKillstealNative(uintptr_t hero, int& outOrder, int& outTargetIdx, int& outAbIdx, Vector3& outPos) {
        if (!hero || !mem::hp(hero)) return false;
        Vector3 myPos = GetHeroPos(hero);
        float myMana = mem::rd<float>(hero + (g_off.m_flMana ? g_off.m_flMana : 0xCFC));

        for (int i = 0; i < g_CacheCount; ++i) {
            uintptr_t enemy = g_CacheEntries[i];
            if (!enemy || !mem::hp(enemy) || enemy == hero) continue;
            if (mem::rd<uint8_t>(enemy + g_off.m_iTeamNum) == g_LocalTeam) continue;
            if (!IsRealHeroByFields(enemy) || !IsEntityVisibleToTeam(enemy)) continue;
            if (mem::rd<uint8_t>(enemy + g_off.m_lifeState) != 0) continue;

            uint64_t eMask = GetNPCStateMask(enemy);
            if (eMask & (1ULL << 10)) continue; // Неуязвимость (Eul / Disruption / Fountain)
            bool isMagicImmune = (eMask & (1ULL << 12)) != 0;

            int eHp = mem::rd<int>(enemy + g_off.m_iHealth);
            float barrier = mem::rd<float>(enemy + (g_off.m_flBarrierAmount ? g_off.m_flBarrierAmount : 0x1A98));
            if (barrier < 0.0f || barrier > 5000.0f) barrier = 0.0f;
            float effHp = (float)eHp + barrier;
            if (effHp <= 0.0f || effHp > 1400.0f) continue;

            Vector3 ePos = GetHeroPos(enemy);
            float dx = ePos.x - myPos.x, dy = ePos.y - myPos.y;
            float dist = std::sqrt(dx * dx + dy * dy);
            if (dist > 1100.0f) continue;

            int enemyIdx = GetEntityIndexFromPtr(enemy);
            if (enemyIdx <= 0) continue;

            // 1. Если враг в радиусе нашей тычки с руки и умирает с 1 удара — мгновенно бьем с руки!
            float atkRange = GetNativeAttackRange(hero) + 65.0f;
            if (dist <= atkRange && !(eMask & (1ULL << 13))) {
                float hitDmg = ComputeExactDamageVsTarget(hero, enemy);
                if (effHp <= hitDmg) {
                    outOrder = 4; outTargetIdx = enemyIdx; outAbIdx = 0; outPos = ePos;
                    return true;
                }
            }

            if (isMagicImmune) continue;
            float magRes = mem::rd<float>(enemy + (g_off.m_flMagicalResistanceValue ? g_off.m_flMagicalResistanceValue : 0x1630));
            if (magRes < -0.5f || magRes > 0.90f) magRes = 0.25f;
            float magMult = 1.0f - magRes;

            // 2. Проверяем Dagon в инвентаре (слоты 0..5)
            for (int s = 0; s <= 5; ++s) {
                uintptr_t it = FindUnitItemBySlot(hero, s);
                char iName[64] = { 0 };
                if (!it || !GetEntityDesignerName(it, iName, sizeof(iName)) || GetEffectiveCooldown(it) > 0.05f) continue;
                if (strstr(iName, "item_dagon") && dist <= 750.0f && myMana >= 120.0f) {
                    int dLvl = ReadAbilityLevelSafe(it);
                    float dDmg = (300.0f + 100.0f * (float)std::max(1, dLvl)) * magMult;
                    if (effHp <= dDmg) {
                        outOrder = 6; outTargetIdx = enemyIdx; outAbIdx = GetEntityIndexFromPtr(it); outPos = ePos;
                        return true;
                    }
                }
            }

            // 3. Проверяем все активные способности героя (слоты 0..5)
            for (int s = 0; s < 6; ++s) {
                uintptr_t ab = GetUnitAbilityBySlot(hero, s);
                if (!ab || !mem::hp(ab)) continue;
                int lvl = ReadAbilityLevelSafe(ab);
                if (lvl <= 0 || GetEffectiveCooldown(ab) > 0.05f) continue;
                int mCost = g_off.m_iManaCost ? mem::rd<int>(ab + g_off.m_iManaCost) : 75;
                if (mCost > 0 && myMana < (float)mCost) continue;

                char aName[96] = { 0 };
                if (!GetEntityDesignerName(ab, aName, sizeof(aName))) continue;
                int abIdx = GetEntityIndexFromPtr(ab);
                if (abIdx <= 0) continue;

                // Спец-формула 1: Anti-Mage Mana Void (урон от недостающей маны врага!)
                if (strcmp(aName, "antimage_mana_void") == 0 && dist <= 620.0f) {
                    float eMana = mem::rd<float>(enemy + (g_off.m_flMana ? g_off.m_flMana : 0xCFC));
                    float eMaxMana = mem::rd<float>(enemy + (g_off.m_flMaxMana ? g_off.m_flMaxMana : 0xD00));
                    float mult = (lvl == 1) ? 0.8f : ((lvl == 2) ? 0.95f : 1.1f);
                    float voidDmg = std::max(0.0f, eMaxMana - eMana) * mult * magMult;
                    if (effHp <= voidDmg) {
                        outOrder = 6; outTargetIdx = enemyIdx; outAbIdx = abIdx; outPos = ePos;
                        return true;
                    }
                }
                // Спец-формула 2: Axe Culling Blade (чистый порог казни сквозь всё!)
                else if (strcmp(aName, "axe_culling_blade") == 0 && dist <= 220.0f) {
                    float cullThresh = (lvl == 1) ? 250.0f : ((lvl == 2) ? 350.0f : 450.0f);
                    if ((float)eHp <= cullThresh) {
                        outOrder = 6; outTargetIdx = enemyIdx; outAbIdx = abIdx; outPos = ePos;
                        return true;
                    }
                }
                // Спец-формула 3: Универсальные таргетные нюки всех ролей
                else if (dist <= 650.0f && (strstr(aName, "assassinate") || strstr(aName, "lightning_bolt") ||
                    strstr(aName, "arc_lightning") || strstr(aName, "laser") || strstr(aName, "fade_bolt") ||
                    strstr(aName, "frost_blast") || strstr(aName, "magic_missile") || strstr(aName, "Brain_sap") ||
                    strstr(aName, "finger_of_death") || strstr(aName, "laguna_blade") || strstr(aName, "ether_shock"))) {
                    float baseNuke = (s == 5) ? (220.0f + 130.0f * lvl) : (70.0f + 65.0f * lvl);
                    float nukeDmg = strstr(aName, "laser") ? baseNuke : (baseNuke * magMult);
                    if (effHp <= nukeDmg) {
                        outOrder = 6; outTargetIdx = enemyIdx; outAbIdx = abIdx; outPos = ePos;
                        return true;
                    }
                }
            }
        }
        return false;
    }

