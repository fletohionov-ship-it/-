    int Tower_GetAttackTarget(lua_State* L) {
        uintptr_t p = checkEnt(L, 1);
        if (!p || !mem::hp(p)) { lua_pushnil(L); return 1; }
        uint32_t h = mem::rd<uint32_t>(p + (g_off.m_hTarget ? g_off.m_hTarget : 0x1B58));
        if (h != 0 && h != 0xFFFFFFFF) {
            uintptr_t target = ResolveHandle(h);
            if (target && mem::hp(target)) {
                pushEntityWithMetatable(L, target);
                return 1;
            }
        }

        // Fallback: if we are in enemy tower range and there are no closer allied creeps -> tower aggroes us!
        if (g_Pawn && mem::hp(g_Pawn) && mem::rd<uint8_t>(p + g_off.m_iTeamNum) != g_LocalTeam) {
            Vector3 tPos = GetHeroPos(p);
            Vector3 hPos = GetHeroPos(g_Pawn);
            float dHero2 = (tPos.x - hPos.x) * (tPos.x - hPos.x) + (tPos.y - hPos.y) * (tPos.y - hPos.y);
            if (dHero2 <= 820.0f * 820.0f) {
                bool allyCloser = false;
                for (int i = 0; i < g_CacheCount; ++i) {
                    uintptr_t ent = g_CacheEntries[i];
                    if (!ent || !mem::hp(ent) || ent == g_Pawn) continue;
                    if (mem::rd<uint8_t>(ent + g_off.m_iTeamNum) != g_LocalTeam) continue;
                    if (mem::rd<int>(ent + g_off.m_iHealth) <= 0) continue;
                    Vector3 cPos = GetHeroPos(ent);
                    float dCreep2 = (tPos.x - cPos.x) * (tPos.x - cPos.x) + (tPos.y - cPos.y) * (tPos.y - cPos.y);
                    if (dCreep2 + 50.0f * 50.0f < dHero2 && dCreep2 <= 750.0f * 750.0f) {
                        allyCloser = true;
                        break;
                    }
                }

                if (!allyCloser) {
                    pushEntityWithMetatable(L, g_Pawn);
                    return 1;
                }
            }
        }

        lua_pushnil(L);
        return 1;
    }

