    int AB_IsCastable(lua_State* L) {
        uintptr_t a = checkEnt(L, 1);
        if (!IsAbilityReadyInternal(L, a)) { lua_pushboolean(L, false); return 1; }
        float realMana = g_Pawn ? mem::rd<float>(g_Pawn + (g_off.m_flMana ? g_off.m_flMana : 0xCFC)) : 100.0f;
        float maxMana = g_Pawn ? mem::rd<float>(g_Pawn + (g_off.m_flMaxMana ? g_off.m_flMaxMana : 0xD00)) : 500.0f;
        float myMana = realMana;
        if (lua_isnumber(L, 2)) {
            float argMana = (float)lua_tonumber(L, 2);
            if (argMana > 0.0f && argMana <= 1.0f && maxMana > 1.0f) myMana = argMana * maxMana;
            else if (argMana > 1.0f) myMana = argMana;
        }

        int cost = 0;
        if (PushAbilityKVRecord(L, a)) {
            lua_getfield(L, -1, "AbilityManaCost");
            if (lua_isnumber(L, -1)) cost = (int)lua_tointeger(L, -1);
            else if (lua_isstring(L, -1)) cost = (int)ParseLevelNumberFromStr(lua_tostring(L, -1), ReadAbilityLevelSafe(a));
            lua_pop(L, 2);
        }

        lua_pushboolean(L, myMana >= (float)cost);
        return 1;
    }

