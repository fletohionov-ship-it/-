static int L_EntityIndexHandler(lua_State* L) {
    __try {
        if (!lua_isstring(L, 2) && !lua_isnumber(L, 2)) {
            lua_pushnil(L);
            return 1;
        }

        const char* key = lua_tostring(L, 2);
        if (!key) { lua_pushnil(L); return 1; }
        strncpy_s(g_lastEntityKeyGlobal, sizeof(g_lastEntityKeyGlobal), key, sizeof(g_lastEntityKeyGlobal) - 1);
        g_lastEntityKeyGlobal[sizeof(g_lastEntityKeyGlobal) - 1] = '\0';
        if (strcmp(key, "pos") == 0 || strcmp(key, "absOrigin") == 0 || strcmp(key, "origin") == 0) {
            lua_getfield(L, 1, "__ptr");
            uintptr_t p = 0;
            if (lua_islightuserdata(L, -1)) p = (uintptr_t)lua_touserdata(L, -1);
            lua_pop(L, 1);
            if (p && mem::hp(p)) {
                Vector3 v = GetHeroPos(p);
                pushVec(L, v.x, v.y, v.z);
            }

            else {
                pushVec(L, 0.0f, 0.0f, 0.0f);
            }

            return 1;
        }

        if (strcmp(key, "aoe_radiuses") == 0) {
            lua_newtable(L);
            return 1;
        }

        lua_getglobal(L, "NPC");
        if (lua_istable(L, -1)) {
            lua_getfield(L, -1, key);
            if (!lua_isnil(L, -1)) {
                lua_remove(L, -2);
                return 1;
            }

            lua_pop(L, 1);
        }

        lua_pop(L, 1);
        if (strncmp(key, "Is", 2) == 0) { lua_pushcfunction(L, L_Fallback_ReturnFalse); return 1; }
        lua_pushnil(L);
        return 1;
    }

    __except (EXCEPTION_EXECUTE_HANDLER) {
        lua_pushnil(L);
        return 1;
    }
}

static int L_Fallback_ReturnNil2(lua_State* L) { lua_pushnil(L); return 1; }
static int L_EntityListIndexHandler(lua_State* L) {
    const char* key = lua_tostring(L, 2);
    if (key && (strcmp(key, "IsInGame") == 0 || strcmp(key, "IsInGame") == 0)) {
        lua_pushboolean(L, 1);
        return 1;
    }

    if (key && (strcmp(key, "GetHighestIndex") == 0)) {
        lua_pushinteger(L, 4096);
