static uintptr_t GetGameRulesPtr(uintptr_t* outProxy = nullptr) {
    if (outProxy) *outProxy = 0;
    if (!g_EntityList) return 0;
    static uint64_t lastScan = 0;
    static uint64_t generation = 0;
    static uintptr_t cachedProxy = 0;
    static int cachedIndex = -1;
    if (generation != g_entityListGeneration) {
        generation = g_entityListGeneration;
        lastScan = 0;
        cachedProxy = 0;
        cachedIndex = -1;
    }
    if (cachedProxy && GetEntity(cachedIndex) == cachedProxy) {
        if (outProxy) *outProxy = cachedProxy;
        if (const uintptr_t rules = GetGameRulesFromProxy(cachedProxy)) return rules;
    }

    const uint64_t now = GetTickCount64();
    if (lastScan && now - lastScan < 500) return 0;
    lastScan = now;
    for (int chunkIndex = 0; chunkIndex < 32; ++chunkIndex) {
        if (!GetEntityChunk(chunkIndex)) continue;
        for (int slot = 0; slot <= CHUNK_MASK; ++slot) {
            const int index = (chunkIndex << CHUNK_SHIFT) | slot;
            const uintptr_t entity = GetEntity(index);
            if (!entity || !IsGameRulesProxy(entity)) continue;
            if (outProxy) *outProxy = entity;
            if (const uintptr_t rules = GetGameRulesFromProxy(entity)) {
                cachedProxy = entity;
                cachedIndex = index;
                return rules;
            }
        }
    }
    return 0;
}

