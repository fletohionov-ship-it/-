    int NPC_GetOrderQueue(lua_State* L) {
        uintptr_t p = checkEnt(L, 1);
        lua_newtable(L);
        if (!p || !mem::hp(p)) return 1;
        uintptr_t ctrl = 0;
        if (p == g_Pawn) ctrl = g_LocalController;
        else {
            for (int i = 0; i < 32; ++i) {
                uintptr_t c = mem::rd<uintptr_t>(g_client + dwControllerArray + i * 8);
                if (!c || !mem::hp(c)) continue;
                uint32_t h = mem::rd<uint32_t>(c + g_off.m_hAssignedHero);
                if (h == 0 || h == 0xFFFFFFFF) continue;
                uintptr_t hero = ResolveHandle(h);
                if (hero == p) { ctrl = c; break; }
            }
        }

        if (!ctrl || !mem::hp(ctrl)) return 1;
        uintptr_t qb = ctrl + 0x9A0;
        int count = mem::rd<int>(qb + 0x0);
        uintptr_t dataPtr = mem::rd<uintptr_t>(qb + 0x8);
        if (count <= 0 || count > 32 || !dataPtr || !mem::hp(dataPtr)) return 1;
        const int ORDER_SIZE = 0x40;
        for (int i = 0; i < count; ++i) {
            uintptr_t e = dataPtr + (uintptr_t)i * ORDER_SIZE;
            if (!mem::hp(e)) break;
            lua_newtable(L);
            lua_pushinteger(L, mem::rd<int32_t>(e + 0x00)); lua_setfield(L, -2, "order_type");
            lua_pushinteger(L, mem::rd<int32_t>(e + 0x04)); lua_setfield(L, -2, "target_index");
            lua_pushinteger(L, mem::rd<int32_t>(e + 0x24)); lua_setfield(L, -2, "ability_index");
            lua_pushinteger(L, mem::rd<int32_t>(e + 0x3C)); lua_setfield(L, -2, "unit_index");
            lua_rawseti(L, -2, i + 1);
        }

        return 1;
    }

