#define SDK_RING_SIZE 32
struct SdkRingEntry {
    volatile LONG seq;
    char tag[24];
    char msg[160];
};
static SdkRingEntry g_sdkRing[SDK_RING_SIZE];
static volatile LONG g_sdkRingSeq = 0;
static void SdkRingPush(const char* tag, const char* fmt, ...) {
    LONG idx = InterlockedIncrement(&g_sdkRingSeq) - 1;
    SdkRingEntry* e = &g_sdkRing[idx % SDK_RING_SIZE];
    e->seq = idx + 1;
    e->tag[0] = '\0';
    strncpy_s(e->tag, tag ? tag : "?", _TRUNCATE);
    e->tag[sizeof(e->tag) - 1] = '\0';
    va_list ap; va_start(ap, fmt);
    vsnprintf_s(e->msg, sizeof(e->msg), _TRUNCATE, fmt, ap);
    va_end(ap);
}

static void SdkRingDump(FILE* f) {
    if (!f) return;
    fprintf(f, "----- SDK RING (last %d events) -----\n", SDK_RING_SIZE);
    LONG head = InterlockedCompareExchange(&g_sdkRingSeq, 0, 0);
    LONG start = head > SDK_RING_SIZE ? head - SDK_RING_SIZE : 0;
    for (LONG i = start; i < head; ++i) {
        SdkRingEntry* e = &g_sdkRing[i % SDK_RING_SIZE];
        if (e->seq != i + 1) continue;
        fprintf(f, " [%05ld] %-16s %s\n", (long)(i + 1), e->tag, e->msg);
    }

    fprintf(f, "----- END RING -----\n");
}

