        uintptr_t mgr = p + (g_off.m_ModifierManager ? g_off.m_ModifierManager : 0xE30);
        int count = mem::rd<int>(mgr + 0x10);
        uintptr_t list = mem::rd<uintptr_t>(mgr + 0x18);
        if (count <= 0 || count > 128 || !list || !mem::hp(list)) { lua_pushnil(L); return 1; }
        for (int i = 0; i < count; ++i) {
            uintptr_t mod = mem::rd<uintptr_t>(list + i * 8);
            if (!mod || !mem::hp(mod)) continue;
            char nameBuf[128];
            if (UA::SafeReadModifierName(mod, nameBuf, sizeof(nameBuf))) {
                if (strcmp(nameBuf, want) == 0) {
                    lua_pushlightuserdata(L, (void*)mod);
                    return 1;
                }
            }
        }

        lua_pushnil(L);
        return 1;
    }

    int NPC_GetModifiers(lua_State* L) {
        uintptr_t p = checkEnt(L, 1);
        if (!p || !mem::hp(p)) { lua_newtable(L); return 1; }
        uintptr_t mgr = p + (g_off.m_ModifierManager ? g_off.m_ModifierManager : 0xE30);
        int count = mem::rd<int>(mgr + 0x10);
        uintptr_t list = mem::rd<uintptr_t>(mgr + 0x18);
        if (count <= 0 || count > 128 || !list || !mem::hp(list)) { lua_newtable(L); return 1; }
        lua_newtable(L);
        int idx = 1;
        for (int i = 0; i < count; ++i) {
            uintptr_t mod = mem::rd<uintptr_t>(list + i * 8);
            if (!mod || !mem::hp(mod)) continue;
            lua_pushlightuserdata(L, (void*)mod);
            lua_rawseti(L, -2, idx++);
        }

        return 1;
    }

    uintptr_t GetUnitAbilityBySlot(uintptr_t p, int idx) {
        if (!p || !mem::hp(p) || idx < 0 || idx > 31) return 0;
        int size = mem::rd<int>(p + 0xD28);
        uintptr_t ptr = mem::rd<uintptr_t>(p + 0xD28 + 8);
        if (ptr && mem::hp(ptr) && size > 0 && size <= 64 && idx < size) {
            uint32_t h = mem::rd<uint32_t>(ptr + 4 * idx);
            uintptr_t ab = ResolveHandle(h);
            if (ab && mem::hp(ab)) return ab;
        }

        return 0;
    }

