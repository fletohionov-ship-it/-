                                int hp = mem::rd<int>(e + g_off.m_iHealth);
                                int team = (int)mem::rd<uint8_t>(e + g_off.m_iTeamNum);
                                int lvl = mem::rd<int>(e + g_off.m_iCurrentLevel);
                                int hero = (int)mem::rd<uint8_t>(e + g_off.m_bConsideredHero);
                                CrashLog("[DUMP D]   sample[%d]: hp=%d team=%d lvl=%d hero=%d\n", s, hp, team, lvl, hero);
                            }
                        }

                        // Quality check: at least 2 of first 3 samples must have hp > 100, team in {2,3}, lvl > 0
                        int qualityScore = 0;
                        for (int s = 0; s < sampleIdx; s++) {
                            uintptr_t e = sampleEnts[s];
                            if (e && mem::hp(e)) {
                                int hp = mem::rd<int>(e + g_off.m_iHealth);
                                int team = (int)mem::rd<uint8_t>(e + g_off.m_iTeamNum);
                                int lvl = mem::rd<int>(e + g_off.m_iCurrentLevel);
                                if (hp > 100 && (team == 2 || team == 3) && lvl > 0) {
                                    qualityScore++;
                                }
                            }
                        }

                        if (qualityScore >= 2 && qualityScore > bestQuality) {
                            bestQuality = qualityScore;
                            bestChunksBase = chunksBaseCandidates[cb];
                            bestEntrySize = entrySizeCandidates[es];
                            bestChunkShift = chunkShiftCandidates[cs];
                            CrashLog("[DUMP D] NEW BEST-QUALITY: base=0x%X size=0x%X shift=%d quality=%d\n",
                                bestChunksBase, bestEntrySize, bestChunkShift, bestQuality);
                        }
                    }
                }
            }
        }

        CrashLog("[DUMP D] BEST-QUALITY: base=0x%X size=0x%X shift=%d quality=%d\n",
            bestChunksBase, bestEntrySize, bestChunkShift, bestQuality);
        if (bestQuality == 0) {
            CrashLog("[DUMP D] no quality combination found � check dwEntityList RVA\n");
        }

        else {
            // Fix 4: Apply the winner to g_off in-place
            g_off.chunksBase = bestChunksBase;
            g_off.chunkShift = bestChunkShift;
            g_off.entrySize = bestEntrySize;
            CrashLog("[DUMP D] APPLIED: base=0x%X size=0x%X shift=%d\n",
                bestChunksBase, bestEntrySize, bestChunkShift);
        }

#endif
#if 0
        CrashLog("[DUMP H] blind hero candidate scan:\n");
        for (int i = 1; i <= 5000; ++i) {
            uintptr_t e = GetEntity(i);
            if (!e) continue;
            uint8_t bCA7 = mem::rd<uint8_t>(e + 0xCA7);
            uint8_t bD24 = mem::rd<uint8_t>(e + 0xD24);
            int hp34C = mem::rd<int>(e + 0x34C);
            if (hp34C > 0 && hp34C < 100000 && (bCA7 == 1 || bD24 == 0)) {
                CrashLog("[DUMP H] candidate E[%d]=0x%llX hp=%d bCA7=%d bD24=%d\n",
                    i, (unsigned long long)e, hp34C, (int)bCA7, (int)bD24);
            }
        }

        CrashLog("[DUMP H] blind scan done\n");
#endif
    }

    __except (EXCEPTION_EXECUTE_HANDLER) {
        CrashLog("[DUMP] SEH inside ProbeEntityList, aborted\n");
    }
}

static uintptr_t FindPrepareUnitOrdersRaw(uintptr_t base, size_t size) {
    if (!base || size < 0x40) return 0;
    // Signature: first 18 bytes of PrepareUnitOrdersRaw prologue.
    // 4C 89 4C 24 20 mov [rsp+20], r9
    // 44 89 44 24 18 mov [rsp+18], r8d
    // 89 54 24 10 mov [rsp+10], edx
    // 48 89 4C 24 08 mov [rsp+08], rcx
    static const uint8_t sig[] = {
        0x4C, 0x89, 0x4C, 0x24, 0x20,
        0x44, 0x89, 0x44, 0x24, 0x18,
        0x89, 0x54, 0x24, 0x10,
        0x48, 0x89, 0x4C, 0x24, 0x08
    };
    const size_t sigLen = sizeof(sig);
    // The byte right after the sig must be 0x55 (push rbp).
    __try {
        uint8_t* p = (uint8_t*)base;
        uint8_t* end = p + size - sigLen - 1;
        for (; p < end; ++p) {
            if (p[0] != 0x4C) continue;
            if (memcmp(p, sig, sigLen) == 0) {
                if (p[sigLen] == 0x55) { // push rbp
                    return (uintptr_t)p;
                }
            }
        }
    }

    __except (EXCEPTION_EXECUTE_HANDLER) {
        return 0;
    }

    return 0;
}

DWORD WINAPI MainThread(LPVOID) {
    CrashLogInit();
    wchar_t loadedDllPath[MAX_PATH] = { 0 };
    GetModuleFileNameW(g_hMod, loadedDllPath, MAX_PATH);
    wchar_t* loadedSlash = wcsrchr(loadedDllPath, L'\\');
    if (loadedSlash) loadedSlash[1] = L'\0';
    CrashLog("[BOOT] Loaded DLL directory: %ls\n", loadedDllPath);
    // if (!InitConsole()) return 0; // Console disabled - using GUI now
    g_prevFilter = SetUnhandledExceptionFilter(CrashHandler);
    g_vehHandle = AddVectoredExceptionHandler(1, VectoredHandler);
    CrashLog("[+] DLL injected (v67.3)\n");
    g_client = mem::base("client.dll");
    while (!g_client) { Sleep(500); g_client = mem::base("client.dll"); }
    g_injectTick = GetTickCount64();
    CrashLog("[BOOT] client.dll=0x%llX\n", (unsigned long long)g_client);
    {
        HMODULE hClient = (HMODULE)g_client;
        MODULEINFO mi{};
        if (hClient && GetModuleInformation(GetCurrentProcess(), hClient, &mi, sizeof(mi))) {
            g_PrepareFnAddr = FindPrepareUnitOrdersRaw((uintptr_t)mi.lpBaseOfDll, mi.SizeOfImage);
        }

        const uintptr_t resolvedPrepareRva = (g_PrepareFnAddr && g_client && g_PrepareFnAddr >= g_client)
            ? (g_PrepareFnAddr - g_client) : 0;
        CrashLog("[SIG] PrepareUnitOrdersRaw = 0x%llX (resolved RVA=0x%llX; signature-driven)\n",
            (unsigned long long)g_PrepareFnAddr,
            (unsigned long long)resolvedPrepareRva);
        if (g_PrepareFnAddr == 0) {
            CrashLog("[SIG] FAILED to locate PrepareUnitOrdersRaw — orders will not work\n");
        }
    }

    g_engine2 = mem::base("engine2.dll");
    Sleep(300);
    uintptr_t serverBase = mem::base("server.dll");
    if (serverBase) {
        g_pEntitySystem = serverBase + 0x4CFACE0;
        CrashLog("[BOOT] server.dll=0x%llX, g_pEntitySystem=0x%llX\n", (unsigned long long)serverBase, (unsigned long long)g_pEntitySystem);
    }

    if (!LoadOffsets()) { CrashLog("[!] Cannot load offsets\n"); Sleep(4000); }
    g_off.chunksBase = CHUNKS_BASE;
    g_off.chunkShift = CHUNK_SHIFT;
    g_off.entrySize = ENTRY_SIZE;
    g_off.m_iTeamNum = 0x3E7;
    g_liveTeamOffset = 0x3E7;
    LoadHeroVtables();
    RefreshEntityList(GetTickCount64());
    CrashLog("[BOOT] validated EntityList=0x%llX\n", (unsigned long long)g_EntityList);
    CrashLog("[BOOT] before dwLocalPlayerController retry\n");
    // Retry dwLocalPlayerController until pid at +0x910 is valid [0, 24)
    uintptr_t localCtrl = 0;
    __try {
        uintptr_t slot = mem::rd<uintptr_t>(g_client + dwLocalPlayerController);
        if (slot && mem::hp(slot)) {
            __try {
                int pid = *(int*)(slot + g_off.m_nPlayerID);
                if (pid >= 0 && pid < 24) {
                    localCtrl = slot;
                    CrashLog("[RETRY] dwLocalPlayerController OK: slot=0x%llX pid=%d\n",
                        (unsigned long long)slot, pid);
                }
            }

            __except (EXCEPTION_EXECUTE_HANDLER) {}
        }
    }

    __except (EXCEPTION_EXECUTE_HANDLER) {
        CrashLog("[RETRY] dwLocalPlayerController SEH, aborting\n");
        localCtrl = 0;
    }

    // If no valid pointer, leave it 0 and continue
    if (localCtrl && mem::hp(localCtrl)) {
        g_off.m_hController = dwLocalPlayerController;
        SaveOffsets();
    }

    CrashLog("[BOOT] after controller retry\n");
    CrashLog("[BOOT] before AutoDetectHero retry\n");
    AutoDetectHero(); // Just try once, CallAllTickCallbacks will keep trying later
    CrashLog("[BOOT] after AutoDetectHero retry, g_Pawn=0x%llX\n", (unsigned long long)g_Pawn);
    // --- SCHEMA SYSTEM WARM-UP ---
    // Now that g_Pawn is valid, the game has loaded client.dll type scopes.
    // We can safely query the SchemaSystem to get the true offsets.
    if (g_Pawn != 0) {
        CrashLog("[BOOT] Hero found, re-loading offsets via SchemaSystem...\n");
        LoadOffsets(); // This will now successfully resolve schema offsets!
    }

    {
        uintptr_t gv = g_client + dwGlobalVars;
        float curTime = gv ? mem::rd<float>(gv + GV_CURTIME) : 0.0f;
        CrashLog("[TIME] dwGlobalVars=0x%llX m_flCurTime=%.2f\n",
            (unsigned long long)gv, curTime);
    }

    CrashLog("[BOOT] before ProbeEntityList\n");
    // One-shot diagnostic dump at startup
    if (!g_EntityList || !IsRealHeapPtr(g_EntityList)) {
        CrashLog("[DUMP] skipped, entity list unresolved\n");
    }

    else {
        ProbeEntityList();
    }

    CrashLog("[BOOT] after ProbeEntityList\n");
    DumpFirstChunk();
    CrashLog("[BOT] Hero: E[%d]\n", g_PawnIndex);
    Sleep(1500);
    system("cls");
    CrashLog("[BOOT] before InitBot\n");
    InitBot();
    CrashLog("[BOOT] after InitBot\n");
    uint64_t lastLogFlush = GetTickCount64();
    while (g_running) {
        if (GetAsyncKeyState(VK_END)) { g_running = false; break; }
        if (g_crashLog && StepTraceDue(GetTickCount64(), lastLogFlush)) fflush(g_crashLog);
        Sleep(200);
    }
    g_shuttingDown = true;
    UninstallPresentHook();
    UninstallWndProcHook();
    while (g_activeWindowCallbacks.load() != 0) Sleep(1);
    ShutdownPresentOverlay();
    if (g_L) {
        lua_close(g_L);
        g_L = nullptr;
    }

    // Safely release VEH handles
    if (g_vehHandle) {
        RemoveVectoredExceptionHandler(g_vehHandle);
        g_vehHandle = nullptr;
    }

    SetUnhandledExceptionFilter(g_prevFilter);
    CleanupConsole();

    FreeLibraryAndExitThread(g_hMod, 0);
    return 0;
}

BOOL WINAPI DllMain(HINSTANCE h, DWORD reason, LPVOID) {
    if (reason == DLL_PROCESS_ATTACH) {
        HANDLE hFile = CreateFileA("C:\\dota2sdk_debug.txt", GENERIC_WRITE, 0, NULL, CREATE_ALWAYS, FILE_ATTRIBUTE_NORMAL, NULL);
        if (hFile != INVALID_HANDLE_VALUE) {
            const char* msg = "DLL_PROCESS_ATTACH reached!\n";
            DWORD written;
            WriteFile(hFile, msg, (DWORD)strlen(msg), &written, NULL);
            CloseHandle(hFile);
        }
    }

    if (reason == DLL_PROCESS_ATTACH) {
        DisableThreadLibraryCalls(h);
        g_hMod = h;
        HANDLE hThread = CreateThread(nullptr, 0, MainThread, h, 0, nullptr);
        if (hThread) CloseHandle(hThread);
    }

    return TRUE;
}
