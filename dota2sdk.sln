static bool DirectPickHero(const char* heroName, int heroId) {
    if (!heroName || !*heroName) return false;
    g_targetPickHeroId = heroId;
    g_flagPickHero = true;
    // 1. Снимаем ограничение на сложных героев
    ExecuteEngineConsoleCmd("dota_new_player false");
    // 2. Пикаем героя через движок (слот 51 ExecuteClientCmd)
    char cmd[128];
    snprintf(cmd, sizeof(cmd), "dota_select_hero %s", heroName);
    if (!ExecuteEngineConsoleCmd(cmd)) {
        g_flagPickHero = false;
        return false;
    }
    // Больше никаких EventPickHeroID (0x31B8210) и вызовов Панорамы.
    // Они крашат tier0.dll корутины, когда игра переходит в GameState 3.
    CrashLog("[AUTO-PICK] Triggered ExecuteClientCmd pick for %s (ID: %d)\n", heroName, heroId);
    return true;
}

static void DrawSanctuaryGothicSeal(ImDrawList* dl, ImVec2 center, float radius, float time) {
    const ImU32 colDim = IM_COL32(55, 55, 62, 180);
    const ImU32 colMid = IM_COL32(120, 120, 130, 200);
    const ImU32 colBright = IM_COL32(240, 240, 240, 230);
    const float pulse = 0.55f + 0.45f * sinf(time * 3.2f);
    const ImU32 colBlood = IM_COL32(216, 0, 26, (int)(160 + 95 * pulse));
    const ImU32 colGlow = IM_COL32(255, 26, 53, (int)(70 * pulse));
    dl->AddCircle(center, radius * 1.04f, colGlow, 36, 2.5f);
    dl->AddCircle(center, radius * 0.95f, colDim, 32, 1.0f);
    dl->AddCircle(center, radius * 0.78f, colMid, 24, 1.2f);
    ImVec2 starPts[5];
    float rotSlow = time * 0.45f;
    for (int i = 0; i < 5; ++i) {
        float ang = rotSlow - 1.570796f + i * (6.2831853f / 5.0f);
        starPts[i] = ImVec2(center.x + cosf(ang) * (radius * 0.82f), center.y + sinf(ang) * (radius * 0.82f));
    }

    const int order[6] = { 0, 2, 4, 1, 3, 0 };
    for (int i = 0; i < 5; ++i) {
        dl->AddLine(starPts[order[i]], starPts[order[i + 1]], colBlood, 1.35f);
    }

    dl->AddCircle(center, radius * 0.30f, colDim, 16, 1.0f);
    float cLen = radius * 0.38f;
    dl->AddLine(ImVec2(center.x - cLen, center.y), ImVec2(center.x + cLen, center.y), colBright, 1.8f);
    dl->AddLine(ImVec2(center.x, center.y - cLen), ImVec2(center.x, center.y + cLen), colBright, 1.8f);
}

static void DrawSanctuaryCardFrame(ImDrawList* dl, ImVec2 pMin, ImVec2 pMax, bool highlightTop = true) {
    const ImU32 colBorder = IM_COL32(255, 255, 255, 22);
    const ImU32 colBlood = IM_COL32(216, 0, 26, 235);
    const ImU32 colCross = IM_COL32(240, 240, 240, 130);
    dl->AddRect(pMin, pMax, colBorder, 0.0f, 0, 1.0f);
    if (highlightTop) {
        float w = pMax.x - pMin.x;
        dl->AddLine(ImVec2(pMin.x + w * 0.12f, pMin.y), ImVec2(pMax.x - w * 0.12f, pMin.y), colBlood, 1.5f);
    }

    const float cl = 9.0f;
    dl->AddLine(ImVec2(pMin.x + 6, pMin.y + 6), ImVec2(pMin.x + 6 + cl, pMin.y + 6), colCross, 1.2f);
    dl->AddLine(ImVec2(pMin.x + 6, pMin.y + 6), ImVec2(pMin.x + 6, pMin.y + 6 + cl), colCross, 1.2f);
    dl->AddLine(ImVec2(pMax.x - 6 - cl, pMax.y - 6), ImVec2(pMax.x - 6, pMax.y - 6), colBlood, 1.2f);
    dl->AddLine(ImVec2(pMax.x - 6, pMax.y - 6 - cl), ImVec2(pMax.x - 6, pMax.y - 6), colBlood, 1.2f);
}

