static int SafeLuaFnWrapper(lua_State* L) {
    const char* name = lua_tostring(L, lua_upvalueindex(1));
    lua_CFunction realFn = (lua_CFunction)lua_touserdata(L, lua_upvalueindex(2));
    __try {
        return realFn(L);
    }

    __except (EXCEPTION_EXECUTE_HANDLER) {
        CrashLog("[SAFEFN-CRASH] SEH inside Lua function '%s'! LastEntityKey='%s'\n", name ? name : "?", GetLastEntityKeyForLog());
        lua_settop(L, 0);
        lua_pushnil(L);
        return 1;
    }
}

static void reg_module(lua_State* L, const luaL_Reg* regs) {
    for (; regs->name != nullptr; regs++) {
        lua_pushstring(L, regs->name);
        lua_pushlightuserdata(L, (void*)regs->func);
        lua_pushcclosure(L, SafeLuaFnWrapper, 2);
        lua_setfield(L, -2, regs->name);
    }
}

static void AttachEnumZeroFallback(lua_State* L) {
    lua_newtable(L);
    lua_pushcfunction(L, L_Fallback_ReturnZero);
    lua_setfield(L, -2, "__index");
    lua_setmetatable(L, -2);
}

