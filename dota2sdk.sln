    static float ComputeUnitAttackSpeedSafe(uintptr_t p);
    static float ComputeAttacksPerSecondSafe(uintptr_t p);

    static int EstimateUnitBaseDamage(uintptr_t p) {
        if (!p || !mem::hp(p)) return 0;
        int mn = mem::rd<int>(p + g_off.m_iDamageMin);
        int mx = mem::rd<int>(p + g_off.m_iDamageMax);
        int bonus = mem::rd<int>(p + g_off.m_iDamageBonus);
        if (bonus < -500 || bonus > 5000) bonus = 0;
        int quellingBonus = 0;
        if (p == g_Pawn) {
            bool isRanged = IsUnitRangedSafe(p);
            for (int s = 0; s < g_PawnItemCount; ++s) {
                char iname[128] = { 0 };
                if (g_PawnItems[s] && GetEntityDesignerName(g_PawnItems[s], iname, sizeof(iname))) {
                    if (strcmp(iname, "item_bfury") == 0) { quellingBonus = isRanged ? 6 : 15; break; }
                    if (strcmp(iname, "item_quelling_blade") == 0) { quellingBonus = isRanged ? 4 : 8; }
                }
            }
        }

        if (mn > 5 && mn < 1500 && mx >= mn && mx < 2000) {
            int baseDmg = mn + 1;
            if (IsRealHeroByFields(p) && baseDmg < 45) {
                int primary = g_off.m_iPrimaryAttribute ? mem::rd<int>(p + g_off.m_iPrimaryAttribute) : mem::rd<int>(p + 0x1B8C);
                float str = mem::rd<float>(p + (g_off.m_flStrengthTotal ? g_off.m_flStrengthTotal : 0x1AEC));
                float agi = mem::rd<float>(p + (g_off.m_flAgilityTotal ? g_off.m_flAgilityTotal : 0x1AF0));
                float intel = mem::rd<float>(p + (g_off.m_flIntellectTotal ? g_off.m_flIntellectTotal : 0x1AF4));
                float attrDmg = (primary == 0) ? str : ((primary == 1) ? agi : ((primary == 2) ? intel : (str + agi + intel) * 0.7f));
                if (attrDmg > 0.0f && attrDmg < 1000.0f) baseDmg += (int)attrDmg;
            }
            return baseDmg + bonus + quellingBonus;
        }

        uint32_t ut = mem::rd<uint32_t>(p + g_off.m_iUnitType);
        if ((ut & 1) != 0) {
            int lvl = mem::rd<int>(p + g_off.m_iCurrentLevel);
            if (lvl < 1 || lvl > 30) lvl = 1;
            return 52 + lvl * 4 + bonus + quellingBonus;
        }
        if ((ut & 0x14) == 0x14) return 110;
        char buf[128] = { 0 };
        if (GetEntityDesignerName(p, buf, sizeof(buf))) {
            if (strstr(buf, "ranged")) return 24;
            if (strstr(buf, "siege")) return 40;
        }
        return 21;
    }

    // GOD+ LASTHIT CALCULATOR: точный урон одного нашего удара по конкретной цели (с учетом брони 7.41 и правил Quelling Blade)
    static float ComputeExactDamageVsTarget(uintptr_t attacker, uintptr_t target) {
        if (!attacker || !mem::hp(attacker) || !target || !mem::hp(target)) return 0.0f;
        int mn = mem::rd<int>(attacker + g_off.m_iDamageMin);
        int mx = mem::rd<int>(attacker + g_off.m_iDamageMax);
        int bonus = mem::rd<int>(attacker + g_off.m_iDamageBonus);
        if (bonus < -500 || bonus > 5000) bonus = 0;

        float rawBase = (mn > 5 && mn < 1500 && mx >= mn) ? (float)mn : 54.0f;
        if (IsRealHeroByFields(attacker) && rawBase < 45.0f) {
            int primary = g_off.m_iPrimaryAttribute ? mem::rd<int>(attacker + g_off.m_iPrimaryAttribute) : mem::rd<int>(attacker + 0x1B8C);
            float str = mem::rd<float>(attacker + (g_off.m_flStrengthTotal ? g_off.m_flStrengthTotal : 0x1AEC));
            float agi = mem::rd<float>(attacker + (g_off.m_flAgilityTotal ? g_off.m_flAgilityTotal : 0x1AF0));
            float intel = mem::rd<float>(attacker + (g_off.m_flIntellectTotal ? g_off.m_flIntellectTotal : 0x1AF4));
            float attrDmg = (primary == 0) ? str : ((primary == 1) ? agi : ((primary == 2) ? intel : (str + agi + intel) * 0.7f));
            if (attrDmg > 0.0f && attrDmg < 1000.0f) rawBase += attrDmg;
        }

        uint8_t atkTeam = mem::rd<uint8_t>(attacker + g_off.m_iTeamNum);
        uint8_t tgtTeam = mem::rd<uint8_t>(target + g_off.m_iTeamNum);
        char tgtName[128] = { 0 };
        GetEntityDesignerName(target, tgtName, sizeof(tgtName));
        bool isCreep = (strstr(tgtName, "creep") != nullptr || strstr(tgtName, "neutral") != nullptr);
        bool isEnemyCreep = (isCreep && tgtTeam != atkTeam);

        // В Доте 2 Quelling Blade / Battle Fury дает бонус (+8/+15 мили) ТОЛЬКО по ВРАЖЕСКИМ крипам (при денае бонуса нет!)
        float quellingBonus = 0.0f;
        if (attacker == g_Pawn && isEnemyCreep) {
            bool isRanged = IsUnitRangedSafe(attacker);
            for (int s = 0; s < g_PawnItemCount; ++s) {
                char iname[128] = { 0 };
                if (g_PawnItems[s] && GetEntityDesignerName(g_PawnItems[s], iname, sizeof(iname))) {
                    if (strcmp(iname, "item_bfury") == 0) { quellingBonus = isRanged ? 6.0f : 15.0f; break; }
                    if (strcmp(iname, "item_quelling_blade") == 0) { quellingBonus = isRanged ? 4.0f : 8.0f; }
                }
            }
        }

        float totalRaw = rawBase + (float)bonus + quellingBonus;

        // Точный множитель физической брони патча 7.41: 1 - (0.06 * armor) / (1 + 0.06 * |armor|)
        float armor = isCreep ? ReadBasePhysicalArmor(target) : GetPhysicalArmor(target);
        if (!std::isfinite(armor) || armor < -40.0f || armor > 150.0f) {
            if (strstr(tgtName, "melee") || strstr(tgtName, "goodguys_melee") || strstr(tgtName, "badguys_melee")) armor = 2.0f;
            else armor = 0.0f;
        }
        float armorMult = 1.0f - (0.06f * armor) / (1.0f + 0.06f * std::fabs(armor));

        // У осадных крипов (катапульт) 50% сопротивление атакам героев
        if (strstr(tgtName, "siege") != nullptr) armorMult *= 0.50f;

        return totalRaw * armorMult;
    }

    // ============================================================================
    //  ЧАСТЬ 3 (БОГ+): ТОЧНЫЕ ТАЙМИНГИ ЗАМАХА (WINDUP) И ПЕРЕЗАРЯДКИ (RELOAD)
    // ============================================================================
    static uint64_t ComputeExactWindupMs(uintptr_t unit) {
        if (!unit || !mem::hp(unit)) return 260ULL;
        uintptr_t apOff = g_off.m_flAttackAnimationPoint ? g_off.m_flAttackAnimationPoint : 0xCF0;
        float baseAp = mem::rd<float>(unit + apOff);
        if (baseAp < 0.05f || baseAp > 1.20f) {
            int heroId = mem::rd<int>(unit + g_off.m_iHeroID);
            baseAp = (heroId == 1) ? 0.30f : ((heroId == 8) ? 0.33f : 0.30f);
        }
        float totalAS = ComputeUnitAttackSpeedSafe(unit); // 100..700
        if (totalAS < 50.0f) totalAS = 100.0f;
        float realWindupSec = (baseAp * 100.0f) / totalAS;
        uint64_t ms = (uint64_t)(realWindupSec * 1000.0f) + 22ULL;
        if (ms < 65ULL) ms = 65ULL;
        if (ms > 650ULL) ms = 650ULL;
        return ms;
    }

    static uint64_t ComputeExactAttackReloadMs(uintptr_t unit) {
        if (!unit || !mem::hp(unit)) return 850ULL;
        float aps = ComputeAttacksPerSecondSafe(unit);
        if (aps < 0.25f) aps = 0.70f;
        uint64_t reloadMs = (uint64_t)(1000.0f / aps);
        if (reloadMs < 160ULL) reloadMs = 160ULL;
        if (reloadMs > 2200ULL) reloadMs = 2200ULL;
        return reloadMs;
    }

    // ============================================================================
    //  ЧАСТЬ 4 (БОГ+): НАТИВНЫЙ СКАНЕР СНАРЯДОВ И КАСТОВ ВРАГОВ (REFLEX DODGER)
    // ============================================================================
    static int CheckIncomingThreatNative(Vector3& outThreatPos) {
        if (!g_Pawn || !mem::hp(g_Pawn) || !g_client) return 0;
        Vector3 myPos = GetHeroPos(g_Pawn);
        uint32_t myHandle = GetNPCCHandle(g_Pawn);
        uint32_t myIdx = (uint32_t)GetEntityIndexFromPtr(g_Pawn);

        uint64_t stateMask = GetNPCStateMask(g_Pawn);
        if ((stateMask & (1ULL << 3)) != 0 || (stateMask & (1ULL << 7)) != 0) {
            outThreatPos = myPos;
            return 2;
        }

        uintptr_t manager = mem::rd<uintptr_t>(g_client + PROJECTILE_MANAGER_RVA);
        if (!manager || !mem::hp(manager)) {
            uintptr_t gr = mem::rd<uintptr_t>(g_client + dwGameRules);
            if (gr && mem::hp(gr)) manager = mem::rd<uintptr_t>(gr + 0x8);
        }
        if (manager && mem::hp(manager)) {
            uintptr_t projArray = manager + PROJECTILE_ARRAY_OFFSET;
            for (int i = 0; i < 256; ++i) {
                uintptr_t pProj = mem::rd<uintptr_t>(projArray + i * 8);
                if (!pProj || !mem::hp(pProj)) continue;

                float px = mem::rd<float>(pProj + 0x0C);
                float py = mem::rd<float>(pProj + 0x10);
                float vx = mem::rd<float>(pProj + 0x18);
                float vy = mem::rd<float>(pProj + 0x1C);
                if (std::fabs(vx) < 1.0f && std::fabs(vy) < 1.0f) {
                    px = mem::rd<float>(pProj + 0x50);
                    py = mem::rd<float>(pProj + 0x54);
                    vx = mem::rd<float>(pProj + 0x68);
                    vy = mem::rd<float>(pProj + 0x6C);
                }
                if (std::fabs(vx) < 10.0f && std::fabs(vy) < 10.0f) continue;

                uint32_t hCaster = mem::rd<uint32_t>(pProj + 0x90);
                uint32_t hTarget = mem::rd<uint32_t>(pProj + 0x94);
                uintptr_t casterEnt = (hCaster != 0 && hCaster != 0xFFFFFFFF) ? ResolveHandle(hCaster) : 0;
                if (casterEnt && mem::hp(casterEnt)) {
                    if (mem::rd<uint8_t>(casterEnt + g_off.m_iTeamNum) == g_LocalTeam) continue;
                    if (!IsRealHeroByFields(casterEnt)) continue;
                }

                float dx = myPos.x - px, dy = myPos.y - py;
                float dist = std::sqrt(dx * dx + dy * dy);
                if (dist > 360.0f || dist < 10.0f) continue;

                bool targetsMe = (hTarget != 0 && hTarget != 0xFFFFFFFF &&
                    (hTarget == myHandle || (hTarget & INDEX_MASK) == myIdx));
                if (!targetsMe) {
                    float spd = std::sqrt(vx * vx + vy * vy);
                    if (spd > 100.0f) {
                        float dot = (dx * vx + dy * vy) / (dist * spd);
                        if (dot > 0.94f) targetsMe = true;
                    }
                }
                if (targetsMe) {
                    outThreatPos = { px, py, myPos.z };
                    return 1;
                }
            }
        }

        for (int i = 0; i < g_CacheCount; ++i) {
            uintptr_t ent = g_CacheEntries[i];
            if (!ent || !mem::hp(ent) || ent == g_Pawn) continue;
            if (mem::rd<uint8_t>(ent + g_off.m_iTeamNum) == g_LocalTeam) continue;
            if (!IsRealHeroByFields(ent)) continue;

            Vector3 ePos = GetHeroPos(ent);
            float dx = myPos.x - ePos.x, dy = myPos.y - ePos.y;
            float dist2 = dx * dx + dy * dy;
            if (dist2 > 680.0f * 680.0f) continue;

            float angleToMe = std::atan2(dy, dx) * 180.0f / 3.14159265f;
            float enemyYaw = GetEntityYawDeg(ent);
            float diff = angleToMe - enemyYaw;
            while (diff > 180.0f) diff -= 360.0f;
            while (diff < -180.0f) diff += 360.0f;
            bool facingMe = (std::fabs(diff) <= 28.0f);
            if (!facingMe) continue;

            for (int s = 0; s < 6; ++s) {
                uintptr_t ab = GetUnitAbilityBySlot(ent, s);
                if (!ab || !mem::hp(ab)) continue;
                if (g_off.m_bInAbilityPhase && mem::rd<bool>(ab + g_off.m_bInAbilityPhase)) {
                    outThreatPos = ePos;
                    return (dist2 <= 330.0f * 330.0f) ? 3 : 1;
                }
            }
        }
        return 0;
    }

