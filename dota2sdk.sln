    inline uintptr_t checkEnt(lua_State* L, int idx) {
        uintptr_t p = 0;
        if (lua_islightuserdata(L, idx)) {
            p = (uintptr_t)lua_touserdata(L, idx);
        }

        else if (lua_istable(L, idx)) {
            lua_getfield(L, idx, "__ptr");
            if (lua_islightuserdata(L, -1)) {
                p = (uintptr_t)lua_touserdata(L, -1);
            }

            lua_pop(L, 1);
        }

        return mem::hp(p) ? p : 0;
    }

    int GetEntityIndexFromPtr(uintptr_t ent) {
        if (!ent || !mem::hp(ent)) return 0;
        uintptr_t ident = mem::rd<uintptr_t>(ent + 0x10);
        if (ident && mem::hp(ident)) {
            uint32_t h = mem::rd<uint32_t>(ident + HANDLE_OFF);
            if (h != 0 && h != 0xFFFFFFFF) return (int)(h & INDEX_MASK);
        }

        return 0;
    }

    static uintptr_t ResolveTrueTreeBinOffset() {
        return 0xBB4; // Железобетонный точный оффсет, найденный через Hooked_PrepareUnitOrders!
    }

    int GetTreeBinaryIdOrIndex(uintptr_t ent) {
        if (!ent || !mem::hp(ent)) return 0;
        int entIdx = GetEntityIndexFromPtr(ent);
        char name[128] = { 0 };
        char rtti[128] = { 0 };
        bool isTree = false;
        if (GetEntityDesignerName(ent, name, sizeof(name)) && strstr(name, "tree") != nullptr) isTree = true;
        if (!isTree && GetRTTIName(ent, rtti, sizeof(rtti)) && (strstr(rtti, "MapTree") != nullptr || strstr(rtti, "TempTree") != nullptr)) isTree = true;

        if (isTree || entIdx >= 16384) {
            uintptr_t trueOff = ResolveTrueTreeBinOffset();
            if (trueOff != 0) {
                int binId = mem::rd<int>(ent + trueOff);
                if (binId > 0 && binId < 8192) {
                    g_TreeByBinId[binId] = ent;
                    return binId;
                }
            }
            // Фоллбэк: в Source 2 деревья карты загружаются по порядку, и (entIdx & 0x3FFF) или порядковый номер в кэше дает рабочий индекс
            int fallbackId = (entIdx >= 16384) ? (entIdx & 0x3FFF) : entIdx;
            if (fallbackId > 0) g_TreeByBinId[fallbackId] = ent;
            return fallbackId;
        }
        return entIdx;
    }

    static uintptr_t ResolveItemHandleStrict(uint32_t h) {
        if (h == 0 || h == 0xFFFFFFFF || h == 0xFFFFFFFE) return 0;
        uintptr_t ent = ResolveHandle(h);
        if (!ent || !mem::hp(ent)) {
            uint32_t idx = h & INDEX_MASK;
            if (idx == 0 || idx >= INDEX_MASK) return 0;
            ent = GetEntity((int)idx);
        }
        if (ent && mem::hp(ent)) {
            char name[64] = { 0 };
            if (GetEntityDesignerName(ent, name, sizeof(name)) && strncmp(name, "item_", 5) == 0) {
                return ent;
            }
        }
        return 0;
    }

    uintptr_t FindUnitItemBySlot(uintptr_t unit, int slot) {
        if (!unit || !mem::hp(unit) || slot < 0 || slot > 18) return 0;
        uintptr_t invOff = g_off.m_Inventory ? g_off.m_Inventory : 0x11C0;
        // ВАЖНО: по +0x20 лежит m_Size (19), а сам массив слотов 0..18 начинается строго с +0x24!
        uintptr_t itemsOff = (g_off.m_hItems ? g_off.m_hItems : 0x20) + 0x04;
        uintptr_t base = unit + invOff + itemsOff;

        uint32_t hFlat = mem::rd<uint32_t>(base + slot * 4);
        if (hFlat == 0 || hFlat == 0xFFFFFFFF) return 0;
        uintptr_t ent = ResolveItemHandleStrict(hFlat);
        if (ent) {
            if (slot == 15 && g_off.m_iCurrentCharges) {
                int charges = mem::rd<int>(ent + g_off.m_iCurrentCharges);
                if (charges <= 0) return 0;
            }
            return ent;
        }
        return 0;
    }

    static std::unordered_map<uintptr_t, uint64_t> g_cachedStateMasks;
    static std::unordered_map<uintptr_t, float> g_cachedHeroArmor;
    static std::unordered_map<uintptr_t, bool> g_cachedVisibility;
    static uint64_t ReadNPCStateMask(uintptr_t p);

    static float ReadBasePhysicalArmor(uintptr_t unit) {
        const uintptr_t offset = g_off.m_flPhysicalArmorValue ? g_off.m_flPhysicalArmorValue : 0x162C;
        return mem::rd<float>(unit + offset);
    }

    static float GetPhysicalArmor(uintptr_t unit) {
        const auto cached = g_cachedHeroArmor.find(unit);
        return cached != g_cachedHeroArmor.end() ? cached->second : ReadBasePhysicalArmor(unit);
    }

    void RefreshEntityCache() {
        const uint64_t now = GetTickCount64();
        if (g_CacheLastTick && now - g_CacheLastTick < kBotTickIntervalMs) return;
        RefreshEntityList(now);
        g_CacheLastTick = now;
        g_cachedStateMasks.clear();
        g_cachedHeroArmor.clear();
        g_cachedVisibility.clear();
        g_CacheCount = 0; g_ItemCacheCount = 0; g_PawnItemCount = 0; g_PawnTpScroll = 0; g_TreeCount = 0; g_RuneCount = 0;
        if (!g_EntityList) return;
        int pawnIdx = (g_Pawn && mem::hp(g_Pawn)) ? UA::GetEntityIndexFromPtr(g_Pawn) : 0;
        int ctrlIdx = (g_LocalController && mem::hp(g_LocalController)) ? UA::GetEntityIndexFromPtr(g_LocalController) : 0;
        int myPid = (g_LocalController && mem::hp(g_LocalController)) ? mem::rd<int>(g_LocalController + g_off.m_nPlayerID) : -1;
        if (myPid < 0 && g_Pawn && mem::hp(g_Pawn)) myPid = mem::rd<int>(g_Pawn + g_off.m_iPlayerID);

        if (g_Pawn && mem::hp(g_Pawn)) {
            for (int s = 0; s <= 16; ++s) {
                uintptr_t slotItem = FindUnitItemBySlot(g_Pawn, s);
                if (!slotItem || !mem::hp(slotItem)) continue;
                char sName[128] = { 0 };
                if (GetEntityDesignerName(slotItem, sName, sizeof(sName)) && strcmp(sName, "item_tpscroll") == 0) {
                    int charges = g_off.m_iCurrentCharges ? mem::rd<int>(slotItem + g_off.m_iCurrentCharges) : 1;
                    if (charges > 0) g_PawnTpScroll = slotItem;
                }
                else if (s <= 5 && g_PawnItemCount < 32) {
                    bool already = false;
                    for (int k = 0; k < g_PawnItemCount; ++k) if (g_PawnItems[k] == slotItem) { already = true; break; }
                    if (!already) g_PawnItems[g_PawnItemCount++] = slotItem;
                }
            }
        }

        uintptr_t fallbackTeamCourier = 0;
        for (int chunkIdx = 0; chunkIdx < 64; ++chunkIdx) {
            uintptr_t chunk = GetEntityChunk(chunkIdx);
            if (!chunk || !mem::hp(chunk)) continue;
            for (int slotInChunk = 0; slotInChunk < 512; ++slotInChunk) {
                int i = (chunkIdx << CHUNK_SHIFT) | slotInChunk;
                if (i <= 0) continue;
                uintptr_t ent = GetEntity(i);
                if (!ent || !mem::hp(ent)) continue;
                char entName[128] = { 0 };
                bool hasName = GetEntityDesignerName(ent, entName, sizeof(entName));
                char rtti[128] = { 0 };
                bool hasRtti = false;

                // 1. Кэшируем ТОЛЬКО реальные руны (отсекаем спавнеры dota_item_rune_spawner_* и уже подобранные руны в тумане!)
                bool isSpawner = (hasName && strstr(entName, "spawner") != nullptr);
                bool isRune = (!isSpawner && hasName && strcmp(entName, "dota_item_rune") == 0);
                if (!isRune && !isSpawner) {
                    hasRtti = GetRTTIName(ent, rtti, sizeof(rtti));
                    if (hasRtti && strstr(rtti, "C_DOTA_Item_Rune") != nullptr && strstr(rtti, "Spawner") == nullptr) isRune = true;
                }
                if (isRune) {
                    uintptr_t scene = mem::rd<uintptr_t>(ent + g_off.m_pGameSceneNode);
                    uint8_t dormant = (scene && mem::hp(scene)) ? mem::rd<uint8_t>(scene + 0x113) : 1;
                    Vector3 rpos = GetHeroPos(ent);
                    if (dormant == 0 && (fabsf(rpos.x) > 10.0f || fabsf(rpos.y) > 10.0f)) {
                        if (g_RuneCount < 64) {
                            g_RuneCache[g_RuneCount++] = ent;
                            g_cachedVisibility.emplace(ent, true);
                        }
                    }
                    continue;
                }
                if (isSpawner) continue;

                // 2. Кэшируем деревья
                bool isTree = (hasName && strstr(entName, "tree") != nullptr);
                if (!isTree) {
                    if (!hasRtti) hasRtti = GetRTTIName(ent, rtti, sizeof(rtti));
                    if (hasRtti && (strstr(rtti, "MapTree") != nullptr || strstr(rtti, "TempTree") != nullptr)) isTree = true;
                }
                if (isTree) {
                    if (g_TreeCount < 4096) g_TreeCache[g_TreeCount++] = ent;
                    continue;
                }

                // 3. Кэшируем предметы
                if (hasName && strncmp(entName, "item_", 5) == 0) {
                    if (g_ItemCacheCount < 1024) g_ItemCacheEntries[g_ItemCacheCount++] = ent;
                    continue;
                }

                // 4. Интерактивные объекты оставляем в кэше: Lua-модули используют их
                // для лотусов, алтарей, порталов и наблюдательных точек. Они не являются
                // валидными целями атаки и фильтруются на уровне order/target. 

                int hp = mem::rd<int>(ent + g_off.m_iHealth);
                int mhp = mem::rd<int>(ent + g_off.m_iMaxHealth);
                if (mhp <= 0 || hp <= 0 || hp > 100000) continue;

                if (g_MapHackEnabled && g_LocalTeam != 0 && mem::rd<uint8_t>(ent + g_off.m_iTeamNum) != g_LocalTeam) {
                    uintptr_t scene = mem::rd<uintptr_t>(ent + g_off.m_pGameSceneNode);
                    if (scene && mem::hp(scene)) {
                        __try { *(uint8_t*)(scene + 0x112) = 1; }
                        __except (EXCEPTION_EXECUTE_HANDLER) {}
                    }
                }

                if (hasName && strstr(entName, "courier") != nullptr && mem::rd<uint8_t>(ent + g_off.m_iTeamNum) == g_LocalTeam) {
                    fallbackTeamCourier = ent;
                    int cOwnerPid = g_off.m_iPlayerOwnerID ? mem::rd<int>(ent + g_off.m_iPlayerOwnerID) : -1;
                    if (myPid >= 0 && cOwnerPid == myPid) {
                        g_CachedCourier = ent;
                    }
                    else {
                        uint32_t hOwner = mem::rd<uint32_t>(ent + g_off.m_hOwnerEntity);
                        uintptr_t ownerEnt = (hOwner != 0 && hOwner != 0xFFFFFFFF) ? ResolveHandle(hOwner) : 0;
                        if (ownerEnt && (ownerEnt == g_Pawn || ownerEnt == g_LocalController)) {
                            g_CachedCourier = ent;
                        }
                    }
                }

                if (hasName && strncmp(entName, "npc_dota_hero_", 14) == 0) {
                    g_cachedHeroArmor.emplace(ent, ReadBasePhysicalArmor(ent));
                    g_cachedStateMasks.emplace(ent, ReadNPCStateMask(ent));
                }
                if (g_CacheCount < 2048) g_CacheEntries[g_CacheCount++] = ent;
            }
        }
        if ((!g_CachedCourier || !mem::hp(g_CachedCourier)) && fallbackTeamCourier) {
            g_CachedCourier = fallbackTeamCourier;
        }
    }

    void BuildLaneWaypoints() {
        for (int i = 0; i < 4; ++i) g_LaneWpCount[i] = 0;
        RefreshEntityCache();
        const float RX = -7300.0f, RY = -6500.0f;
        for (int i = 0; i < g_CacheCount; ++i) {
            uintptr_t ent = g_CacheEntries[i];
            uint32_t ut = mem::rd<uint32_t>(ent + g_off.m_iUnitType);
            bool isTower = (ut & 0x14) == 0x14;
            bool isBarracks = (ut & 0x50) == 0x50;
            if (!isTower && !isBarracks) continue;
            Vector3 pos = GetHeroPos(ent);
            float diff = pos.y - pos.x;
            int lane = 2;
            if (diff > 2000.0f) lane = 1;
            else if (diff < -2000.0f) lane = 3;
            if (g_LaneWpCount[lane] < 16) {
                int n = g_LaneWpCount[lane]++;
                g_LaneWps[lane][n].x = pos.x;
                g_LaneWps[lane][n].y = pos.y;
                g_LaneWps[lane][n].z = pos.z;
            }
        }

        for (int lane = 1; lane <= 3; ++lane) {
            int n = g_LaneWpCount[lane];
            for (int i = 0; i < n - 1; ++i) {
                for (int j = i + 1; j < n; ++j) {
                    float di = (g_LaneWps[lane][i].x - RX) * (g_LaneWps[lane][i].x - RX) + (g_LaneWps[lane][i].y - RY) * (g_LaneWps[lane][i].y - RY);
                    float dj = (g_LaneWps[lane][j].x - RX) * (g_LaneWps[lane][j].x - RX) + (g_LaneWps[lane][j].y - RY) * (g_LaneWps[lane][j].y - RY);
                    if (dj < di) { LaneWp t = g_LaneWps[lane][i]; g_LaneWps[lane][i] = g_LaneWps[lane][j]; g_LaneWps[lane][j] = t; }
                }
            }

            CrashLog("[LANE] lane %d: %d waypoints\n", lane, n);
            for (int i = 0; i < n; ++i) {
                CrashLog("[LANE] [%d] (%.0f,%.0f,%.0f)\n", i,
                    g_LaneWps[lane][i].x, g_LaneWps[lane][i].y, g_LaneWps[lane][i].z);
            }
        }
    }

