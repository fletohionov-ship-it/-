static void LoadItemsFullJson() {
    InitBuiltinItemIds();
    std::wstring path = GetDllDirW() + L"scripts\\items_full.json";
    std::string buf;
    if (!readFileBytesKV(path, buf) || buf.empty()) {
        CrashLog("[ITEMS_JSON] Using %zu built-in Dota 2 item IDs!\n", g_itemIdsByName.size() / 2);
        return;
    }

    size_t pos = 0;
    int count = 0;
    while ((pos = buf.find("\"name\"", pos)) != std::string::npos) {
        size_t nameStart = buf.find("\"", pos + 6);
        size_t nameEnd = buf.find("\"", nameStart + 1);
        if (nameStart == std::string::npos || nameEnd == std::string::npos) break;
        std::string name = buf.substr(nameStart + 1, nameEnd - nameStart - 1);
        size_t idPos = buf.find("\"id\"", nameEnd);
        if (idPos != std::string::npos && idPos - nameEnd < 300) {
            size_t colonPos = buf.find(":", idPos);
            if (colonPos != std::string::npos) {
                size_t numStart = buf.find_first_of("0123456789", colonPos);
                if (numStart != std::string::npos) {
                    size_t numEnd = buf.find_first_not_of("0123456789", numStart);
                    int id = atoi(buf.substr(numStart, numEnd - numStart).c_str());
                    if (id > 0) {
                        g_itemIdsByName[name] = id;
                        if (name.find("item_") == 0) g_itemIdsByName[name.substr(5)] = id;
                        count++;
                    }
                }
            }
        }

        pos = nameEnd;
    }

    CrashLog("[ITEMS_JSON] Parsed %d item IDs (total mapped: %zu)\n", count, g_itemIdsByName.size());
}

static void ScanItemsRecursive(const std::vector<KVEntry>& list) {
    for (const auto& node : list) {
        if (node.hasChildren) {
            if (node.key.find("item_") == 0) {
                for (const auto& sub : node.children) {
                    if (sub.key == "ID" || sub.key == "id") {
                        int id = atoi(sub.value.c_str());
                        if (id > 0) {
                            g_itemIdsByName[node.key] = id;
                            g_itemIdsByName[node.key.substr(5)] = id;
                        }
                    }
                }
            }

            ScanItemsRecursive(node.children);
        }
    }
}

static void LoadKVFile(lua_State* L, const std::string& kvName, const std::vector<std::wstring>& candidates) {
    std::string buf; bool loaded = false;
    for (auto& path : candidates) {
        CrashLog("[KV] trying %ls\n", path.c_str());
        if (readFileBytesKV(path, buf) && !buf.empty()) { CrashLog("[KV] FOUND %s: %zu bytes\n", kvName.c_str(), buf.size()); loaded = true; break; }
    }

    if (loaded) {
        KVParser parser(buf); std::vector<KVEntry> entries;
        if (parser.parseEntries(entries) && !entries.empty()) {
            CrashLog("[KV] %s parsed %zu top-level entries\n", kvName.c_str(), entries.size());
            if (kvName == "items" && !entries.empty()) {
                ScanItemsRecursive(entries);
                CrashLog("[KV] Mapped %zu item IDs for QuickBuy\n", g_itemIdsByName.size());
            }

            if (kvName == "npc_heroes" && !entries.empty()) {
                for (const auto& child : entries[0].children) {
                    if (child.hasChildren) {
                        for (const auto& subchild : child.children) {
                            if (subchild.key == "HeroID" || subchild.key == "heroid") {
                                int id = atoi(subchild.value.c_str());
                                if (id > 0) g_heroNamesById[id] = child.key;
                            }
                        }
                    }

                    else {
                        int valId = atoi(child.value.c_str());
                        if (valId > 0 && child.key.find("npc_dota_hero_") == 0) {
                            g_heroNamesById[valId] = child.key;
                        }

                        else {
                            int keyId = atoi(child.key.c_str());
                            if (keyId > 0 && child.value.find("npc_dota_hero_") == 0) {
                                g_heroNamesById[keyId] = child.value;
                            }
                        }
                    }
                }

                CrashLog("[KV] Mapped %zu hero IDs\n", g_heroNamesById.size());
            }

            kvEntriesToLua(L, entries);
            int ref = luaL_ref(L, LUA_REGISTRYINDEX); g_kvRefs[kvName] = ref; return;
        }

        CrashLog("[KV] %s parse failed\n", kvName.c_str());
    }

    else CrashLog("[KV] %s NOT FOUND\n", kvName.c_str());
    lua_newtable(L);
    int ref = luaL_ref(L, LUA_REGISTRYINDEX); g_kvRefs[kvName] = ref;
    CrashLog("[KV] %s -> empty stored\n", kvName.c_str());
}

