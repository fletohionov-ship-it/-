    // Helper to call native Lua wrappers
    static float CallNativeFloatWrapper(uintptr_t rva, lua_State* L, uintptr_t entity) {
        if (!g_client) return 0.0f;
        uintptr_t fnAddr = g_client + rva;
        typedef float(__fastcall* Fn)(lua_State*, uint32_t);
        Fn fn = (Fn)fnAddr;
        if (!fn || !mem::isCodePtr((uintptr_t)fn, "client.dll")) return 0.0f;
        uint32_t handle = UA::GetNPCCHandle(entity);
        if (handle == 0xFFFFFFFF) return 0.0f;
        __try { return fn(L, handle); }
        __except (EXCEPTION_EXECUTE_HANDLER) { return 0.0f; }
    }

