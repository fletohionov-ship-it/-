    int NPC_GetTimeToFacePosition(lua_State* L) {
        uintptr_t self = checkEnt(L, 1);
        if (!self || !mem::hp(self)) { lua_pushnumber(L, 0.0); return 1; }
        float tx = 0.0f, ty = 0.0f;
        if (lua_isuserdata(L, 2)) {
            LuaVector* v = (LuaVector*)lua_touserdata(L, 2);
            if (!v) { lua_pushnumber(L, 0.0); return 1; }
            tx = v->x; ty = v->y;
        }

        else if (lua_istable(L, 2)) {
            lua_getfield(L, 2, "x"); tx = (float)lua_tonumber(L, -1); lua_pop(L, 1);
            lua_getfield(L, 2, "y"); ty = (float)lua_tonumber(L, -1); lua_pop(L, 1);
        }

        else {
            tx = (float)lua_tonumber(L, 2);
            ty = (float)lua_tonumber(L, 3);
        }

        Vector3 selfPos = GetHeroPos(self);
        float dx = tx - selfPos.x;
        float dy = ty - selfPos.y;
        if (dx * dx + dy * dy < 1.0f) { lua_pushnumber(L, 0.0); return 1; }
        float targetYaw = atan2f(dy, dx) * 180.0f / 3.14159f;
        float selfYaw = GetEntityYawDeg(self);
        float diff = targetYaw - selfYaw;
        while (diff > 180.0f) diff -= 360.0f;
        while (diff < -180.0f) diff += 360.0f;
        diff = fabsf(diff);
        lua_pushnumber(L, (diff <= 11.5f) ? 0.0 : (double)(diff / 180.0f * 0.12f));
        return 1;
    }

    int NPC_GetTimeToFace(lua_State* L) {
        uintptr_t self = checkEnt(L, 1);
        uintptr_t target = checkEnt(L, 2);
        if (!self || !target || !mem::hp(self) || !mem::hp(target)) { lua_pushnumber(L, 0.0); return 1; }
        Vector3 selfPos = GetHeroPos(self);
        Vector3 targetPos = GetHeroPos(target);
        float dx = targetPos.x - selfPos.x;
        float dy = targetPos.y - selfPos.y;
        if (dx * dx + dy * dy < 1.0f) { lua_pushnumber(L, 0.0); return 1; }
        float targetYaw = atan2f(dy, dx) * 180.0f / 3.14159f;
        float selfYaw = GetEntityYawDeg(self);
        float diff = targetYaw - selfYaw;
        while (diff > 180.0f) diff -= 360.0f;
        while (diff < -180.0f) diff += 360.0f;
        diff = fabsf(diff);
        lua_pushnumber(L, (diff <= 11.5f) ? 0.0 : (double)(diff / 180.0f * 0.12f));
        return 1;
    }

    int NPC_FindFacingNPC(lua_State* L) {
        uintptr_t self = checkEnt(L, 1);
        int teamFilter = (int)lua_tointeger(L, 3);
        double maxAngle = lua_tonumber(L, 4);
        double maxRange = lua_tonumber(L, 5);
        if (!self || !mem::hp(self)) { lua_pushnil(L); return 1; }
        Vector3 selfPos = GetHeroPos(self);
        uint8_t selfTeam = mem::rd<uint8_t>(self + g_off.m_iTeamNum);
        float selfYaw = GetEntityYawDeg(self);
        uintptr_t best = 0;
        double bestDist = 1e18;
        for (int i = 0; i < g_CacheCount; ++i) {
            uintptr_t ent = g_CacheEntries[i];
            if (!ent || !mem::hp(ent) || ent == self) continue;
            uint32_t ut = mem::rd<uint32_t>(ent + g_off.m_iUnitType);
            uint8_t t = mem::rd<uint8_t>(ent + g_off.m_iTeamNum);
            if (teamFilter == 2 && t != selfTeam) continue; // friendly
            if (teamFilter == 3 && t == selfTeam) continue; // enemy
            int mhp = mem::rd<int>(ent + g_off.m_iMaxHealth);
            if (mhp <= 0) continue;
            Vector3 p = GetHeroPos(ent);
            double dx = (double)p.x - (double)selfPos.x;
            double dy = (double)p.y - (double)selfPos.y;
            double d2 = dx * dx + dy * dy;
            if (d2 > maxRange * maxRange) continue;
            // Calculate target yaw and angle difference
            float targetYaw = atan2f((float)dy, (float)dx) * 180.0f / 3.14159f;
            float diff = targetYaw - selfYaw;
            while (diff > 180.0f) diff -= 360.0f;
            while (diff < -180.0f) diff += 360.0f;
            diff = fabsf(diff);
            if (diff > maxAngle) continue; // Skip if angle too large
            if (d2 < bestDist) { bestDist = d2; best = ent; }
        }

        if (!best) { lua_pushnil(L); return 1; }
        pushEntityWithMetatable(L, best);
        return 1;
    }

