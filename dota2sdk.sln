    static bool IsAbilityReadyInternal(lua_State* L, uintptr_t a) {
        if (!a || !mem::hp(a)) return false;
        char name[128] = { 0 };
        if (!GetEntityDesignerName(a, name, sizeof(name)) || !name[0]) return false;
        bool isItem = (strncmp(name, "item_", 5) == 0);
        if (!isItem) {
            if (ReadAbilityLevelSafe(a) <= 0) return false;
            int beh = ParseBehaviorMaskFromKV(L, a);
            if ((beh & (1 << 1)) != 0 || (beh & (1 << 2)) != 0) return false;
        }

        else {
            if ((strstr(name, "magic_stick") || strstr(name, "magic_wand")) && ReadItemChargesSafe(a) <= 0) {
                return false;
            }
        }

        if (GetEffectiveCooldown(a) > 0.05f) return false;
        return true;
    }

